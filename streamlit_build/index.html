es model-routing (smaller model for simple requests) as an optimisation`],followUps:[`How would you decide which requests are "simple" versus "complex" automatically?`,`What would you measure to know the system got faster?`],tags:[`fnb`,`performance`]},{id:`proj-028`,category:`Project Questions`,difficulty:`Intermediate`,question:`How would you reduce LLM costs?`,answer:`The biggest lever is avoiding unnecessary calls in the first place — caching repeated context like schema details, and routing straightforward requests to a smaller, cheaper model while only using a larger model for harder cases. I'd also look at prompt length, since trimming unnecessary context directly reduces token cost per call, and at whether the Verifier Agent truly needs an LLM call for every check or whether some of its checks can be done with plain code instead, which is both cheaper and more deterministic.`,keyPoints:[`Names caching and model-tiering as primary cost levers`,`Mentions prompt trimming as a direct token-cost reduction`,`Suggests replacing some LLM verification checks with deterministic code`],followUps:[`How would you measure cost per request in this system?`,`Is there a risk in replacing LLM checks with deterministic code?`],tags:[`fnb`,`cost-optimisation`,`llm`]},{id:`proj-029`,category:`Project Questions`,difficulty:`Intermediate`,question:`How would you scale the system?`,answer:`I'd start by making the pipeline stateless per request so multiple instances could run behind a load balancer, handling many concurrent user requests independently. I'd also look at where LLM calls become the bottleneck and consider a queue so spikes in demand don't overwhelm the system, processing requests as capacity allows rather than dropping them. On the database side, since we're read-only, I'd consider read replicas so a high volume of verified queries doesn't put pressure on a single database instance.`,keyPoints:[`Explains statelessness as key to horizontal scaling`,`Introduces queuing to smooth out demand spikes`,`Suggests read replicas, which fits naturally with the read-only design`],followUps:[`How would you handle a sudden spike in requests during peak banking hours?`,`What would you monitor to know when to scale up?`],tags:[`fnb`,`scalability`,`system-design`]},{id:`proj-030`,category:`Project Questions`,difficulty:`Intermediate`,question:`How would you deploy the system?`,answer:`I'd containerise the pipeline with Docker so it runs consistently across environments, expose it behind a FastAPI service, and deploy it to a managed environment like a Kubernetes cluster or a cloud container service so it can scale and restart automatically if something fails. I'd keep configuration like database credentials and model API settings in environment variables or a secrets manager rather than in the codebase, and set up a proper CI pipeline to run tests before anything reaches production.`,keyPoints:[`Names containerisation (Docker) and an orchestrator for resilience/scaling`,`Chooses FastAPI as the service layer, consistent with the user's known stack`,`Mentions secrets management and CI as part of a real deployment, not just "push to server"`],followUps:[`What would your CI pipeline actually check before deployment?`,`How would you handle zero-downtime deployments for this kind of service?`],tags:[`fnb`,`deployment`]},{id:`proj-031`,category:`Project Questions`,difficulty:`Intermediate`,question:`How would you monitor the system?`,answer:`I'd track both system health and AI-specific behaviour. On the system side: request latency, error rates, and database connection health, using standard monitoring tools. On the AI side, which is easy to overlook: how often the Verifier Agent rejects a query, how many retries requests typically need, and any drift in those numbers over time, since a rising rejection rate could mean the Code Agent's prompt needs attention or the schema has changed. I'd also want alerting if verification failures spike suddenly, since that could indicate a real problem rather than normal noise.`,keyPoints:[`Separates system-level monitoring from AI-behaviour-specific monitoring`,`Names concrete AI-specific metrics: rejection rate, retry counts, drift over time`,`Adds alerting on anomalies, not just passive dashboards`],followUps:[`What would count as a "normal" verification rejection rate versus a concerning one?`,`How would you detect if the underlying LLM provider changed model behaviour?`],tags:[`fnb`,`monitoring`,`observability`]},{id:`proj-032`,category:`Project Questions`,difficulty:`Intermediate`,question:`What happens if the LLM goes down?`,answer:`The pipeline can't generate new requirements or SQL without it, so I'd want the system to fail gracefully — returning a clear message that the service is temporarily unavailable rather than hanging or crashing. Practically, I'd add retries with backoff for transient failures, and ideally a fallback to a secondary model provider for a genuine outage, so a single provider's downtime doesn't take the whole system offline. I'd also make sure any partially completed request state doesn't get lost or corrupted if the LLM call fails mid-pipeline.`,keyPoints:[`Prioritises graceful failure with a clear user-facing message`,`Adds retries with backoff for transient issues`,`Suggests a fallback provider for genuine outages, and protecting in-flight state`],followUps:[`How would you decide when to fail over to a secondary provider automatically?`,`What would the user actually see during an outage?`],tags:[`fnb`,`reliability`,`failure-handling`]},{id:`proj-033`,category:`Project Questions`,difficulty:`Intermediate`,question:`What happens if PostgreSQL goes down?`,answer:`Since the pipeline depends on the database for both schema verification and query execution, I'd want it to detect a connection failure quickly and return a clear, specific error rather than a generic crash. I'd add connection retries with a short backoff for brief blips, and health checks so the service knows the database is unavailable before even attempting a full pipeline run, saving an unnecessary and costly LLM call for a request that can't complete anyway. For a production system, I'd also want a standby replica to fail over to.`,keyPoints:[`Focuses on fast, clear failure detection over silent hangs`,`Adds a smart optimisation: check DB health before spending an LLM call`,`Mentions standby/replica failover for production-grade reliability`],followUps:[`How would the health check actually be implemented?`,`What is the cost trade-off of checking database health before every request?`],tags:[`fnb`,`reliability`,`database`]},{id:`proj-034`,category:`Project Questions`,difficulty:`Intermediate`,question:`How would you test the system?`,answer:`I'd test at multiple levels. Unit tests for individual pieces like the schema-checking logic in the Verifier Agent, using known-good and known-bad SQL samples. Integration tests running realistic natural-language requests through the full pipeline and checking that the final SQL and result are correct. And a specific set of adversarial test cases designed to try to produce hallucinated or malicious SQL, to make sure the guardrails actually hold under deliberate pressure, not just normal use.`,keyPoints:[`Separates unit tests, integration tests, and adversarial/security-focused tests`,`Gives a concrete unit-test example (schema checking with good/bad SQL)`,`Explicitly calls out adversarial testing of the safety guardrails`],followUps:[`Can you give an example of an adversarial test case you would write?`,`How do you decide when the test suite gives you enough confidence to ship a change?`],tags:[`fnb`,`testing`]},{id:`proj-035`,category:`Project Questions`,difficulty:`Intermediate`,question:`How would you handle sensitive banking information?`,answer:`First, minimise exposure — the pipeline should only ever see the data it strictly needs to answer a given request, not broad dumps of customer information. Second, make sure logging never captures sensitive values in plain text; if we log a query for debugging, sensitive fields should be masked. Third, enforce access control so only authorised users or systems can even submit requests to the pipeline in the first place, and keep the read-only database role scoped to only the tables genuinely needed.`,keyPoints:[`Leads with data minimisation as the first principle`,`Explicitly addresses log masking, an easy-to-miss but important detail`,`Ties access control and least-privilege scoping together`],followUps:[`How would you mask sensitive fields in logs practically?`,`What compliance considerations (like POPIA) would apply here?`],tags:[`fnb`,`security`,`privacy`]},{id:`proj-036`,category:`Project Questions`,difficulty:`Intermediate`,question:`How would you handle incorrect AI output?`,answer:`If the Verifier Agent catches it, the system already handles it through the refinement loop. But for output that's structurally valid yet logically wrong for what the user actually meant — which verification can't always catch — I'd want a way for the user to flag the result as incorrect, and log that case for review. Over time, those flagged cases become useful data for improving the Requirement Agent's prompt or adding new verification rules that catch that class of mistake in future.`,keyPoints:[`Distinguishes structural errors (already caught) from logical/intent errors (harder to catch)`,`Introduces user feedback as a mechanism to catch what verification misses`,`Frames flagged cases as a feedback loop for continuous improvement`],followUps:[`How would you build that user-feedback flagging into the interface?`,`How often would you expect this kind of logical error to happen?`],tags:[`fnb`,`error-handling`,`human-in-the-loop`]},{id:`proj-037`,category:`Project Questions`,difficulty:`Intermediate`,question:`How would you implement human-in-the-loop?`,answer:`I'd add a review step for higher-risk or higher-impact requests — for example, anything touching a large number of records or unusual patterns — where a human approves the generated and verified SQL before it actually executes, rather than everything running fully automatically. Lower-risk, routine requests could still run automatically since the existing guardrails already cover them well. This way human oversight is focused where it adds the most value, instead of becoming a bottleneck on every single request.`,keyPoints:[`Proposes risk-based routing: not everything needs human review`,`Gives a concrete example of what would trigger review (large record counts, unusual patterns)`,`Balances safety with not creating an approval bottleneck`],followUps:[`How would you define "higher-risk" precisely enough to automate the routing decision?`,`Who would realistically be the human reviewer in a bank setting?`],tags:[`fnb`,`human-in-the-loop`]},{id:`proj-038`,category:`Project Questions`,difficulty:`Intermediate`,question:`How would you improve the accuracy of the system?`,answer:`I'd start by building a proper evaluation set of realistic banking requests with known-correct SQL, so we can measure accuracy objectively instead of relying on impressions from manual testing. From there, I'd look at where errors cluster — is it the Requirement Agent misunderstanding intent, or the Code Agent struggling with a certain kind of join or filter — and target improvements specifically at that weak point, whether that's better prompting, more schema context, or few-shot examples of similar correct queries.`,keyPoints:[`Starts with building a measurable evaluation set, showing a data-driven mindset`,`Explains diagnosing which agent is the actual source of errors`,`Names concrete levers: better prompting, more context, few-shot examples`],followUps:[`What would a good evaluation set actually contain?`,`How would you use few-shot examples specifically to improve the Code Agent?`],tags:[`fnb`,`evaluation`,`improvements`]},{id:`proj-039`,category:`Project Questions`,difficulty:`Beginner`,question:`What did you personally contribute to the project?`,answer:`I worked specifically on parts of the agent logic and the Verifier Agent's schema-checking and read-only enforcement, and I was one of the people who identified and fixed the SQL-hallucination issue by tightening schema context and adding the refinement loop with failure reasons. I also contributed to how the team agreed on the shared state format between agents, which came out of a discussion I raised early on to avoid rework later.`,keyPoints:[`Names specific, concrete contributions rather than a vague "I helped with everything"`,`Ties contribution to the hallucination fix and refinement loop already discussed`,`Mentions a process contribution (shared state format) alongside code contribution`],followUps:[`If a teammate described your contribution, would they say the same thing?`,`What part of the project are you least proud of your contribution to?`],tags:[`fnb`,`personal-contribution`]},{id:`proj-040`,category:`Project Questions`,difficulty:`Intermediate`,question:`If you rebuilt the project today, what would you change?`,answer:`I'd invest in the evaluation and testing setup much earlier instead of building it up gradually — having a fixed set of realistic requests with known-correct answers from day one would have caught issues like the hallucination problem faster and with more confidence. I'd also design the shared state format more deliberately upfront as a team, with a clear schema, rather than letting it evolve organically as we went, since a couple of our early integration issues traced back to assumptions about what fields would be present in state.`,keyPoints:[`Prioritises earlier investment in evaluation/testing as the top change`,`Names a second concrete change: designing the shared state schema deliberately upfront`,`Both changes are realistic, specific lessons rather than vague hindsight`],followUps:[`How would you convince a team to invest in testing infrastructure before building features?`,`What would an upfront state schema design session actually look like?`],tags:[`fnb`,`retrospective`]}],Zi=[{id:`proj-041`,category:`Project Questions`,difficulty:`Beginner`,question:`Tell us about your StudyTogether project.`,answer:`StudyTogether is a collaborative study platform I built on my own initiative, aimed at high-school learners who want to study together online. It has study rooms where learners can join, friends lists, room administration with rules, and backend APIs and a database behind all of that. I wanted to explore how AI could add real value to studying — like accountability features — while also just building a solid, real full-stack product outside of any coursework or assignment.`,keyPoints:[`Frames it clearly as a self-initiated project, not an assignment`,`Names the concrete features: study rooms, friends, room admin/rules`,`Connects it to genuine interest in AI-assisted education`],followUps:[`What made you decide to build this specifically?`,`What stage is the project at currently?`],tags:[`studytogether`,`overview`]},{id:`proj-042`,category:`Project Questions`,difficulty:`Beginner`,question:`What problem does StudyTogether solve?`,answer:`A lot of high-school learners study alone and lose motivation or accountability without realising it, especially outside of formal class time. StudyTogether gives them a shared virtual space to study together, similar to how people use co-working spaces, with room rules and light accountability features to help them actually stay focused rather than just being on a call with friends. It's about making self-directed studying feel less isolating and more structured.`,keyPoints:[`Names the real problem: isolation and lack of accountability in solo studying`,`Uses a relatable analogy (co-working spaces) to explain the concept`,`Distinguishes it from just "being on a call" by emphasising structure/rules`],followUps:[`How do the room rules actually work in practice?`,`How do you know learners are more focused using this than studying alone?`],tags:[`studytogether`,`problem-statement`]},{id:`proj-043`,category:`Project Questions`,difficulty:`Beginner`,question:`Why did you build it?`,answer:`I wanted a project that was fully mine end to end, where I made every product and technical decision myself, as a way to grow beyond what the learnership curriculum covers. I also genuinely believe in the problem — I remember struggling with staying accountable studying alone in school, and I thought a simple, well-built platform could help with that for current learners. It was as much about building real product and engineering judgement as it was about the idea itself.`,keyPoints:[`Shows personal motivation to grow beyond assigned coursework`,`Ties to authentic personal experience with the problem`,`Frames it as deliberate skill-building, not just "I had an idea"`],followUps:[`What specific skills were you hoping to build that the learnership does not cover?`,`How much of the idea came from your own school experience versus research?`],tags:[`studytogether`,`motivation`]},{id:`proj-044`,category:`Project Questions`,difficulty:`Beginner`,question:`Who are the target users?`,answer:`The primary users are high-school learners, particularly those preparing for exams who want structure and peer accountability while studying outside school hours. Secondary users would be small study groups or even a few friends who already study together informally and want a dedicated space with rules and structure rather than just an ad-hoc video call. It's deliberately narrow — high-school learners — rather than trying to serve university students or professionals too, at least in this version.`,keyPoints:[`Names a specific, narrow primary user (high-school learners)`,`Adds a realistic secondary use case (existing informal study groups)`,`Shows deliberate scoping rather than trying to serve everyone`],followUps:[`Why did you choose to scope it to high-school learners specifically rather than university students too?`,`How would the product change if you expanded to university students?`],tags:[`studytogether`,`users`]},{id:`proj-045`,category:`Project Questions`,difficulty:`Intermediate`,question:`Explain the architecture.`,answer:`It follows a fairly standard full-stack structure — a backend exposing APIs for authentication, study rooms, friends and room administration, backed by a relational database storing users, rooms, memberships and rules. The frontend consumes those APIs to render the study room experience. I kept the architecture deliberately simple and modular so that features like the AI accountability concepts could be added later as a separate service rather than being tangled into the core room/user logic from the start.`,keyPoints:[`Describes a standard, sensible full-stack layout: API backend, relational DB, frontend`,`Explains modularity as a deliberate choice to keep AI features decoupled`,`Keeps the description honest about it being a fairly standard structure rather than overselling complexity`],followUps:[`What backend framework and database did you use specifically?`,`How do rooms, users and rules relate to each other in your schema?`],tags:[`studytogether`,`architecture`]},{id:`proj-046`,category:`Project Questions`,difficulty:`Intermediate`,question:`What role does AI play in the system?`,answer:`AI is mainly explored around accountability — the idea of using signals like activity in the room, or potentially computer vision, to give learners gentle feedback on whether they're actually engaged in the study session. It's intentionally a smaller, more careful part of the product rather than the core of it, because I'm conscious that anything monitoring learners, especially minors, has to be handled very carefully in terms of privacy and fairness, so it's been treated as an experimental, opt-in layer on top of the core study-room product.`,keyPoints:[`Positions AI as an accountability layer, not the core product`,`Shows deliberate caution given the user base includes minors`,`Frames it as opt-in and experimental rather than a default, invasive feature`],followUps:[`What would the simplest, lowest-risk version of this AI feature look like?`,`How would you test whether this feature actually helps or just annoys users?`],tags:[`studytogether`,`ai`,`ethics`]},{id:`proj-047`,category:`Project Questions`,difficulty:`Intermediate`,question:`How could AI detect whether a student is sleeping?`,answer:`The general approach would be computer vision using the learner's webcam feed, looking for signals like prolonged eye closure, head position (like a head dropping forward or resting on a hand), and lack of movement over an extended period. You'd typically use a face and landmark detection model to track eye aspect ratio and head pose over time, rather than making a decision from a single frame, since a single closed-eye frame could just be a blink. It's a genuinely hard problem to get right reliably.`,keyPoints:[`Names concrete, plausible signals: eye closure duration, head pose, lack of movement`,`Mentions eye aspect ratio and head pose as real computer-vision techniques`,`Notes the importance of looking over time, not a single frame, to avoid false positives`],followUps:[`What model or library would you actually use for face/landmark detection?`,`How would you tune the threshold for "prolonged" eye closure?`],tags:[`studytogether`,`computer-vision`]},{id:`proj-048`,category:`Project Questions`,difficulty:`Intermediate`,question:`What computer vision approach could you use?`,answer:`A practical approach would be a lightweight face landmark detection model, like something built on MediaPipe or a similar library, to track eye aspect ratio and head pose in real time on the client side rather than sending raw video to a server. Running it client-side is important both for privacy and for reducing bandwidth and server cost. The output would be simple, low-dimensional signals — 'eyes closed for over N seconds', 'head tilted beyond X degrees' — rather than storing or transmitting actual video or images.`,keyPoints:[`Names a realistic, lightweight technique (MediaPipe-style landmark detection)`,`Explicitly chooses client-side processing for privacy and cost reasons`,`Emphasises reducing raw video to simple signals rather than storing footage`],followUps:[`Why is client-side processing better here than sending video to a server?`,`What would you do with a detected signal once you have it?`],tags:[`studytogether`,`computer-vision`,`privacy`]},{id:`proj-049`,category:`Project Questions`,difficulty:`Intermediate`,question:`What are the limitations of this approach?`,answer:`It can easily misread context — someone resting their eyes briefly while thinking, wearing glasses that create glare, poor lighting, or a webcam angle that makes head-pose estimation unreliable, can all trigger a false 'not studying' signal. It also can't tell the difference between someone sleeping and someone reading printed material off-screen, which is a completely normal part of studying. Because of that, I don't think this kind of signal should ever be used punitively or shown as a hard judgement — at most it's a soft, private nudge to the learner themselves.`,keyPoints:[`Names concrete failure modes: glasses/glare, lighting, camera angle, reading off-screen`,`Clearly distinguishes normal studying behaviour from "not engaged"`,`Draws the ethical conclusion: soft private nudge only, never punitive judgement`],followUps:[`How would you design the "nudge" so it does not feel invasive?`,`Would you ever show this data to a parent or teacher? Why or why not?`],tags:[`studytogether`,`limitations`,`ethics`]},{id:`proj-050`,category:`Project Questions`,difficulty:`Intermediate`,question:`How would you reduce false positives?`,answer:`I'd require a sustained signal over a meaningful time window rather than reacting to a single frame — for example, eyes closed continuously for 20-30 seconds rather than a couple of seconds, which naturally filters out blinking or brief eye rest. I'd also combine multiple signals rather than relying on one; head pose plus eye closure together is more reliable than either alone. And I'd let users correct the system — if a learner marks a flagged moment as inaccurate, that feedback could help tune thresholds over time.`,keyPoints:[`Uses time-windowed detection to filter out normal blinking/brief movements`,`Combines multiple signals rather than relying on one weak signal`,`Introduces a user feedback/correction loop to improve accuracy over time`],followUps:[`How would you use that user correction data without it being gamed?`,`What time window would you start testing with, and why?`],tags:[`studytogether`,`computer-vision`,`reliability`]},{id:`proj-051`,category:`Project Questions`,difficulty:`Intermediate`,question:`How would you protect student privacy?`,answer:`The most important decision is processing video on the learner's own device and never uploading or storing raw footage — only simple derived signals, if any, would ever leave the device, and ideally not even those. I'd make the feature fully opt-in with a clear, plain-language explanation of what it does before anyone turns it on, and give an obvious way to turn it off at any time. Given many users would be minors, I'd also want parental awareness or consent built into onboarding, not treated as an afterthought.`,keyPoints:[`Prioritises on-device processing and never storing raw video`,`Makes the feature opt-in with clear, plain-language explanation upfront`,`Explicitly addresses the minors angle with parental consent in onboarding`],followUps:[`How would you communicate this clearly to a 15-year-old user versus their parent?`,`What data, if any, would you be comfortable storing at all?`],tags:[`studytogether`,`privacy`,`ethics`]},{id:`proj-052`,category:`Project Questions`,difficulty:`Intermediate`,question:`How would you handle consent?`,answer:`Consent needs to be explicit, specific and revocable — not a single blanket 'I agree to terms' checkbox at signup, but a distinct opt-in specifically for any camera-based accountability feature, explained in plain language a teenager would actually understand. Given the target users are minors, I'd also want a parent or guardian to be informed or to consent, depending on age, before the feature is enabled, and I'd make it trivially easy to withdraw consent at any time without losing access to the rest of the platform.`,keyPoints:[`Distinguishes specific, feature-level consent from a generic terms checkbox`,`Uses plain language appropriate for a teenage audience`,`Ensures withdrawing consent does not lock users out of the core, non-AI product`],followUps:[`At what age would you require parental consent versus letting the learner decide themselves?`,`How would you design the consent flow in the UI?`],tags:[`studytogether`,`consent`,`ethics`]},{id:`proj-053`,category:`Project Questions`,difficulty:`Intermediate`,question:`How would you prevent AI from unfairly penalizing students?`,answer:`The core design choice is to never let this kind of signal automatically penalise anyone — no reduced access, no visible 'score' shown to others, no reporting to a teacher or parent based purely on an AI inference. At most, it's a private, personal nudge to the learner themselves, framed supportively rather than as a judgement. I'd also make sure learners can dispute or dismiss a flagged moment easily, and I'd regularly review how often the system flags normal behaviour incorrectly, since a feature that frequently misjudges people will just erode trust in the whole product.`,keyPoints:[`Sets a firm design rule: never automatically penalise based on this signal`,`Frames any output as a private, supportive nudge, not a public or reported score`,`Adds a dispute/dismiss mechanism plus ongoing review of false-positive rates`],followUps:[`What would you do if a learner felt the feature was unfair despite these safeguards?`,`Would you ever aggregate this data across a class or group? Why or why not?`],tags:[`studytogether`,`fairness`,`ethics`]},{id:`proj-054`,category:`Project Questions`,difficulty:`Intermediate`,question:`How would you scale StudyTogether?`,answer:`I'd design the backend APIs to be stateless so I can run multiple instances behind a load balancer as user numbers grow, and use a managed, scalable database rather than something that only works well at small scale. For the study-room experience specifically, real-time features like presence and room activity would need a proper pub/sub or websocket infrastructure that can handle many concurrent rooms, rather than a naive polling approach that gets expensive fast as usage grows.`,keyPoints:[`Applies statelessness for horizontal scaling of the API layer`,`Chooses a managed, scalable database over an ad hoc small-scale one`,`Identifies real-time room presence/activity as the trickiest scaling problem, needing pub/sub or websockets`],followUps:[`What would you use specifically for the real-time presence feature — websockets, polling, something else?`,`How would you shard or partition data if user numbers grew very large?`],tags:[`studytogether`,`scalability`]},{id:`proj-055`,category:`Project Questions`,difficulty:`Intermediate`,question:`What was technically difficult?`,answer:`Designing the database schema for study rooms was trickier than I expected — modelling rooms, memberships, roles like admin versus member, and room-specific rules in a way that was flexible enough for different room configurations but still simple to query, took a couple of iterations to get right. I initially under-modelled it, which meant I had to redesign the schema once I actually started building the room administration features and realised the first version couldn't support multiple admins or custom rules cleanly.`,keyPoints:[`Names a specific, real technical difficulty: room/membership/role schema design`,`Is honest about needing a redesign rather than getting it right the first time`,`Ties back to a genuine "tell us about a time you failed" story already covered`],followUps:[`What does the final schema look like now?`,`What would you do differently if you designed this schema again from scratch?`],tags:[`studytogether`,`challenge`,`database`]},{id:`proj-056`,category:`Project Questions`,difficulty:`Beginner`,question:`What did you learn from building it?`,answer:`I learned how much product thinking matters alongside technical skill — deciding what not to build, like holding off on the computer-vision feature, was as important as the features I did build. I also got much more comfortable designing a real database schema from scratch and iterating on it once real requirements showed the first version wasn't flexible enough. And building something with real potential users, even if it's still early, made me think much more seriously about privacy and consent than a purely academic project would have.`,keyPoints:[`Highlights product judgement (what not to build) as a real lesson`,`Names concrete technical growth: database schema design and iteration`,`Connects the project to genuinely internalising privacy/consent thinking`],followUps:[`How has this changed how you approach the FNB project's design decisions?`,`What is the next feature you plan to build for StudyTogether?`],tags:[`studytogether`,`lessons-learned`]},{id:`proj-057`,category:`Project Questions`,difficulty:`Intermediate`,question:`What would you improve?`,answer:`I'd want to build out proper automated testing for the backend APIs, which I've been less disciplined about compared to the FNB project's more structured team process. I'd also want to do real user testing with actual high-school learners before building the AI accountability features further, since I don't want to invest heavily in something based on my own assumptions about what would actually help them stay focused.`,keyPoints:[`Names a concrete gap (automated testing) rather than a vague "make it better"`,`Proposes real user testing before investing further in the AI feature`,`Shows self-awareness comparing personal project discipline to the more structured FNB project`],followUps:[`What would a first round of user testing with learners actually look like?`,`What testing framework would you use for the backend APIs?`],tags:[`studytogether`,`improvements`]},{id:`proj-058`,category:`Project Questions`,difficulty:`Intermediate`,question:`How would you monetize it?`,answer:`Given the audience is high-school learners who typically don't have much spending power themselves, I'd lean toward a freemium model — core study rooms and accountability features free, with optional premium features like advanced room customisation or analytics for a small fee, possibly aimed at parents rather than learners directly. I'd be cautious about anything that makes safety or privacy features a paid tier, since that would create a bad incentive to under-protect free users.`,keyPoints:[`Chooses freemium as realistic given the target audience's limited spending power`,`Considers parents as a possible paying customer, not just learners`,`Sets an ethical boundary: safety/privacy features should never be paywalled`],followUps:[`What features specifically would you put behind a paid tier?`,`Would schools or teachers be a better customer than individual parents?`],tags:[`studytogether`,`monetisation`,`ethics`]},{id:`proj-059`,category:`Project Questions`,difficulty:`Intermediate`,question:`How would you test it?`,answer:`I'd combine automated backend tests for the APIs — covering things like room creation, membership rules, and permission checks for admin actions — with manual usability testing involving real learners, since a lot of whether this product actually works comes down to whether teenagers find it genuinely useful and not annoying. I'd also specifically test edge cases around room rules and permissions, like what happens if the only admin leaves a room, since those are the kinds of gaps that are easy to miss but frustrating for real users.`,keyPoints:[`Combines automated API tests with real usability testing, not just one or the other`,`Names a concrete edge case (admin leaving a room) showing genuine product thinking`,`Prioritises real learner feedback given the product's success depends on actual usage patterns`],followUps:[`What automated testing framework would you use for the backend?`,`How would you recruit real high-school learners to test with?`],tags:[`studytogether`,`testing`]},{id:`proj-060`,category:`Project Questions`,difficulty:`Intermediate`,question:`How would you handle thousands of simultaneous users?`,answer:`I'd make sure the API layer is stateless and horizontally scalable behind a load balancer, and move real-time features like room presence to proper websocket or pub/sub infrastructure rather than something that polls the database constantly, since that would fall over quickly at that scale. I'd add caching for data that doesn't change often, like room metadata, and make sure the database is properly indexed for the most common queries, like fetching a learner's active rooms. I'd also want load testing done before assuming any of this actually holds up under real concurrent traffic.`,keyPoints:[`Applies stateless horizontal scaling and proper real-time infrastructure (not polling)`,`Adds caching and indexing as concrete performance levers`,`Insists on load testing rather than assuming the design works without verification`],followUps:[`What would you specifically load test, and what tools would you use?`,`What is the first part of the system you would expect to break under load?`],tags:[`studytogether`,`scalability`,`performance`]}],Qi=[...Xi,...Zi],$i=[{id:`ai-001`,category:`AI Fundamentals`,difficulty:`Beginner`,question:`What is Artificial Intelligence?`,answer:`Artificial Intelligence is the broad field of building systems that can perform tasks that would normally require human intelligence, like understanding language, recognising patterns, or making decisions. It's an umbrella term — machine learning, deep learning, and things like the LLM agents I've worked with on the FNB project all fall under AI, but AI itself isn't one specific technique, it's the overall goal.`,keyPoints:[`AI is the umbrella field/goal, not one specific technique`,`Covers tasks like language understanding, pattern recognition, decision-making`,`ML, deep learning and LLMs are subsets of AI`],followUps:[`How is AI different from a normal computer program?`,`What is an example of AI you interact with daily?`],tags:[`ai`,`fundamentals`,`definition`]},{id:`ai-002`,category:`AI Fundamentals`,difficulty:`Beginner`,question:`What is Machine Learning?`,answer:`Machine Learning is a subset of AI where a system learns patterns from data instead of being explicitly programmed with rules for every case. You give it examples — input and, usually, the correct output — and it learns a general pattern it can apply to new, unseen data. It's the foundation underneath most modern AI, including the language models used in agent systems like the one I built for the FNB project.`,keyPoints:[`Learns patterns from data instead of hardcoded rules`,`Generalises from examples to new, unseen inputs`,`Foundation for deep learning and LLMs`],followUps:[`What is the difference between ML and traditional programming?`,`Give an example of a task better suited to ML than hardcoded rules.`],tags:[`ml`,`fundamentals`,`definition`]},{id:`ai-003`,category:`AI Fundamentals`,difficulty:`Beginner`,question:`What is Deep Learning?`,answer:`Deep Learning is a subset of machine learning that uses neural networks with many layers to learn increasingly abstract representations of data — for example, in an image, early layers might detect edges, later layers detect shapes, and even later layers detect whole objects. It's called 'deep' because of the number of layers stacked together. Large language models, which power the agents in my FNB project, are built on deep learning architectures.`,keyPoints:[`Subset of ML using multi-layer neural networks`,`Learns increasingly abstract representations layer by layer`,`LLMs are a deep learning application`],followUps:[`Why does adding more layers help a network learn more complex patterns?`,`What is a neural network layer actually doing mathematically?`],tags:[`deep-learning`,`fundamentals`]},{id:`ai-004`,category:`AI Fundamentals`,difficulty:`Beginner`,question:`What is the difference between AI, ML and Deep Learning?`,answer:`Think of them as nested circles. AI is the broadest goal — making machines act intelligently, by any method, including hardcoded rules. ML is a subset of AI where the system learns from data rather than fixed rules. Deep Learning is a subset of ML that specifically uses multi-layer neural networks to learn those patterns. So every deep learning system is ML, and every ML system is AI, but not every AI system uses ML, and not every ML system uses deep learning.`,keyPoints:[`AI is the broadest category, includes rule-based systems too`,`ML is a subset of AI: learning from data`,`Deep Learning is a subset of ML: specifically neural networks`],followUps:[`Can you give an example of AI that is not ML?`,`Can you give an example of ML that is not deep learning?`],tags:[`ai`,`ml`,`deep-learning`,`fundamentals`]},{id:`ai-005`,category:`AI Fundamentals`,difficulty:`Beginner`,question:`What is supervised learning?`,answer:`Supervised learning is where you train a model on labelled data — each training example has both an input and the correct answer (the label) — and the model learns to map inputs to outputs. For example, training a model on historical transactions labelled as 'fraud' or 'not fraud' so it can classify new transactions. Most classification and regression problems in practice, including a lot of fraud detection use cases relevant to banking, use supervised learning.`,keyPoints:[`Trained on labelled input-output pairs`,`Learns a mapping from input to known correct output`,`Common for classification/regression (e.g. fraud labelling)`],followUps:[`What if you don't have labelled data for your problem?`,`What are common supervised learning algorithms you know?`],tags:[`ml`,`supervised-learning`]},{id:`ai-006`,category:`AI Fundamentals`,difficulty:`Beginner`,question:`What is unsupervised learning?`,answer:`Unsupervised learning works with data that has no labels — the model looks for structure or patterns on its own, like grouping similar data points together. A common example is customer segmentation, where a bank might cluster customers by spending behaviour without predefining the groups upfront. It's useful when labelling data is expensive or when you genuinely don't know the categories in advance.`,keyPoints:[`Works on unlabelled data, finds structure on its own`,`Clustering is the classic example`,`Useful when labelled data is unavailable or categories are unknown upfront`],followUps:[`What is a real banking use case for unsupervised learning?`,`How do you evaluate an unsupervised model if there are no correct labels?`],tags:[`ml`,`unsupervised-learning`]},{id:`ai-007`,category:`AI Fundamentals`,difficulty:`Intermediate`,question:`What is reinforcement learning?`,answer:`Reinforcement learning is where an agent learns by interacting with an environment and receiving rewards or penalties for its actions, gradually learning a strategy (a policy) that maximises long-term reward. It's less about a fixed dataset and more about trial and error over time. A classic example is training an agent to play a game, but it also applies to things like optimising a recommendation strategy over many user interactions.`,keyPoints:[`Learns through trial and error via rewards/penalties`,`Goal is maximising long-term cumulative reward, not just the next best action`,`Different from supervised learning: no fixed labelled dataset, learns from interaction`],followUps:[`How would reinforcement learning differ from supervised learning for the same problem?`,`Can you think of a banking use case for reinforcement learning?`],tags:[`reinforcement-learning`]},{id:`ai-008`,category:`AI Fundamentals`,difficulty:`Beginner`,question:`What is classification?`,answer:`Classification is a supervised learning task where the model predicts which category or class an input belongs to, from a fixed, discrete set of options. A banking example is predicting whether a transaction is 'fraudulent' or 'not fraudulent' — that's binary classification. If there were more than two categories, like classifying a support ticket into one of five topics, that would be multi-class classification.`,keyPoints:[`Predicts a discrete category/class, not a continuous number`,`Binary classification: two classes (e.g. fraud/not fraud)`,`Multi-class classification: more than two possible categories`],followUps:[`What algorithms are commonly used for classification?`,`How would you evaluate a classification model?`],tags:[`classification`,`ml`]},{id:`ai-009`,category:`AI Fundamentals`,difficulty:`Beginner`,question:`What is regression?`,answer:`Regression is a supervised learning task where the model predicts a continuous numeric value rather than a category. A banking example would be predicting a customer's expected credit limit or a loan default risk score as a number rather than a yes/no label. The key difference from classification is the output type: a number on a continuous scale, not a fixed set of categories.`,keyPoints:[`Predicts a continuous numeric value`,`Example: predicting a credit score or risk score as a number`,`Contrasts with classification, which predicts discrete categories`],followUps:[`What metrics would you use to evaluate a regression model?`,`Can a regression output be turned into a classification decision? How?`],tags:[`regression`,`ml`]},{id:`ai-010`,category:`AI Fundamentals`,difficulty:`Beginner`,question:`Classification vs regression?`,answer:`The core difference is what kind of output you're predicting. Classification predicts a discrete category — like fraud or not fraud. Regression predicts a continuous number — like a predicted transaction amount or a risk score. Sometimes the line blurs; you could turn a regression output like a risk score into a classification decision by applying a threshold, like 'score above 0.8 counts as high risk.'`,keyPoints:[`Classification: discrete categories. Regression: continuous numbers`,`Same underlying data can sometimes support either framing`,`Thresholding a regression score can convert it into a classification decision`],followUps:[`When would you prefer a regression output with a threshold over direct classification?`,`What is a metric that only makes sense for one of the two, not both?`],tags:[`classification`,`regression`,`ml`]},{id:`ai-011`,category:`AI Fundamentals`,difficulty:`Beginner`,question:`What is clustering?`,answer:`Clustering is an unsupervised learning technique that groups similar data points together based on their features, without being told in advance what the groups should be. A common banking example is grouping customers by transaction behaviour to find natural segments, like 'frequent small transactions' versus 'infrequent large transactions', which could then inform different product offerings.`,keyPoints:[`Unsupervised: groups data by similarity without predefined labels`,`Groups (clusters) emerge from the data itself`,`Used for customer segmentation in banking contexts`],followUps:[`What algorithm would you use for clustering, and how does it decide group boundaries?`,`How do you decide how many clusters to use?`],tags:[`clustering`,`unsupervised-learning`]},{id:`ai-012`,category:`AI Fundamentals`,difficulty:`Intermediate`,question:`What is anomaly detection?`,answer:`Anomaly detection is about identifying data points that don't fit the normal pattern of the rest of the data — outliers that could indicate something interesting or wrong. It's directly relevant to fraud detection: a transaction that's wildly different from a customer's usual spending pattern, in amount, location or timing, is an anomaly worth flagging for review. It can be done with statistical methods, or with ML models trained to recognise what 'normal' looks like.`,keyPoints:[`Identifies data points that deviate from the normal pattern`,`Directly maps to fraud detection use cases`,`Can use statistical thresholds or ML-based models of "normal" behaviour`],followUps:[`How would you define "normal" behaviour for a specific customer versus all customers?`,`What is the risk of an anomaly detection system that is too sensitive?`],tags:[`anomaly-detection`,`fraud`]},{id:`ai-013`,category:`AI Fundamentals`,difficulty:`Intermediate`,question:`What is feature engineering?`,answer:`Feature engineering is the process of transforming raw data into inputs (features) that make it easier for a model to learn useful patterns. For example, instead of feeding a model a raw transaction timestamp, you might engineer features like 'time since last transaction' or 'transaction hour of day', which are much more directly useful for detecting unusual behaviour. Good feature engineering often matters as much as, or more than, the choice of model itself.`,keyPoints:[`Transforms raw data into more useful model inputs`,`Example: deriving "time since last transaction" from a raw timestamp`,`Often has more impact on model performance than model choice alone`],followUps:[`Can you give another example of a useful engineered feature for fraud detection?`,`How does feature engineering differ from feature selection?`],tags:[`feature-engineering`,`ml`]},{id:`ai-014`,category:`AI Fundamentals`,difficulty:`Beginner`,question:`What is a neural network?`,answer:`A neural network is a model made up of layers of connected nodes ('neurons'), loosely inspired by how brain neurons connect. Each connection has a weight, and each neuron applies a small calculation (a weighted sum, then an activation function) before passing its output to the next layer. By adjusting those weights during training, the network learns to map inputs to correct outputs. Stacking many of these layers is what makes it a 'deep' neural network.`,keyPoints:[`Made of layers of connected nodes with adjustable weights`,`Each neuron applies a weighted sum plus an activation function`,`Training adjusts weights so the network maps inputs to correct outputs`],followUps:[`What does an activation function actually do in this process?`,`How are the weights actually adjusted during training?`],tags:[`neural-network`,`deep-learning`]},{id:`ai-015`,category:`AI Fundamentals`,difficulty:`Beginner`,question:`What is an activation function?`,answer:`An activation function is applied to a neuron's weighted sum of inputs to decide what it outputs to the next layer. Without it, a neural network would just be doing linear combinations no matter how many layers you stack, which severely limits what it can learn. Activation functions like ReLU or sigmoid introduce non-linearity, which is what lets a network learn complex, non-linear patterns in data.`,keyPoints:[`Applied after the weighted sum in each neuron`,`Introduces non-linearity — without it, stacking layers would not help`,`ReLU and sigmoid are common examples`],followUps:[`What would happen if you removed all activation functions from a network?`,`Why is ReLU more commonly used than sigmoid in hidden layers today?`],tags:[`activation-function`,`neural-network`]},{id:`ai-016`,category:`AI Fundamentals`,difficulty:`Beginner`,question:`What is ReLU?`,answer:`ReLU, or Rectified Linear Unit, is an activation function that outputs the input directly if it's positive, and zero otherwise — mathematically, max(0, x). It's popular because it's computationally cheap and helps avoid a problem called vanishing gradients that older activation functions like sigmoid suffer from in deep networks, which makes training deep networks faster and more stable.`,keyPoints:[`ReLU(x) = max(0, x)`,`Computationally cheap and simple`,`Helps avoid vanishing gradients in deep networks compared to sigmoid`],followUps:[`What is the "dying ReLU" problem?`,`What is a variant of ReLU that tries to fix that problem?`],tags:[`relu`,`activation-function`]},{id:`ai-017`,category:`AI Fundamentals`,difficulty:`Beginner`,question:`What is sigmoid?`,answer:`Sigmoid is an activation function that squashes any input into a range between 0 and 1, making it useful for representing probabilities — for example, the output layer of a binary classifier like a fraud/not-fraud model often uses sigmoid so the output can be interpreted as 'probability of fraud.' Its downside is that for very large or very small inputs, its gradient becomes tiny, which can slow down training in deep networks, which is why ReLU is usually preferred in hidden layers.`,keyPoints:[`Squashes input to a range between 0 and 1`,`Useful for binary classification output as a probability`,`Suffers from vanishing gradients for extreme input values`],followUps:[`Why is sigmoid still used in output layers even though ReLU is preferred elsewhere?`,`What is the relationship between sigmoid and logistic regression?`],tags:[`sigmoid`,`activation-function`]},{id:`ai-018`,category:`AI Fundamentals`,difficulty:`Intermediate`,question:`What is softmax?`,answer:`Softmax is an activation function typically used in the output layer of a multi-class classification model. It turns a vector of raw scores into a probability distribution across all classes — every output is between 0 and 1, and they all sum to 1. For example, classifying a transaction into one of five fraud-type categories, softmax gives you the probability of each category so you can pick the most likely one.`,keyPoints:[`Converts raw scores into a probability distribution across multiple classes`,`Outputs sum to 1, unlike independent sigmoid outputs`,`Used in the output layer for multi-class classification`],followUps:[`How is softmax different from just using sigmoid on each class independently?`,`What loss function is typically paired with softmax?`],tags:[`softmax`,`classification`]},{id:`ai-019`,category:`AI Fundamentals`,difficulty:`Intermediate`,question:`What is backpropagation?`,answer:`Backpropagation is the algorithm used to train neural networks by calculating how much each weight contributed to the model's error, then updating weights to reduce that error. It works backward from the output layer to the input layer, using the chain rule from calculus to compute gradients efficiently at each layer. Those gradients are then used by an optimizer, like gradient descent, to actually adjust the weights.`,keyPoints:[`Calculates each weight's contribution to the overall error`,`Works backward from output to input using the chain rule`,`Produces gradients that an optimizer uses to update weights`],followUps:[`How does backpropagation relate to gradient descent?`,`What is the vanishing gradient problem in the context of backpropagation?`],tags:[`backpropagation`,`deep-learning`]},{id:`ai-020`,category:`AI Fundamentals`,difficulty:`Intermediate`,question:`What is gradient descent?`,answer:`Gradient descent is an optimisation algorithm used to minimise a model's loss function by iteratively adjusting its weights in the direction that reduces error the most, based on the gradient (slope) of the loss with respect to each weight. You can think of it like walking downhill step by step toward the lowest point of a valley, where the valley represents the loss landscape and the lowest point represents the best set of weights.`,keyPoints:[`Iteratively adjusts weights to minimise the loss function`,`Moves in the direction of steepest descent (negative gradient)`,`Analogy: walking downhill toward the lowest point of a valley`],followUps:[`What is the difference between batch, stochastic and mini-batch gradient descent?`,`What happens if the learning rate is too high or too low?`],tags:[`gradient-descent`,`optimisation`]},{id:`ai-021`,category:`AI Fundamentals`,difficulty:`Beginner`,question:`What is a loss function?`,answer:`A loss function measures how far off a model's predictions are from the actual correct answers — it's the thing gradient descent is trying to minimise. For a classification problem you might use cross-entropy loss, while for regression you might use mean squared error. Choosing the right loss function matters because it directly shapes what the model is being optimised to get right.`,keyPoints:[`Quantifies how wrong the model's predictions are`,`Cross-entropy for classification, mean squared error for regression are common examples`,`The choice of loss function shapes what the model optimises for`],followUps:[`Why would cross-entropy be a poor choice for a regression problem?`,`How would you choose a loss function for an imbalanced fraud dataset?`],tags:[`loss-function`,`ml`]},{id:`ai-022`,category:`AI Fundamentals`,difficulty:`Intermediate`,question:`What is an optimizer?`,answer:`An optimizer is the algorithm that actually updates a model's weights using the gradients computed during backpropagation, in order to minimise the loss function. Plain gradient descent is the simplest form, but in practice people usually use more advanced optimizers like Adam, which adapts the learning rate for each parameter individually and tends to converge faster and more reliably on deep learning problems.`,keyPoints:[`Updates weights using gradients to minimise loss`,`Plain gradient descent is the base case`,`Adam is a widely used, adaptive optimizer that often converges faster`],followUps:[`What makes Adam different from plain gradient descent specifically?`,`How would you choose between different optimizers for a project?`],tags:[`optimizer`,`deep-learning`]},{id:`ai-023`,category:`AI Fundamentals`,difficulty:`Beginner`,question:`What is overfitting?`,answer:`Overfitting happens when a model learns the training data too closely — including its noise and quirks — so it performs well on training data but poorly on new, unseen data. It's like memorising answers to specific practice questions instead of actually understanding the underlying concept, so you fail when the real exam asks something slightly different.`,keyPoints:[`Model learns training data too closely, including noise`,`Performs well on training data, poorly on unseen data`,`Analogy: memorising practice answers instead of understanding concepts`],followUps:[`How can you detect overfitting during training?`,`What are some techniques to prevent it?`],tags:[`overfitting`,`ml`]},{id:`ai-024`,category:`AI Fundamentals`,difficulty:`Beginner`,question:`What is underfitting?`,answer:`Underfitting is the opposite of overfitting — the model is too simple to capture the real patterns in the data, so it performs poorly on both the training data and new data. It often happens when the model doesn't have enough capacity, wasn't trained long enough, or the features given to it just aren't informative enough for the task.`,keyPoints:[`Model too simple to capture real patterns`,`Performs poorly on both training AND unseen data`,`Can be caused by insufficient model capacity, training time, or weak features`],followUps:[`How would you tell overfitting and underfitting apart just by looking at training vs validation performance?`,`What would you try first to fix underfitting?`],tags:[`underfitting`,`ml`]},{id:`ai-025`,category:`AI Fundamentals`,difficulty:`Intermediate`,question:`How do you prevent overfitting?`,answer:`A few approaches work well together: getting more training data if possible, since more diverse examples make it harder to memorise noise; using regularization techniques like L1 or L2 penalties that discourage overly complex weight patterns; using dropout in neural networks to prevent over-reliance on specific neurons; and using cross-validation to catch overfitting early rather than only noticing it once the model is already deployed. Simplifying the model itself, if it's clearly more complex than the problem needs, also helps.`,keyPoints:[`More/diverse training data reduces the chance of memorising noise`,`Regularization (L1/L2) and dropout limit model complexity`,`Cross-validation helps detect overfitting during development`],followUps:[`How do L1 and L2 regularization actually differ?`,`When would you choose to simplify the model versus add more regularization?`],tags:[`overfitting`,`regularization`]},{id:`ai-026`,category:`AI Fundamentals`,difficulty:`Intermediate`,question:`What is regularization?`,answer:`Regularization is a set of techniques that discourage a model from becoming overly complex, to reduce overfitting. L2 regularization (also called ridge) adds a penalty proportional to the square of the weights, encouraging smaller, more evenly distributed weights. L1 regularization (lasso) adds a penalty proportional to the absolute value of weights, which can push some weights to exactly zero, effectively performing feature selection.`,keyPoints:[`Adds a penalty to the loss function to discourage complexity`,`L2 (ridge): penalises squared weights, encourages small distributed weights`,`L1 (lasso): penalises absolute weights, can zero out features entirely`],followUps:[`When would you prefer L1 over L2, or vice versa?`,`How does regularization strength (the hyperparameter) affect the model?`],tags:[`regularization`,`overfitting`]},{id:`ai-027`,category:`AI Fundamentals`,difficulty:`Intermediate`,question:`What is dropout?`,answer:`Dropout is a regularization technique for neural networks where, during training, a random subset of neurons is temporarily ignored ('dropped out') on each pass. This forces the network to not over-rely on any single neuron or specific pathway, which makes it generalise better to new data. At inference time, dropout is turned off and all neurons are used, typically with their outputs scaled to account for the difference.`,keyPoints:[`Randomly disables a subset of neurons during training`,`Prevents over-reliance on specific neurons, improving generalisation`,`Turned off (all neurons active) at inference time`],followUps:[`Why is dropout only applied during training and not inference?`,`What dropout rate would you typically start with?`],tags:[`dropout`,`regularization`,`neural-network`]},{id:`ai-028`,category:`AI Fundamentals`,difficulty:`Intermediate`,question:`What is cross-validation?`,answer:`Cross-validation is a technique for evaluating a model more reliably by splitting the data into multiple folds, training on some folds and validating on the remaining fold, then rotating which fold is used for validation. K-fold cross-validation, for example, does this k times and averages the results. It gives a more robust estimate of how the model will perform on unseen data than a single train/test split, since it isn't dependent on one particular lucky or unlucky split.`,keyPoints:[`Splits data into multiple folds, rotating which fold is used for validation`,`K-fold cross-validation averages performance across k rotations`,`More robust than a single train/test split`],followUps:[`What is a downside of cross-validation compared to a single train/test split?`,`How would you use cross-validation for hyperparameter tuning?`],tags:[`cross-validation`,`evaluation`]},{id:`ai-029`,category:`AI Fundamentals`,difficulty:`Intermediate`,question:`What is data leakage?`,answer:`Data leakage happens when information that wouldn't actually be available at prediction time accidentally makes it into the training process, making the model look much better during evaluation than it will in real use. A classic example is accidentally including a future outcome, or a feature derived from it, in your training features — like including 'was this transaction reversed as fraud' as a feature when predicting fraud, when that information wouldn't exist yet at the time of the actual prediction.`,keyPoints:[`Information not actually available at prediction time leaks into training`,`Makes evaluation results misleadingly optimistic`,`Example: including a future-outcome-derived feature in training data`],followUps:[`How would you go about detecting data leakage in a project?`,`How is data leakage different from overfitting?`],tags:[`data-leakage`,`ml`]},{id:`ai-030`,category:`AI Fundamentals`,difficulty:`Intermediate`,question:`What is model drift?`,answer:`Model drift is when a model's performance degrades over time because the real-world data it's seeing in production starts to differ from the data it was trained on. In banking, customer spending patterns can shift due to economic changes or new fraud tactics, so a fraud model trained a year ago might become less accurate without any change to the model itself — the world just moved. That's why monitoring live performance and periodically retraining models matters, not just validating once before deployment.`,keyPoints:[`Model accuracy degrades as real-world data diverges from training data`,`Banking example: shifting spending patterns or new fraud tactics`,`Requires ongoing monitoring and periodic retraining, not a one-time validation`],followUps:[`How would you detect model drift in production?`,`How often would you consider retraining a fraud detection model?`],tags:[`model-drift`,`production-ml`]}],ea=[{id:`ml-001`,category:`Machine Learning`,difficulty:`Beginner`,question:`What is a training dataset?`,answer:`The training dataset is the portion of your data that the model actually learns from — it adjusts its internal parameters based on patterns found in this data. It needs to be large and representative enough that the model learns genuine patterns rather than quirks specific to a small sample.`,keyPoints:[`The data the model directly learns/adjusts its parameters from`,`Needs to be representative of the real problem`,`Distinct from validation and test data, which are held back`],followUps:[`What could go wrong if your training data is not representative?`,`What proportion of data would you typically use for training?`],tags:[`training-data`,`ml`]},{id:`ml-002`,category:`Machine Learning`,difficulty:`Beginner`,question:`What is a validation dataset?`,answer:`The validation dataset is a separate portion of data used during development to tune the model — like choosing hyperparameters or deciding when to stop training — without touching the final test set. It gives you an honest signal of how changes are affecting performance on data the model hasn't directly learned from, while still keeping the test set completely untouched for the final evaluation.`,keyPoints:[`Used during development for tuning decisions, not final evaluation`,`Kept separate from training data so it reflects unseen-data performance`,`Different from the test set, which is reserved for the final check`],followUps:[`What happens if you tune too aggressively based on the validation set?`,`How is cross-validation related to a validation set?`],tags:[`validation-data`,`ml`]},{id:`ml-003`,category:`Machine Learning`,difficulty:`Beginner`,question:`What is a test dataset?`,answer:`The test dataset is a held-out portion of data that the model never sees during training or tuning, used only once at the end to give an honest, final estimate of how the model will perform on genuinely new data. If you use it to make any decisions during development, it stops being a fair test, because you'd effectively be tuning to it, the same way studying the actual exam questions beforehand would defeat the purpose of the exam.`,keyPoints:[`Held out entirely from training and tuning`,`Used once, at the end, for a final honest performance estimate`,`Using it during development invalidates it as a fair test`],followUps:[`What would you do if your test set performance was much worse than validation performance?`,`How often should you look at the test set during a project?`],tags:[`test-data`,`ml`]},{id:`ml-004`,category:`Machine Learning`,difficulty:`Beginner`,question:`Why do we split data?`,answer:`We split data so we can honestly measure how well a model generalises to data it hasn't seen, rather than just how well it memorised the data it was trained on. Without a proper split, you'd have no way to detect overfitting — the model could look perfect on paper while actually being useless on new, real-world data, which is exactly the kind of failure that matters most in a production setting.`,keyPoints:[`Allows honest measurement of generalisation, not memorisation`,`Without a split, overfitting would go undetected`,`Directly protects against deploying a model that looks good but fails in production`],followUps:[`What is a common split ratio, and does it depend on dataset size?`,`What is time-based splitting, and when would you need it instead of random splitting?`],tags:[`data-splitting`,`ml`]},{id:`ml-005`,category:`Machine Learning`,difficulty:`Beginner`,question:`What is accuracy?`,answer:`Accuracy is the proportion of predictions a model got correct out of all predictions made — correct predictions divided by total predictions. It's simple and intuitive, but it can be misleading on imbalanced datasets, like fraud detection, where the vast majority of transactions are legitimate, so a model that just predicts 'not fraud' every time can still score a very high accuracy while being completely useless.`,keyPoints:[`Correct predictions divided by total predictions`,`Simple and intuitive but can be misleading`,`Especially misleading on imbalanced datasets like fraud detection`],followUps:[`What metric would you use instead of accuracy for an imbalanced dataset?`,`What accuracy would a model get by always predicting "not fraud" if 1% of transactions are fraud?`],tags:[`accuracy`,`evaluation`]},{id:`ml-006`,category:`Machine Learning`,difficulty:`Intermediate`,question:`What is precision?`,answer:`Precision measures, out of everything the model flagged as positive, how many were actually correct — true positives divided by (true positives plus false positives). In fraud detection, high precision means when the model flags a transaction as fraud, it's usually right, which matters because low precision means you're constantly bothering genuine customers with false fraud alerts.`,keyPoints:[`Precision = true positives / (true positives + false positives)`,`Answers: of everything flagged positive, how much was actually correct`,`Low precision in fraud detection means many false alarms on genuine customers`],followUps:[`When would you prioritise precision over recall?`,`How does precision relate to false positives specifically?`],tags:[`precision`,`evaluation`]},{id:`ml-007`,category:`Machine Learning`,difficulty:`Intermediate`,question:`What is recall?`,answer:`Recall measures, out of all the actual positive cases that exist, how many the model correctly caught — true positives divided by (true positives plus false negatives). In fraud detection, high recall means the model catches most actual fraud, which matters because low recall means real fraud is slipping through undetected, which can be costly and damaging to trust.`,keyPoints:[`Recall = true positives / (true positives + false negatives)`,`Answers: of all actual positives, how many did the model catch`,`Low recall in fraud detection means real fraud goes undetected`],followUps:[`When would you prioritise recall over precision?`,`Can you have perfect recall trivially? How, and why is that not useful?`],tags:[`recall`,`evaluation`]},{id:`ml-008`,category:`Machine Learning`,difficulty:`Intermediate`,question:`What is F1-score?`,answer:`The F1-score is the harmonic mean of precision and recall, giving you a single number that balances both rather than optimising for just one. It's especially useful when you care about both false positives and false negatives and don't want to pick one metric to the exclusion of the other, which is common in fraud detection where both bothering customers and missing fraud have real costs.`,keyPoints:[`Harmonic mean of precision and recall`,`Balances both metrics into a single number`,`Useful when both false positives and false negatives carry real costs`],followUps:[`Why use a harmonic mean instead of a simple average?`,`What is F-beta, and when would you use it instead of F1?`],tags:[`f1-score`,`evaluation`]},{id:`ml-009`,category:`Machine Learning`,difficulty:`Intermediate`,question:`What is a confusion matrix?`,answer:`A confusion matrix is a table that breaks down a classification model's predictions into true positives, true negatives, false positives, and false negatives, so you can see exactly what kinds of mistakes it's making, not just an overall score. For fraud detection, it immediately shows you how many actual frauds were missed (false negatives) versus how many genuine transactions were incorrectly flagged (false positives), which a single accuracy number would hide.`,keyPoints:[`Table of true positives, true negatives, false positives, false negatives`,`Shows exactly what kind of errors the model makes`,`More informative than a single accuracy number for imbalanced problems`],followUps:[`How would you calculate precision and recall directly from a confusion matrix?`,`How does a confusion matrix extend to more than two classes?`],tags:[`confusion-matrix`,`evaluation`]},{id:`ml-010`,category:`Machine Learning`,difficulty:`Intermediate`,question:`What is ROC-AUC?`,answer:`ROC-AUC measures how well a model separates positive and negative classes across all possible classification thresholds, not just one fixed cutoff. The ROC curve plots true positive rate against false positive rate as the threshold changes, and AUC is the area under that curve — closer to 1 means the model separates the classes well, while 0.5 means it's no better than random guessing.`,keyPoints:[`Evaluates performance across all classification thresholds, not just one`,`ROC curve: true positive rate vs false positive rate`,`AUC close to 1 is good, 0.5 is equivalent to random guessing`],followUps:[`Why might ROC-AUC be misleading on a heavily imbalanced dataset?`,`What is precision-recall AUC, and when would you prefer it over ROC-AUC?`],tags:[`roc-auc`,`evaluation`]},{id:`ml-011`,category:`Machine Learning`,difficulty:`Intermediate`,question:`When is accuracy misleading?`,answer:`Accuracy is misleading whenever classes are imbalanced — if 99% of transactions are legitimate, a model that always predicts 'not fraud' gets 99% accuracy while catching zero actual fraud, which is completely useless in practice. Accuracy treats every class as equally important and every mistake as equally costly, which usually isn't true in real problems like fraud, where missing fraud is far more costly than a false alarm.`,keyPoints:[`Misleading on imbalanced datasets, like fraud (rare positive class)`,`A trivial "always predict majority class" model can score high accuracy while being useless`,`Ignores that different types of errors often have very different real costs`],followUps:[`What metrics would you report alongside accuracy for an imbalanced problem?`,`How would you explain this issue to a non-technical stakeholder who is fixated on accuracy?`],tags:[`accuracy`,`class-imbalance`]},{id:`ml-012`,category:`Machine Learning`,difficulty:`Intermediate`,question:`Explain class imbalance.`,answer:`Class imbalance is when one class in your dataset vastly outnumbers another — in fraud detection, legitimate transactions might outnumber fraudulent ones by a ratio of hundreds or thousands to one. This is a problem because models trained naively on imbalanced data tend to just favour the majority class to minimise overall error, since that's mathematically the path of least resistance, even though the minority class (fraud) is usually what you actually care most about detecting.`,keyPoints:[`One class vastly outnumbers another in the dataset`,`Fraud detection is a classic real-world example`,`Naive training favours the majority class, harming detection of the minority class you care about`],followUps:[`What ratio of imbalance would concern you enough to take special action?`,`What is the difference between class imbalance in the training data versus in the real world?`],tags:[`class-imbalance`,`fraud`]},{id:`ml-013`,category:`Machine Learning`,difficulty:`Intermediate`,question:`How would you handle imbalanced data?`,answer:`A few options, often combined: resampling techniques like oversampling the minority class (e.g. SMOTE) or undersampling the majority class to balance the training set; using class weights so the model is penalised more heavily for getting minority-class examples wrong; and choosing evaluation metrics like precision, recall and F1 instead of accuracy, since accuracy alone would hide the actual problem. I'd also make sure any resampling is only applied to the training set, never the test set, so evaluation still reflects real-world class proportions.`,keyPoints:[`Resampling: oversampling minority (e.g. SMOTE) or undersampling majority`,`Class weighting to penalise minority-class mistakes more heavily`,`Use precision/recall/F1 instead of accuracy; keep test set proportions realistic`],followUps:[`How does SMOTE actually generate synthetic minority examples?`,`Why should resampling never be applied to the test set?`],tags:[`class-imbalance`,`fraud`]},{id:`ml-014`,category:`Machine Learning`,difficulty:`Intermediate`,question:`What is bias?`,answer:`In the bias-variance sense, bias refers to error introduced by a model being too simple to capture the real underlying pattern in the data — it makes systematic mistakes regardless of how much data you give it. A model with high bias tends to underfit: it performs similarly poorly on both training and test data because it simply isn't flexible enough to learn the real relationship.`,keyPoints:[`Error from a model being too simple to capture real patterns`,`Leads to systematic, consistent mistakes`,`High bias is associated with underfitting`],followUps:[`How is this different from "bias" in the fairness/ethics sense of the word?`,`What would you do to reduce a model's bias?`],tags:[`bias`,`bias-variance`]},{id:`ml-015`,category:`Machine Learning`,difficulty:`Intermediate`,question:`What is variance?`,answer:`In the bias-variance sense, variance refers to how much a model's predictions would change if trained on a different sample of data — a high-variance model is overly sensitive to the specific training data it saw, including its noise. High variance is associated with overfitting: the model does very well on training data but its performance swings a lot, and often drops, on new data.`,keyPoints:[`Measures sensitivity to the specific training data used`,`High variance means the model reacts strongly to noise in training data`,`High variance is associated with overfitting`],followUps:[`How would you reduce a model's variance without increasing its bias too much?`,`What kind of model architecture tends to have naturally higher variance?`],tags:[`variance`,`bias-variance`]},{id:`ml-016`,category:`Machine Learning`,difficulty:`Intermediate`,question:`Explain the bias-variance tradeoff.`,answer:`As you increase a model's complexity, bias tends to go down (it can capture more nuanced patterns) but variance tends to go up (it becomes more sensitive to noise in the training data), and vice versa for simpler models. The goal is finding the sweet spot where total error — the combination of bias and variance — is minimised, rather than pushing either one to an extreme. Techniques like regularization and cross-validation help find that balance in practice.`,keyPoints:[`Increasing complexity: lower bias, higher variance, and vice versa`,`Goal is minimising total error, not eliminating either one entirely`,`Regularization and cross-validation help find the right balance`],followUps:[`How would you diagnose whether a model has a bias problem or a variance problem?`,`How does regularization help with this tradeoff specifically?`],tags:[`bias-variance`,`ml`]},{id:`ml-017`,category:`Machine Learning`,difficulty:`Beginner`,question:`What is feature scaling?`,answer:`Feature scaling is the process of adjusting numeric features so they're on a similar scale to each other, since features with very different ranges (like transaction amount in thousands versus a 0-1 ratio) can distort models that are sensitive to magnitude, like distance-based algorithms or gradient descent-based models. It's less critical for tree-based models like random forests, but usually important for things like neural networks, k-nearest neighbours, or logistic regression.`,keyPoints:[`Adjusts numeric features to comparable scales/ranges`,`Prevents features with larger raw ranges from dominating magnitude-sensitive models`,`Less critical for tree-based models, important for neural networks, KNN, logistic regression`],followUps:[`Why don't tree-based models need feature scaling as much?`,`What would happen if you skipped scaling before training a neural network?`],tags:[`feature-scaling`,`preprocessing`]},{id:`ml-018`,category:`Machine Learning`,difficulty:`Beginner`,question:`What is normalization?`,answer:`Normalization typically refers to rescaling features to a fixed range, usually 0 to 1, using the minimum and maximum values in the data. It's useful when you know the bounds of your data and want every feature to contribute on a comparable, bounded scale, though it can be sensitive to outliers since a single extreme value stretches the whole scale.`,keyPoints:[`Rescales values to a fixed range, typically 0 to 1`,`Uses min and max of the data`,`Sensitive to outliers, which can distort the scale for everything else`],followUps:[`How would an extreme outlier affect min-max normalization?`,`When would you choose normalization over standardization?`],tags:[`normalization`,`preprocessing`]},{id:`ml-019`,category:`Machine Learning`,difficulty:`Beginner`,question:`What is standardization?`,answer:`Standardization rescales a feature so it has a mean of 0 and a standard deviation of 1, by s
