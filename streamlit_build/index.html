y:`d8bk6v`}]]};Vi.node;var Hi=j(Vi),Ui={name:`zap`,size:24,node:[[`path`,{d:`M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z`,key:`1v7up4`}]]};Ui.node;var Wi=j(Ui);function Gi(e){return e.toLowerCase().replace(/&/g,`and`).replace(/\+/g,`plus`).replace(/[^a-z0-9]+/g,`-`).replace(/(^-|-$)/g,``)}var Ki={"behavioural-and-soft-skills":`Behavioural & Soft Skills`,teamwork:`Teamwork`,"project-questions":`Project Questions`,"ai-fundamentals":`AI Fundamentals`,"machine-learning":`Machine Learning`,"llms-and-generative-ai":`LLMs & Generative AI`,"ai-agents":`AI Agents`,python:`Python`,"sql-and-databases":`SQL & Databases`,"ai-plus-banking":`AI + Banking`,"ai-ethics-and-responsible-ai":`AI Ethics & Responsible AI`,"system-design":`System Design`,security:`Security`};function qi(e){return Ki[e]}var Ji=[{id:`beh-001`,category:`Behavioural & Soft Skills`,difficulty:`Beginner`,question:`Tell us about yourself.`,answer:`I recently graduated with a BSc in Mathematical Sciences, majoring in Computer Science and Mathematics, from Sefako Makgatho Health Sciences University. Right now I'm on the AI Developer Learnership at Geeks4Learning, where I'm sharpening my Python, backend and AI skills. The main project I'm working on is the FNB Intelligent Banking Simulation, a multi-agent LLM system that turns natural-language banking requirements into verified SQL, and I'm part of a five-person team building that end to end. Outside of that I've also been building my own project called StudyTogether, a collaborative study platform for high-school learners. What ties it all together for me is that I like using AI and software to solve real, practical problems, and I'm looking for a role like this one where I can keep growing as an AI engineer while contributing from day one.`,keyPoints:[`Opens with education and current status (learnership) to set context quickly`,`Names the flagship project (FNB simulation) and own project (StudyTogether) as proof of hands-on work`,`Ends by connecting background to why this role/company makes sense`],followUps:[`What part of the FNB project are you personally responsible for?`,`What made you choose AI over other areas of software development?`],projectConnection:`Anchor this answer on the FNB Intelligent Banking Simulation and StudyTogether — they are your strongest, most concrete proof points.`,tags:[`intro`,`background`,`star`]},{id:`beh-002`,category:`Behavioural & Soft Skills`,difficulty:`Beginner`,question:`What are your strengths?`,answer:`One of my biggest strengths is that I'm comfortable working across the whole stack of an AI system — from the math and ML fundamentals I studied in my degree, through to writing the Python and SQL that actually makes a pipeline work. On the FNB project, that meant I could contribute to both the agent logic and the database side without needing someone to translate between the two for me. I'd also say I'm a fast, structured learner — the learnership moves quickly, and I've had to pick up LangGraph and multi-agent concepts largely on my own, which I did by building small test pipelines before touching the real project. Lastly, I take ownership: if something in the pipeline breaks, I don't wait to be told to fix it, I dig into the logs and work out where it went wrong.`,keyPoints:[`Picks 2-3 strengths, not a long list`,`Backs each strength with a concrete example from real work`,`Balances technical breadth with a soft-skill (ownership, fast learning)`],followUps:[`Can you give a specific example of when your ownership mindset helped the team?`,`How did you go about learning LangGraph on your own?`],tags:[`strengths`,`self-assessment`]},{id:`beh-003`,category:`Behavioural & Soft Skills`,difficulty:`Beginner`,question:`What is your biggest weakness?`,answer:`I sometimes spend too long trying to perfect a piece of code or an agent prompt before showing it to the team, when actually getting quick feedback earlier would save time. It showed up on the FNB project when I kept refining the Requirement Agent's prompt on my own for a few days instead of syncing with the Code Agent owner earlier. Once I did share it, we realised we needed to agree on the output format first, which would have saved me some rework. I've been actively working on this by setting myself a rule to share a rough version after a day rather than a polished one after a week, and checking in with teammates earlier in the process. It's made my work fit into the team's workflow much better.`,keyPoints:[`Picks a real, believable weakness (not "I work too hard")`,`Shows self-awareness with a concrete example`,`Ends with the corrective action already being taken, not just a promise`],followUps:[`How do you know the change is actually working?`,`What other feedback have you gotten from teammates about your work style?`],tags:[`weakness`,`self-assessment`,`star`]},{id:`beh-004`,category:`Behavioural & Soft Skills`,difficulty:`Beginner`,question:`Why did you choose AI?`,answer:`My Mathematics background made statistics, linear algebra and probability feel natural to me, and AI is really where that math becomes something you can build and see working. What pulled me in specifically was realising how much of a real problem — like a bank employee having to write SQL themselves — can be solved by an AI system that understands plain language. Working on the FNB project made that concrete for me: watching a natural-language request turn into verified SQL through a chain of agents is genuinely exciting, and it's a space that's moving fast, which keeps me motivated to keep learning.`,keyPoints:[`Connects math background to AI naturally`,`Uses a specific, tangible example rather than "AI is the future"`,`Shows genuine curiosity/motivation, not just a career-trend answer`],followUps:[`What area of AI are you most interested in exploring next?`,`How does your maths background help you in day-to-day AI engineering work?`],tags:[`motivation`,`ai`]},{id:`beh-005`,category:`Behavioural & Soft Skills`,difficulty:`Beginner`,question:`Why did you choose IT?`,answer:`I've always liked the combination of logical problem-solving and building something you can actually see work, and IT gives me that immediately — you write code, run it, and get a result. During my degree I found I enjoyed the programming and database modules more than the purely theoretical ones, because I could apply the maths straight away. It also felt like the field where I could keep learning indefinitely; there's always a new tool, framework or concept, and I like that it never gets stale. That's part of why I've stayed in it past graduation, moving into an AI-focused learnership rather than a more general IT role.`,keyPoints:[`Ties choice back to enjoying logical, hands-on problem solving`,`Uses degree experience as evidence`,`Shows it is a deliberate, ongoing choice (learnership), not just a default`],followUps:[`What specifically drew you from general IT into AI?`,`What is a module or project from your degree that confirmed this was the right path?`],tags:[`motivation`,`it`]},{id:`beh-006`,category:`Behavioural & Soft Skills`,difficulty:`Beginner`,question:`Why do you want to work at FNB?`,answer:`FNB has a strong reputation for actually shipping digital and AI innovation rather than just talking about it, and that matters to me because I want my first real role to be somewhere I can learn from people who are solving problems at scale. I've already been getting hands-on exposure to how AI can apply to banking through the FNB Intelligent Banking Simulation project during my learnership, working with agents that handle natural-language banking queries, and that has shown me how much impact good AI engineering can have in this industry — from fraud detection to smarter customer service. I want to keep building in that direction, ideally at a bank that's investing seriously in AI, and from what I've seen FNB is one of the leaders in that space in South Africa.`,keyPoints:[`Shows genuine, specific interest rather than a generic 'great company' answer`,`Connects existing simulation project experience to real motivation`,`Frames it as wanting to learn and grow, appropriate for an early-career candidate`],followUps:[`What do you know about how FNB is currently using AI?`,`What would you want to learn in your first six months here?`],tags:[`motivation`,`fnb`,`company-fit`]},{id:`beh-007`,category:`Behavioural & Soft Skills`,difficulty:`Beginner`,question:`Why should we choose you?`,answer:`I bring a solid foundation — a Mathematics and Computer Science degree plus hands-on, current experience building a real multi-agent AI system modelled on banking use cases. I'm not coming in with just theory; I've actually built the Requirement Agent to Code Agent to Verifier Agent pipeline, worked with LangGraph, PostgreSQL and read-only database execution, and I've hit real problems like hallucinated SQL and had to solve them. I'm also early enough in my career that I'm still very coachable, but I've shown through the learnership and my own StudyTogether project that I take initiative rather than waiting to be told what to do. That combination — relevant hands-on AI experience plus genuine drive to keep learning — is what I think makes me a strong fit for this role.`,keyPoints:[`Leads with concrete, relevant technical experience, not generic enthusiasm`,`Balances "coachable junior" with "shows initiative" — the right pitch for entry-level`,`Directly answers the competitive framing without putting other candidates down`],followUps:[`What specific contribution did you make to the FNB project pipeline?`,`What would you want to prove in your first three months?`],tags:[`self-pitch`,`differentiation`]},{id:`beh-008`,category:`Behavioural & Soft Skills`,difficulty:`Intermediate`,question:`Where do you see yourself in five years?`,answer:`In five years I'd like to be a confident, mid-to-senior AI engineer who can own the design of an AI system end to end — not just building agents or models, but making good calls about architecture, reliability and how AI fits safely into a business like banking. I want to have deepened my knowledge of things like RAG, LLM evaluation and production ML systems, and ideally be mentoring newer developers the way I hope to be mentored here. I'm not fixed on a specific job title; what matters more to me is being someone the team trusts with harder, more ambiguous problems because I've built a track record of shipping reliable AI features.`,keyPoints:[`Focuses on skill and responsibility growth, not just a job title`,`Shows realistic ambition appropriate for a graduate, not overreaching`,`Mentions wanting to eventually mentor others, showing long-term commitment`],followUps:[`What skills do you think you need to develop most in the next year?`,`What does "senior" mean to you in an AI engineering context?`],tags:[`career-goals`,`growth`]},{id:`beh-009`,category:`Behavioural & Soft Skills`,difficulty:`Beginner`,question:`What are your long-term career goals?`,answer:`Long term, I want to build genuine depth as an AI engineer — someone who understands the full pipeline from data and model behaviour through to how a system is deployed and monitored in production. I'd like to work on AI applied to problems that actually matter to people's lives, and banking is a good example because decisions there affect people's money and trust. Eventually I'd like to specialise further, likely in either applied LLM systems or ML for risk and fraud, but I want that specialisation to come from real experience rather than picking it too early. For now my goal is simple: join a team where I can learn fast and contribute meaningfully.`,keyPoints:[`Shows a direction (applied AI, possibly fraud/risk) without over-committing`,`Connects goals to real-world impact`,`Keeps the immediate ask realistic: learn fast, contribute now`],followUps:[`What draws you toward fraud/risk specifically versus other AI applications?`,`How do you plan to keep learning outside of work?`],tags:[`career-goals`]},{id:`beh-010`,category:`Behavioural & Soft Skills`,difficulty:`Beginner`,question:`What motivates you?`,answer:`I'm motivated by seeing something I built actually work and solve a real problem — that moment when the FNB pipeline takes a plain-English request and returns the correct, verified SQL result is genuinely satisfying to me. I'm also motivated by learning; I like being slightly out of my depth because that's when I grow the fastest, which is part of why I pushed myself to understand LangGraph and multi-agent design rather than sticking to what I already knew. And I care about doing work that has real stakes — banking data and financial decisions matter to people, so building something reliable there feels meaningful, not just technically interesting.`,keyPoints:[`Names concrete sources of motivation (seeing things work, learning, real stakes)`,`Uses the FNB project as tangible evidence`,`Avoids generic answers like "money" or "recognition"`],followUps:[`Tell us about a specific moment recently where you felt that motivation.`,`What demotivates you, and how do you push through it?`],tags:[`motivation`]},{id:`beh-011`,category:`Behavioural & Soft Skills`,difficulty:`Beginner`,question:`What are you passionate about?`,answer:`I'm genuinely passionate about AI systems that make technical work more accessible to non-technical people — that's the whole idea behind the FNB project, letting someone describe what they need in plain language instead of writing SQL themselves. I'm also passionate about education and access to learning, which is why I built StudyTogether in my own time: I wanted high-school learners to have a simple platform to study together and stay accountable. Outside of direct project work, I enjoy just tinkering — trying out new AI tools and small experiments to understand how they work under the hood.`,keyPoints:[`Connects passion directly to both main projects (FNB and StudyTogether)`,`Shows a personal, self-driven side project as evidence of genuine interest`,`Keeps it authentic rather than reciting a mission statement`],followUps:[`What inspired you specifically to build StudyTogether?`,`What is a recent AI tool or concept you experimented with on your own?`],tags:[`passion`,`interests`]},{id:`beh-012`,category:`Behavioural & Soft Skills`,difficulty:`Beginner`,question:`What are your interests outside of technology?`,answer:`Outside of tech I enjoy staying active and following sport, and I like reading up on topics outside my field just to keep a broad perspective — it actually helps with problem-solving because I'm not always thinking in the same patterns. I also enjoy explaining things to people; when friends or family ask me about AI or what I'm building, I like finding simple ways to describe it, which has actually helped me communicate technical ideas more clearly at work too. It keeps me well-rounded rather than only thinking about code all day.`,keyPoints:[`Gives a genuine, simple answer rather than overselling hobbies as "strategic"`,`Draws a light, honest connection back to workplace skills (communication)`,`Keeps it brief — this question does not need a long answer`],followUps:[`How do you make time for these interests alongside a demanding learnership?`,`Has anything outside tech ever given you an idea for how to solve a technical problem?`],tags:[`interests`,`personal`]},{id:`beh-013`,category:`Behavioural & Soft Skills`,difficulty:`Intermediate`,question:`What achievement are you most proud of?`,answer:`I'm most proud of getting the FNB Intelligent Banking Simulation's agent pipeline working end to end for the first time — Requirement Agent parsing a natural-language ask, the Code Agent generating SQL, and the Verifier Agent checking it against the schema before it ever touched the read-only database. Situation: we were a five-person team with a tight timeline and none of us had built a production-style multi-agent system before. Task: I was responsible for a meaningful part of the agent logic and the verification step. Action: I broke the problem down, built small test cases before wiring agents together, and worked closely with teammates to agree on a consistent state format between agents. Result: we got a working pipeline that correctly rejected an incorrect or unsafe SQL query and asked for refinement instead of just executing it — which felt like a real, safe AI system, not just a demo.`,keyPoints:[`Uses full STAR structure clearly`,`Picks an achievement tied to the flagship project, not a vague personal claim`,`Highlights safety/verification as the meaningful outcome, which is relevant to banking`],followUps:[`What was the hardest part of getting the agents to communicate correctly?`,`How did the team divide responsibilities for this?`],projectConnection:`This is your strongest STAR story — the FNB pipeline going from idea to working, verified system.`,tags:[`achievement`,`star`,`fnb`]},{id:`beh-014`,category:`Behavioural & Soft Skills`,difficulty:`Intermediate`,question:`Tell us about a difficult challenge you experienced.`,answer:`Situation: on the FNB project, early on our Code Agent would sometimes generate SQL that looked plausible but referenced columns that didn't exist in our schema — a form of hallucination. Task: I needed to find a way to stop that from ever reaching the database, without slowing the whole pipeline down too much. Action: I worked on strengthening the Verifier Agent to check generated SQL against the actual schema metadata before execution, and added a refinement loop so the Code Agent could retry with the specific error instead of failing silently. I also tightened the prompt given to the Code Agent to explicitly list the valid schema. Result: hallucinated column references dropped significantly, and when they did happen, the system caught them before touching the read-only database instead of returning an error to the user.`,keyPoints:[`Names a specific, technical challenge (SQL hallucination) rather than something vague`,`Shows the actual engineering action taken, not just "I worked hard"`,`Result is measurable and safety-relevant`],followUps:[`How did you validate that the fix actually worked?`,`What would you do differently if hallucinations still slipped through occasionally?`],projectConnection:`Directly reuses the SQL-hallucination problem from the FNB project — keep this consistent with your technical answers on that topic.`,tags:[`challenge`,`star`,`fnb`]},{id:`beh-015`,category:`Behavioural & Soft Skills`,difficulty:`Intermediate`,question:`Tell us about a time you failed.`,answer:`Situation: early in building StudyTogether, I designed the study-room database schema on my own without getting feedback first, assuming I understood all the requirements. Task: once I started building the room administration features, I realised the schema didn't properly support things like room rules or multiple admins per room. Action: rather than patch around it, I went back, reviewed the actual use cases properly, and rebuilt the schema with proper relationships between rooms, users, roles and rules. I also started sketching schemas on paper and getting a second opinion before implementing, going forward. Result: the second version of the schema was far more flexible, and I avoided a bigger rebuild later, but it did cost me a few days of rework I could have skipped.`,keyPoints:[`Picks a genuine failure with real consequences (rework), not a fake weakness`,`Shows the lesson changed future behaviour (getting feedback before implementing)`,`Keeps blame on process, not on other people`],followUps:[`How do you now decide when to get feedback versus just building?`,`Did this experience change how you approach the FNB project schema decisions?`],tags:[`failure`,`star`,`studytogether`]},{id:`beh-016`,category:`Behavioural & Soft Skills`,difficulty:`Intermediate`,question:`Tell us about a mistake you made and what you learned from it.`,answer:`Situation: on the FNB project, I once pushed a change to the Code Agent's prompt template without properly testing it against our existing set of sample queries. Task: the change was meant to improve SQL formatting, but it accidentally broke how the agent handled queries involving joins. Action: as soon as a teammate flagged strange output, I reverted the change immediately, then went back and built a small local test script that ran a fixed set of sample requirements through the agent before any prompt change could be merged. Result: we caught two more potential regressions with that script over the following weeks before they ever reached the team, and it's become part of how we now work. The lesson was that in AI systems, small prompt changes can have surprisingly large effects, so testing before merging is non-negotiable.`,keyPoints:[`Concrete, believable technical mistake tied to prompt engineering`,`Shows immediate corrective action (revert) plus a lasting process improvement (test script)`,`Draws a clear, transferable lesson about testing AI/prompt changes`],followUps:[`What does that test script check for specifically?`,`How do you balance testing thoroughness with development speed on a tight timeline?`],tags:[`mistake`,`star`,`fnb`]},{id:`beh-017`,category:`Behavioural & Soft Skills`,difficulty:`Beginner`,question:`How do you handle pressure?`,answer:`I deal with pressure by breaking whatever is stressing me out into smaller, concrete steps, because vague, big problems feel overwhelming but a clear next task doesn't. During tighter deadlines on the FNB project, I'd write out exactly what needed to be done that day rather than thinking about the whole remaining scope at once. I also try to communicate early if I think a deadline is at risk, rather than staying quiet and hoping it works out — that's saved the team from surprises more than once. And practically, I make sure I'm not trying to solve everything alone; asking a teammate for a second pair of eyes usually gets me unstuck faster than pushing through pressure by myself.`,keyPoints:[`Gives a concrete method (breaking work into steps), not just "I stay calm"`,`Includes proactive communication as part of handling pressure`,`Shows willingness to ask for help rather than struggling silently`],followUps:[`Tell us about a specific deadline that felt tight — how did you handle it?`,`How do you know when it is time to ask for help versus keep pushing?`],tags:[`pressure`,`stress-management`]},{id:`beh-018`,category:`Behavioural & Soft Skills`,difficulty:`Beginner`,question:`How do you handle criticism?`,answer:`I try to treat criticism as information about the work, not about me personally, which took some conscious practice but has made a real difference. On the learnership, a mentor once pointed out that my early agent code had almost no comments explaining the reasoning behind decisions, which made it hard for teammates to follow. Instead of getting defensive, I asked for a concrete example of what good documentation looked like, applied it, and now I document architectural decisions as I go rather than after the fact. I'd rather get that kind of direct feedback early than have small issues turn into bigger ones later.`,keyPoints:[`Separates feedback about the work from feedback about self-worth`,`Uses a real, specific example of receiving and acting on criticism`,`Shows the change stuck (ongoing documentation habit), not just a one-time fix`],followUps:[`Has there been a time you disagreed with criticism you received? How did you handle it?`,`How do you now give feedback to others based on what you learned?`],tags:[`criticism`,`feedback`,`star`]},{id:`beh-019`,category:`Behavioural & Soft Skills`,difficulty:`Beginner`,question:`How do you respond when you don't know something?`,answer:`I say so honestly rather than guessing or bluffing, and then I go find the answer as quickly as I can. When I first encountered LangGraph on the FNB project, I hadn't used it before, so I told the team that upfront, then spent time going through the documentation and building a tiny standalone example before touching the real pipeline. I also find it useful to ask a specific, well-framed question to a teammate rather than a vague one — it gets me a faster, more useful answer and shows I've already tried to work it out myself. In an interview or on the job, I'd rather admit a gap and show how I'd close it than pretend to know something I don't.`,keyPoints:[`Leads with honesty over bluffing, which interviewers specifically look for`,`Gives a concrete example of self-teaching (LangGraph) before asking for help`,`Shows a habit of asking specific, well-prepared questions`],followUps:[`How long did it take you to get comfortable with LangGraph?`,`What resources do you typically use to learn something new quickly?`],tags:[`learning`,`honesty`]},{id:`beh-020`,category:`Behavioural & Soft Skills`,difficulty:`Beginner`,question:`How do you approach learning a new technology?`,answer:`I start with the official documentation or a well-regarded quick-start guide to get the core concepts, then I build a small, throwaway project to actually use it rather than just reading. That's exactly how I picked up LangGraph and FastAPI — I wrote tiny standalone scripts first, deliberately breaking things to understand why they broke, before applying the tool to the FNB project or StudyTogether. I also try to connect the new tool to something I already know; understanding LangGraph was easier once I related its state graph to concepts I already knew from software design. Once I'm using it in a real project, I keep a short personal note of gotchas I hit, so I don't repeat the same mistake twice.`,keyPoints:[`Concrete, repeatable learning process: docs, small project, connect to prior knowledge`,`Uses real examples (LangGraph, FastAPI) rather than a hypothetical`,`Shows a habit (notes on gotchas) that compounds learning over time`],followUps:[`What was the trickiest concept to learn recently, and how did you eventually get it?`,`How do you decide which resource to trust when learning something new?`],tags:[`learning`,`growth`]},{id:`beh-021`,category:`Behavioural & Soft Skills`,difficulty:`Intermediate`,question:`How do you manage your time?`,answer:`I keep a simple daily list of what needs to get done, ranked by what's blocking someone else versus what's just my own task, because unblocking teammates usually has more impact than finishing my own nice-to-have first. Balancing the learnership curriculum, the FNB project deadlines and my own StudyTogether project has forced me to be realistic about what I can do in a day rather than overcommitting. I also block out focused time for harder tasks like debugging agent logic, since that kind of work doesn't go well in small fragmented chunks, and I leave lighter tasks like documentation for when my focus is lower.`,keyPoints:[`Gives a concrete prioritisation rule (unblocking others first)`,`Acknowledges managing multiple real commitments (learnership, FNB project, personal project)`,`Shows awareness of matching task type to energy/focus level`],followUps:[`How do you decide what to say no to when everything feels urgent?`,`What tools, if any, do you use to track your tasks?`],tags:[`time-management`]},{id:`beh-022`,category:`Behavioural & Soft Skills`,difficulty:`Intermediate`,question:`How do you prioritize tasks when you have multiple deadlines?`,answer:`I first work out which tasks are dependencies for other people, because those get priority — if my part of the Verifier Agent is blocking a teammate from testing their Code Agent changes, that comes before something only I need. Then I look at effort versus impact: quick wins that unblock a lot of downstream work get done early. When I genuinely have two hard deadlines colliding, like a learnership assignment and a project milestone, I communicate early with whoever is affected rather than silently letting one slip, so we can agree on a realistic plan together instead of it being a surprise.`,keyPoints:[`Uses a clear framework: dependencies first, then effort vs impact`,`Grounds it in the real dynamic of team dependencies (FNB agents)`,`Emphasises proactive communication over silently struggling`],followUps:[`Tell us about a specific time two deadlines actually collided for you.`,`How do you communicate a delay without it looking like an excuse?`],tags:[`prioritisation`,`time-management`]},{id:`beh-023`,category:`Behavioural & Soft Skills`,difficulty:`Intermediate`,question:`How do you deal with uncertainty?`,answer:`AI projects are full of uncertainty — you often don't know exactly how a model or agent will behave until you test it — so I've learned to get comfortable making a reasonable decision with the information I have, then testing and adjusting quickly rather than waiting for perfect certainty. On the FNB project, we weren't sure upfront how many refinement retries the Code Agent would realistically need before producing valid SQL, so instead of guessing indefinitely, I picked a sensible starting limit, instrumented it so we could see actual retry counts in practice, and then adjusted based on real data. I try to treat uncertainty as something you reduce with small experiments, not something you can eliminate by thinking longer.`,keyPoints:[`Frames uncertainty as normal in AI work, showing maturity for the domain`,`Gives a concrete example (retry limits) of deciding under uncertainty`,`Shows an experiment-and-adjust mindset rather than analysis paralysis`],followUps:[`What did the actual retry data show once you measured it?`,`How do you know when you have "enough" information to make a decision?`],tags:[`uncertainty`,`decision-making`]},{id:`beh-024`,category:`Behavioural & Soft Skills`,difficulty:`Intermediate`,question:`How do you stay motivated when a problem is difficult?`,answer:`I remind myself that getting stuck is part of the process, not a sign I'm not capable — especially in AI work, where debugging why an agent produced a certain output can take a while. Practically, I break the hard problem into smaller pieces I can actually make progress on, so I have small wins to keep me going rather than staring at one big unsolved issue. When I was debugging why our Verifier Agent occasionally passed SQL that referenced the wrong table, I focused on reproducing just one failing case reliably first, instead of trying to fix the whole problem at once. Once I had that one case understood, the motivation came back because I could see a path forward.`,keyPoints:[`Normalises difficulty as expected in AI/debugging work`,`Uses a specific technique: reduce to one reproducible case`,`Shows motivation is sustained by visible progress, not willpower alone`],followUps:[`What do you do if you're stuck for days with no progress at all?`,`Has a teammate ever helped you get unstuck? What did that look like?`],tags:[`motivation`,`resilience`]},{id:`beh-025`,category:`Behavioural & Soft Skills`,difficulty:`Intermediate`,question:`What makes you different from other candidates?`,answer:`I think what sets me apart is that I'm not just learning AI theory — I've actually built and shipped a multi-agent system modelled directly on a real banking use case, hitting real problems like SQL hallucination, verification and read-only database access, which are exactly the kind of concerns a bank cares about. On top of that, I've built my own product, StudyTogether, entirely outside of any coursework, which shows I don't just do AI work when it's assigned to me — I go looking for problems to solve. Combine that with a strong maths foundation and a genuine, current curiosity about this field, and I think I bring a rare mix for someone this early in their career: real hands-on experience, self-driven initiative, and a solid theoretical base to build on.`,keyPoints:[`Avoids putting down other candidates; focuses purely on own evidence`,`Combines hands-on relevant project experience with self-initiated work`,`Reinforces maths foundation as a differentiator for AI specifically`],followUps:[`What specifically about StudyTogether shows initiative beyond a normal side project?`,`How would you apply what you learned on the FNB project on day one here?`],tags:[`differentiation`,`self-pitch`]}],Yi=[{id:`tw-001`,category:`Teamwork`,difficulty:`Beginner`,question:`Tell us about a time you worked in a team.`,answer:`The clearest example is the FNB Intelligent Banking Simulation, where I've been working with four other developers to build a multi-agent LLM pipeline. Situation: we needed to design a system where a Requirement Agent, Code Agent and Verifier Agent all work together to turn a natural-language banking request into safe, verified SQL. Task: as a team we split ownership by agent and by layer, with me focused on parts of the agent logic and verification. Action: we held regular check-ins to agree on the shared state format between agents, since that was the one thing that could break everyone's work if we didn't align on it. Result: we got a working end-to-end pipeline, and the habit of agreeing on interfaces early became one of the biggest lessons I took from the project.`,keyPoints:[`Uses the real five-person FNB team as the example throughout`,`Highlights interface/contract agreement as the key teamwork lesson`,`Follows STAR structure cleanly`],followUps:[`How did you handle it when two team members disagreed on the state format?`,`What was your specific role compared to the other four members?`],projectConnection:`This is your default "teamwork" story — the FNB five-person team and agreeing on shared interfaces.`,tags:[`teamwork`,`star`,`fnb`]},{id:`tw-002`,category:`Teamwork`,difficulty:`Beginner`,question:`What role do you normally take in a team?`,answer:`I tend to be the person who pushes for clarity — making sure that before we start building, we've actually agreed on what a shared interface or output format looks like, because I've seen how much time gets wasted otherwise. On the FNB project, I often ended up proposing the structure for how agents pass state to each other, then getting the team to sign off on it before implementation started. I'm not usually the loudest voice in the room, but I'll speak up specifically when I think there's ambiguity that will bite us later. I'm also happy to just get hands-on and write code once direction is clear — I don't need to be leading to feel like I'm contributing.`,keyPoints:[`Names a specific, credible role: clarifier of interfaces/direction`,`Backed by the real FNB example (state format proposals)`,`Balances leadership tendencies with being a solid individual contributor`],followUps:[`Have you ever had to step back and let someone else take that role?`,`How do you adjust your role depending on the team you are in?`],tags:[`teamwork`,`self-assessment`]},{id:`tw-003`,category:`Teamwork`,difficulty:`Intermediate`,question:`How do you handle disagreement with a teammate?`,answer:`I try to separate the disagreement from the person — focus on what the code or design actually needs to do, not on being right. On the FNB project, a teammate and I disagreed about whether the Verifier Agent should reject a query outright on any schema mismatch or attempt an automatic retry first. I laid out the risk of retries hiding real problems, they laid out the cost of rejecting too eagerly and frustrating the user, and we ended up testing both approaches against a small set of sample queries to see which actually performed better rather than arguing in the abstract. It turned out a single bounded retry was the better trade-off, which neither of us had fully committed to going in.`,keyPoints:[`Focuses on ideas, not personalities`,`Uses a specific technical disagreement from the FNB project`,`Resolves it with evidence/testing rather than authority or compromise for its own sake`],followUps:[`What would you have done if the data had been inconclusive?`,`How do you know when to let a disagreement go versus push further?`],tags:[`conflict`,`star`,`fnb`]},{id:`tw-004`,category:`Teamwork`,difficulty:`Intermediate`,question:`Tell us about a time you disagreed with someone.`,answer:`Situation: while building StudyTogether, a collaborator and I disagreed on whether to include a computer-vision feature to detect if students were paying attention during study sessions. Task: I needed to raise my concern without just shutting the idea down, since it wasn't a bad idea, just a risky one. Action: I explained my concern about privacy, consent and false positives — flagging someone as 'not studying' unfairly could damage trust in the whole platform — and suggested we treat it as an optional, clearly-consented feature rather than a default, and start with much simpler accountability features like study timers and room check-ins. Result: we agreed to de-scope the computer-vision piece for a later phase and focus first on features that delivered value without the ethical risk, which I think was the right call for an early-stage product.`,keyPoints:[`Uses a real product/ethics disagreement, not a fabricated generic one`,`Shows persuasion through reasoning (privacy, consent, false positives), not just insisting`,`Ties directly into the AI-ethics themes examiners may probe further`],followUps:[`How would you actually implement consent for a feature like that if you revisited it?`,`Did the other person fully agree, or was it a compromise?`],projectConnection:`Reuses the StudyTogether computer-vision/privacy tension — keep consistent with your AI ethics answers.`,tags:[`conflict`,`star`,`studytogether`]},{id:`tw-005`,category:`Teamwork`,difficulty:`Intermediate`,question:`What would you do if a teammate wasn't contributing?`,answer:`I'd first try to understand why, privately and without judgement — they might be stuck on something and too hesitant to ask, or dealing with something outside of work. I'd have a direct but supportive one-on-one conversation rather than escalating immediately or complaining to others. If it turned out they were stuck technically, I'd offer to pair with them on it. If the issue continued after that conversation and it was genuinely affecting the team's ability to hit deadlines — say, on the FNB project where each agent's owner blocks the others — I'd raise it with our team lead or supervisor, but only after trying to resolve it directly first, since going over someone's head immediately usually damages trust.`,keyPoints:[`Leads with empathy and understanding before assuming laziness`,`Escalation is a last resort, not the first move`,`Grounds the stakes in the real FNB dependency structure`],followUps:[`Has this actually happened to you? How did it play out?`,`What would you do if the private conversation did not change anything?`],tags:[`conflict`,`accountability`]},{id:`tw-006`,category:`Teamwork`,difficulty:`Intermediate`,question:`How would you deal with a difficult teammate?`,answer:`I'd try to stay professional and focus purely on the work rather than reacting to their tone or attitude. If someone was consistently dismissive of ideas in our FNB team meetings, for example, I'd address it directly but calmly — asking specifically what concerns they had about a suggestion, which usually turns a dismissive comment into an actual technical discussion. If the friction was more personal than technical, I'd try to find common ground, like a shared goal we both cared about — getting the pipeline working reliably — and keep steering conversations back to that. I wouldn't let it affect the quality of my own work or make me disengage from the team.`,keyPoints:[`Stays professional and focused on shared goals rather than personal conflict`,`Turns dismissiveness into a concrete technical discussion`,`Shows resilience — not letting friction degrade own work quality`],followUps:[`What is the line between a "difficult" teammate and one who is just direct?`,`Have you had to manage this kind of dynamic during the learnership?`],tags:[`conflict`,`difficult-people`]},{id:`tw-007`,category:`Teamwork`,difficulty:`Beginner`,question:`How do you handle criticism from a teammate?`,answer:`I try to take it at face value and assume good intent — that they're trying to make the work better, not attack me. When a teammate on the FNB project reviewed my early Verifier Agent code and pointed out I wasn't handling a specific schema edge case, I thanked them for catching it, fixed it, and made a mental note to think more about edge cases upfront next time. I think reacting defensively to teammate feedback just makes people less likely to be honest with you in the future, and I'd rather have a team that tells me the truth early than one that's polite but lets mistakes slide.`,keyPoints:[`Assumes good intent behind feedback`,`Uses a specific FNB code-review example`,`Frames openness to feedback as building team trust`],followUps:[`How do you give that same kind of direct feedback to others?`,`Was there ever feedback you disagreed with? How did you handle that?`],tags:[`feedback`,`teamwork`]},{id:`tw-008`,category:`Teamwork`,difficulty:`Intermediate`,question:`How do you give constructive feedback?`,answer:`I focus on being specific and on the work itself, not the person, and I try to give feedback close to when I noticed the issue rather than letting it pile up. On the FNB project, instead of saying a teammate's prompt for the Code Agent was unclear, I pointed to the exact lines where the schema wasn't specified explicitly and explained why that ambiguity was likely causing hallucinated columns, then suggested a concrete fix. I also try to lead with something that is working well before the critical part, not as a formula, but because it's honestly useful context. I check afterwards that the person understood the feedback the way I meant it, since tone can get lost, especially in written messages.`,keyPoints:[`Emphasises specificity over vague criticism`,`Uses a real, technical example (prompt clarity) rather than a hypothetical`,`Shows care about how feedback lands, not just that it was delivered`],followUps:[`How do you adjust your feedback style for someone more senior than you?`,`Tell us about a time your feedback was not well received. What did you do?`],tags:[`feedback`,`communication`]},{id:`tw-009`,category:`Teamwork`,difficulty:`Beginner`,question:`How do you receive constructive feedback?`,answer:`I listen fully before responding, even if my first instinct is to explain myself, because usually there's a valid point buried in there even if I don't agree with all of it. I ask clarifying questions if I don't immediately understand what needs to change — for example, asking a teammate for a specific example of where my agent's output format was inconsistent, rather than just nodding along. Then I actually act on it, because feedback that doesn't change anything isn't very useful to either person. I try not to take it personally; on a five-person project like FNB, feedback is just part of how we keep quality high.`,keyPoints:[`Listens fully before responding rather than immediately defending`,`Asks clarifying questions to make feedback actionable`,`Follows through with real behaviour change`],followUps:[`What is a recent piece of feedback you actually changed your approach because of?`,`How do you handle feedback you think is wrong?`],tags:[`feedback`,`growth`]},{id:`tw-010`,category:`Teamwork`,difficulty:`Intermediate`,question:`What would you do if your team was going in the wrong direction?`,answer:`I'd speak up as early as possible, since the cost of changing direction only grows the longer everyone keeps building. I'd raise it as a question rather than a flat statement — something like asking what happens if the Code Agent hits a query type we hadn't planned for — because that opens a discussion instead of putting people on the defensive. If I had data or a concrete example supporting my concern, like a failing test case, I'd bring that along rather than just an opinion. And if the team decided to continue on the current path anyway after hearing me out, I'd support that decision and contribute fully, since a team needs to move forward together even after a disagreement is resolved.`,keyPoints:[`Raises concerns early and through questions rather than confrontation`,`Backs concerns with concrete evidence where possible`,`Commits to the team decision once it is made, showing maturity`],followUps:[`Has this happened on the FNB project? What was the outcome?`,`What if you felt the direction was genuinely risky, not just suboptimal?`],tags:[`teamwork`,`decision-making`]},{id:`tw-011`,category:`Teamwork`,difficulty:`Intermediate`,question:`How do you communicate technical information to a non-technical person?`,answer:`I start from what the person actually cares about — the outcome, not the mechanism — and build up from there only if they want more detail. When explaining the FNB project to family or non-technical friends, I don't start with LangGraph or agent architectures; I say it's like having a small team of AI assistants where one understands what you're asking for, one writes the database query, and one double-checks it's safe before anything runs. I avoid jargon unless I've already defined it, and I check in by asking if it makes sense so far rather than assuming it does. I've found using an everyday analogy, like a team of assistants each doing one job, works much better than a technically accurate but dense explanation.`,keyPoints:[`Leads with outcome/value before mechanism`,`Uses a concrete, reusable analogy for the FNB project`,`Checks for understanding actively rather than assuming`],followUps:[`How would you explain what "hallucination" means to someone non-technical?`,`How do you adjust this when the audience is a non-technical manager rather than a friend?`],tags:[`communication`,`fnb`]},{id:`tw-012`,category:`Teamwork`,difficulty:`Intermediate`,question:`Tell us about a time you helped someone understand something technical.`,answer:`Situation: a teammate on the FNB project was newer to SQL and was struggling to understand why we needed read-only database access and a separate verification step rather than just letting the Code Agent run its generated SQL directly. Task: I wanted them to genuinely understand the reasoning, not just accept it, since they'd be maintaining that part of the system too. Action: I walked them through a concrete example — what would happen if the Code Agent generated a query with a subtle mistake and it ran directly against a production-like database versus being caught by the Verifier Agent first. I used a real failing example we'd actually seen rather than a hypothetical. Result: they not only understood it, but later caught a related edge case in the verification logic that I had missed, which showed the explanation had actually landed.`,keyPoints:[`Uses a real teaching moment tied to the FNB security/verification design`,`Shows using concrete failing examples over abstract explanation`,`Result shows genuine understanding (they later contributed back), not just politeness`],followUps:[`How do you check that someone has actually understood, not just nodded along?`,`What do you do if someone still does not understand after a couple of explanations?`],tags:[`communication`,`mentoring`,`fnb`]},{id:`tw-013`,category:`Teamwork`,difficulty:`Intermediate`,question:`Tell us about a time you had to compromise.`,answer:`Situation: on the FNB project, I wanted to spend more time building a more sophisticated retry and refinement mechanism for the Code Agent, while a teammate felt we should prioritise getting basic end-to-end functionality working first given our timeline. Task: both of us had valid points, and we needed to agree on a plan without either of us feeling overruled. Action: we agreed to implement a simple, single-retry version first to unblock the rest of the pipeline, with the more sophisticated version noted as a clear future improvement rather than dropped entirely. Result: we hit our milestone with a working, if simpler, pipeline, and I later got to revisit and improve the refinement logic once the core system was stable — so the compromise didn't mean giving up on the idea, just sequencing it differently.`,keyPoints:[`Shows compromise as sequencing, not abandoning good ideas`,`Real, specific technical trade-off from the FNB project`,`Result shows the compromise paid off for both the deadline and the original idea`],followUps:[`How do you decide when a compromise is the right call versus when to hold your ground?`,`Did you eventually get to build the more sophisticated version?`],tags:[`compromise`,`star`,`fnb`]},{id:`tw-014`,category:`Teamwork`,difficulty:`Beginner`,question:`What does good teamwork mean to you?`,answer:`To me, good teamwork means everyone understands not just their own task but how it fits into the bigger picture, so decisions get made with the whole system in mind rather than in isolation. It also means people feel safe raising concerns or admitting they're stuck, because that's what actually prevents bigger problems later — on the FNB project, the moments we caught issues early were always the moments someone felt comfortable flagging something didn't look right. And it means sharing credit and responsibility fairly; a working pipeline is the result of five people's work, not just whoever wrote the most visible part.`,keyPoints:[`Emphasises shared understanding of the whole system, not just individual tasks`,`Ties psychological safety directly to catching problems early`,`Mentions fair credit-sharing, a mature team-culture point`],followUps:[`How do you personally help build that kind of safety in a team?`,`What is an example of the team catching something early because someone spoke up?`],tags:[`teamwork`,`values`]},{id:`tw-015`,category:`Teamwork`,difficulty:`Beginner`,question:`What makes a good team member?`,answer:`A good team member is reliable — they do what they say they will, and if they can't, they say so early rather than letting others find out at the last minute. They're also willing to help outside of their exact task; on the FNB project, the moments that felt most like a real team were when someone would jump in to help debug another person's agent even though it wasn't technically their responsibility. I'd add curiosity and humility — being willing to learn from teammates rather than assuming you already know best, especially in a field like AI where things change quickly and nobody has all the answers.`,keyPoints:[`Reliability and early communication are named as foundational`,`Uses a real cross-help example from the FNB team`,`Adds humility/curiosity as important in a fast-changing field like AI`],followUps:[`Which of these traits do you think you still need to develop?`,`How do you notice when a teammate needs help even if they have not asked?`],tags:[`teamwork`,`values`]}],Xi=[{id:`proj-001`,category:`Project Questions`,difficulty:`Beginner`,question:`Tell us about a project you have worked on.`,answer:`The project I'd highlight is the FNB Intelligent Banking Simulation, which I've been building as part of a five-person team during my AI Developer Learnership. It's a multi-agent LLM pipeline that takes a natural-language banking request, turns it into a structured requirement, generates SQL for it, verifies that SQL is safe and correct against our schema, and only then executes it read-only against PostgreSQL. I contributed to the agent logic and verification layer specifically. It's the project that's taught me the most about real AI engineering — not just calling an LLM, but building the guardrails around it.`,keyPoints:[`Gives a one-sentence summary of what the system does before any detail`,`States personal contribution clearly`,`Frames it as a learning experience about guardrails, not just LLM usage`],followUps:[`Can you walk through the pipeline step by step?`,`What was your specific role on the team?`],tags:[`projects`,`fnb`,`overview`]},{id:`proj-002`,category:`Project Questions`,difficulty:`Beginner`,question:`Explain your FNB Intelligent Banking project.`,answer:`It's a simulation of how a bank could let staff or systems query banking data using plain English instead of SQL. A user's natural-language request goes to a Requirement Agent, which turns it into a structured specification. That goes to a Code Agent, which generates the actual SQL. A Verifier Agent then checks that SQL against our schema and data rules before anything runs. Only verified queries are executed, and only with read-only access to PostgreSQL. If verification fails, the system loops back for refinement instead of just erroring out or, worse, running something incorrect.`,keyPoints:[`Explains the three-agent pipeline in plain language`,`Emphasises the safety design: verify before execute, read-only access`,`Mentions the refinement loop as the recovery mechanism`],followUps:[`Why three agents instead of one big agent?`,`What happens after multiple failed refinement attempts?`],tags:[`fnb`,`architecture`]},{id:`proj-003`,category:`Project Questions`,difficulty:`Beginner`,question:`What problem were you trying to solve?`,answer:`The core problem is that a lot of valuable banking data sits behind SQL, and non-technical staff either need to learn SQL or wait on a developer every time they need an answer. That's slow and doesn't scale. We wanted to explore whether an AI pipeline could safely bridge that gap — letting someone ask a plain-English question and get a reliable, verified answer — without introducing the risk of an AI system making unchecked changes to sensitive banking data.`,keyPoints:[`States the access-to-data problem clearly`,`Explains why this matters (scalability, developer bottleneck)`,`Immediately ties the solution back to safety, not just convenience`],followUps:[`Who would the realistic end user of this system be?`,`What alternative solutions did you consider before this approach?`],tags:[`fnb`,`problem-statement`]},{id:`proj-004`,category:`Project Questions`,difficulty:`Beginner`,question:`Why did you choose this problem?`,answer:`It came out of the learnership's brief to build something that modelled a realistic banking AI use case, but I was genuinely drawn to it because it combines several things I care about — natural language understanding, database systems, and safety-critical design — in one system. It's also a problem that's directly relevant to where I want my career to go, applying AI in financial services, so it wasn't just an assignment to me, it was something I wanted to get right.`,keyPoints:[`Connects the brief to genuine personal interest, not just compliance`,`Names the specific technical areas that appealed (NLP, databases, safety)`,`Links the choice to career direction`],followUps:[`What part of the problem did you find most interesting personally?`,`Would you choose a similar problem again given the choice?`],tags:[`fnb`,`motivation`]},{id:`proj-005`,category:`Project Questions`,difficulty:`Beginner`,question:`Why did you use AI?`,answer:`Because the core challenge — understanding an open-ended, natural-language request and turning it into a precise, structured database query — isn't something you can solve well with fixed rules or a simple form. Language is too flexible for that. An LLM is good at that kind of flexible interpretation, but on its own it isn't reliable enough for something as sensitive as banking data, so the interesting engineering problem was combining AI's flexibility with deterministic checks like schema verification and read-only access.`,keyPoints:[`Justifies AI specifically because the task is open-ended, not rule-based`,`Is honest that AI alone is not sufficient — needs deterministic guardrails`,`Frames the real engineering value as combining flexibility with reliability`],followUps:[`Could you have solved part of this without an LLM at all?`,`What would you lose by using a rule-based system instead?`],tags:[`fnb`,`ai-justification`]},{id:`proj-006`,category:`Project Questions`,difficulty:`Intermediate`,question:`Explain the architecture of your system.`,answer:`It's a LangGraph-orchestrated multi-agent pipeline with three main agents sitting on top of a PostgreSQL database. The Requirement Agent takes the raw user input and produces a structured specification. That specification is passed as shared state to the Code Agent, which generates SQL from it. The generated SQL, along with the specification, goes to the Verifier Agent, which checks it against schema metadata and validation rules. If it passes, the query runs through a read-only database connection; if it fails, the state is routed back with the failure reason for refinement. LangGraph manages that state and the conditional routing between agents.`,keyPoints:[`Names the concrete components: three agents, LangGraph, PostgreSQL, read-only execution`,`Describes data flow explicitly (spec -> SQL -> verification -> execution or retry)`,`Mentions LangGraph specifically for state and conditional routing`],followUps:[`What does the shared state object actually contain?`,`How is the conditional routing between agents implemented in LangGraph?`],tags:[`fnb`,`architecture`,`langgraph`]},{id:`proj-007`,category:`Project Questions`,difficulty:`Intermediate`,question:`Explain the pipeline from beginning to end.`,answer:`It starts with a natural-language request, like 'show me all accounts with more than three failed login attempts this month.' The Requirement Agent parses that into a structured spec — entities, filters, time ranges. The Code Agent turns that spec into SQL. The Verifier Agent checks the SQL against our schema, confirming referenced tables and columns exist and the query doesn't violate our read-only, safety rules. If it passes, we run it against PostgreSQL through a read-only connection and return the result. If it fails, the Verifier Agent's reason for failure is fed back to the Code Agent, which retries with that context, up to a bounded number of attempts.`,keyPoints:[`Uses a concrete example request to make the flow tangible`,`Walks through every stage in order without skipping steps`,`Explains the retry loop with bounded attempts, showing awareness of infinite-loop risk`],followUps:[`What happens if the bounded retries are exhausted?`,`How is the structured spec represented — JSON, a Python object, something else?`],tags:[`fnb`,`pipeline`]},{id:`proj-008`,category:`Project Questions`,difficulty:`Intermediate`,question:`What does the Requirement Agent do?`,answer:`It's the entry point of the pipeline. It takes the raw natural-language request and turns it into a structured specification the rest of the system can work with — identifying things like which entities are involved (accounts, transactions, customers), what filters or conditions apply, and what the actual intent of the request is. It's essentially translating ambiguous human language into something precise enough for a Code Agent to generate correct SQL from, and it's also where we can catch a request that's too vague and ask for clarification rather than guessing.`,keyPoints:[`Defines the agent's single responsibility clearly: NL to structured spec`,`Gives examples of what it extracts (entities, filters, intent)`,`Mentions it as the natural place to catch ambiguous requests`],followUps:[`What does that structured specification actually look like?`,`How does it handle a genuinely ambiguous request?`],tags:[`fnb`,`agents`]},{id:`proj-009`,category:`Project Questions`,difficulty:`Intermediate`,question:`What does the Code Agent do?`,answer:`The Code Agent takes the structured specification from the Requirement Agent and generates the actual SQL query. It's given the relevant schema information so it knows which tables and columns are valid, and it's prompted specifically to produce standard, safe SQL rather than anything using dynamic or unusual constructs. If a previous attempt was rejected by the Verifier Agent, the Code Agent also receives that failure reason so its next attempt is informed rather than a blind retry.`,keyPoints:[`Defines the responsibility: spec to SQL generation`,`Notes that schema context is passed in to reduce hallucination`,`Explains how failure feedback improves retries`],followUps:[`How do you provide the schema context to the Code Agent without making the prompt too large?`,`Have you compared different prompt strategies for SQL generation?`],tags:[`fnb`,`agents`]},{id:`proj-010`,category:`Project Questions`,difficulty:`Intermediate`,question:`What does the Verifier Agent do?`,answer:`It's the safety layer of the pipeline. Before any SQL touches the database, the Verifier Agent checks it against our actual schema — confirming every referenced table and column genuinely exists — and against a set of rules, like rejecting anything that isn't a read-only SELECT statement. If the query fails any of those checks, it doesn't get executed; instead the Verifier Agent produces a clear reason for the failure that gets routed back to the Code Agent for another attempt.`,keyPoints:[`Defines it clearly as the safety/validation gate before execution`,`Names specific checks: schema existence, read-only enforcement`,`Explains the feedback loop it produces on failure`],followUps:[`What specific rules does it check beyond schema existence?`,`How would you extend it to catch more subtle logical errors, not just structural ones?`],tags:[`fnb`,`agents`,`verification`]},{id:`proj-011`,category:`Project Questions`,difficulty:`Intermediate`,question:`Why did you use multiple agents?`,answer:`Because each stage of the problem — understanding intent, generating SQL, and verifying safety — benefits from a focused, specialised prompt rather than one agent trying to juggle all three responsibilities at once. Splitting it up made each agent's job simpler and easier to test in isolation, and it meant we could improve the Verifier Agent's strictness without touching how the Code Agent generates SQL. It also gave us a natural place to insert a safety checkpoint between generation and execution, which would be harder to enforce cleanly inside one single agent.`,keyPoints:[`Explains specialisation and separation of concerns as the main driver`,`Notes the testability benefit of isolated agents`,`Highlights that multi-agent design naturally creates a safety checkpoint`],followUps:[`What are the downsides of this multi-agent approach?`,`Did you ever consider merging any two of the agents?`],tags:[`fnb`,`agents`,`architecture`]},{id:`proj-012`,category:`Project Questions`,difficulty:`Intermediate`,question:`Why couldn't one LLM perform the entire task?`,answer:`A single LLM call could probably produce SQL directly from a natural-language request most of the time, but the risk is that the same model that generated a mistake is also the one being asked to catch it — there's no independent check. Splitting verification into its own agent, with its own focused instructions and access to schema metadata, gives us a genuinely separate checkpoint rather than hoping one model self-corrects. It also makes the system's behaviour more predictable and debuggable, since we can look at exactly which stage failed instead of treating the whole thing as one opaque call.`,keyPoints:[`Explains the "self-grading" risk of one model doing generation and verification`,`Frames separate verification as an independent, more trustworthy checkpoint`,`Adds a debuggability argument for splitting responsibilities`],followUps:[`Is it possible for the Verifier Agent itself to make a mistake? How would you catch that?`,`How much slower is the multi-agent approach compared to one call?`],tags:[`fnb`,`agents`,`design-rationale`]},{id:`proj-013`,category:`Project Questions`,difficulty:`Intermediate`,question:`Why did you use LangGraph?`,answer:`We needed a way to manage state that's shared and updated across multiple agents, plus conditional branching — like routing back to the Code Agent specifically when verification fails, rather than always moving forward linearly. LangGraph gives us that as a graph of nodes and edges, where each agent is a node and the edges define how state flows and which conditions trigger which path. That was a much cleaner fit than trying to hand-roll our own control flow with plain function calls, especially once we added the refinement loop.`,keyPoints:[`Explains the specific need: shared state plus conditional routing`,`Describes LangGraph's graph-of-nodes model concretely`,`Contrasts it with the alternative of hand-rolled control flow`],followUps:[`How does LangGraph compare to just writing your own orchestration loop in Python?`,`What would you use instead if LangGraph were not available?`],tags:[`fnb`,`langgraph`]},{id:`proj-014`,category:`Project Questions`,difficulty:`Intermediate`,question:`How do the agents communicate?`,answer:`They communicate through a shared state object that gets passed along the LangGraph graph — each agent reads the parts of the state relevant to it, does its job, and updates the state with its output before passing it to the next node. For example, the Requirement Agent writes the structured specification into state; the Code Agent reads that and writes the generated SQL; the Verifier Agent reads both and writes back a pass/fail result plus a reason if it fails. There's no direct agent-to-agent messaging outside of that shared state — LangGraph's graph structure decides what happens next based on it.`,keyPoints:[`Explains shared-state communication rather than direct messaging`,`Gives a concrete walk-through of what each agent reads/writes`,`Clarifies that LangGraph, not the agents themselves, decides the next step`],followUps:[`What data type is the shared state object — a dict, a typed class?`,`How do you prevent one agent from accidentally overwriting another's data in state?`],tags:[`fnb`,`agents`,`state`]},{id:`proj-015`,category:`Project Questions`,difficulty:`Intermediate`,question:`How does the system maintain state?`,answer:`State is maintained as a single object that flows through the LangGraph graph for the duration of one request — it accumulates the original request, the structured specification, the generated SQL, verification results, and retry count as it passes through each agent node. It's scoped to a single pipeline run rather than persisted long-term, since each banking request is handled independently. If we wanted history across requests, like remembering previous queries in a session, we'd need to add a separate persistence layer, which wasn't part of the current scope.`,keyPoints:[`Describes state as accumulating through one run, not persisted across runs`,`Lists what fields accumulate in state (spec, SQL, verification result, retry count)`,`Is honest about the current scope not including cross-session memory`],followUps:[`How would you add session memory across multiple requests from the same user?`,`What happens to state if the process crashes mid-pipeline?`],tags:[`fnb`,`state`,`langgraph`]},{id:`proj-016`,category:`Project Questions`,difficulty:`Intermediate`,question:`What happens when the generated SQL is incorrect?`,answer:`It gets caught by the Verifier Agent before it ever reaches the database. The Verifier Agent checks the SQL structurally against the schema — are the tables and columns real, is it a read-only query — and if something's wrong, it doesn't just reject silently; it produces a specific reason, like 'column customer_status does not exist on table accounts.' That reason is routed back to the Code Agent as part of the state, so its next attempt is targeted at the actual problem instead of guessing again from scratch.`,keyPoints:[`Confirms the Verifier Agent is the catch point before execution`,`Gives a concrete example of a specific, useful failure reason`,`Explains how that reason feeds the refinement loop`],followUps:[`What if the SQL is structurally valid but logically wrong for the user's intent?`,`How many retries do you allow before giving up?`],tags:[`fnb`,`verification`,`error-handling`]},{id:`proj-017`,category:`Project Questions`,difficulty:`Intermediate`,question:`How do you verify generated SQL?`,answer:`Verification happens in a few layers. First, a structural check confirms the SQL is syntactically valid. Second, a schema check confirms every table and column referenced actually exists in our database metadata, which is the main defence against hallucinated columns. Third, a policy check confirms the query is read-only — no INSERT, UPDATE, DELETE or DDL statements are allowed through. Only once a query passes all three does it get executed, and even then it runs through a database role that only has read permissions as a final backstop.`,keyPoints:[`Breaks verification into clear layers: syntax, schema, policy`,`Explicitly names the read-only policy check as blocking write statements`,`Mentions database-level read-only role as a defence-in-depth backstop`],followUps:[`What tooling or library do you use for SQL parsing/validation?`,`How do you keep the schema metadata used for verification up to date?`],tags:[`fnb`,`verification`,`security`]},{id:`proj-018`,category:`Project Questions`,difficulty:`Intermediate`,question:`How do you prevent hallucinated SQL?`,answer:`Two things work together here. First, we give the Code Agent explicit, accurate schema information in its prompt, rather than trusting it to remember or guess table structures — the more precisely we constrain what it's allowed to reference, the less room there is for it to invent something. Second, even with a good prompt, LLMs can still hallucinate, so the Verifier Agent independently checks every table and column reference against the real schema metadata before execution. That combination — constrain the input, then verify the output — is what actually keeps hallucination from reaching the database.`,keyPoints:[`Explains prevention (good schema context in the prompt) and detection (verification) as two layers`,`Is realistic that prompting alone cannot fully prevent hallucination`,`Frames it as a "constrain input, verify output" pattern applicable to LLM systems generally`],followUps:[`How large can the schema get before it becomes a problem to include in the prompt?`,`Have you measured how often hallucination actually happens?`],tags:[`fnb`,`hallucination`,`llm`]},{id:`proj-019`,category:`Project Questions`,difficulty:`Intermediate`,question:`How do you prevent malicious SQL?`,answer:`We treat the Code Agent's output the same way you'd treat any untrusted input, even though it's our own system generating it. The Verifier Agent enforces that only SELECT statements are allowed — anything resembling an INSERT, UPDATE, DELETE, DROP or other data-modifying or schema-modifying statement is rejected outright. On top of that, the database connection used for execution is bound to a read-only role at the database level, so even if a malicious or destructive query somehow slipped past application-level checks, the database itself would refuse to execute it. That layered defence — application-level policy plus database-level permissions — is deliberate.`,keyPoints:[`Treats LLM output as untrusted input, a key security mindset`,`Names the explicit statement-type allowlist (SELECT only)`,`Emphasises defence-in-depth with database-level read-only permissions as a backstop`],followUps:[`What would you do if you needed to eventually support write operations safely?`,`How would you defend against prompt injection trying to get the Code Agent to generate a write statement?`],tags:[`fnb`,`security`,`sql-injection`]},{id:`proj-020`,category:`Project Questions`,difficulty:`Beginner`,question:`Why did you use PostgreSQL?`,answer:`PostgreSQL is a mature, production-grade relational database with strong support for fine-grained roles and permissions, which mattered a lot for a project centred on safe, read-only access. It also has good tooling for inspecting schema metadata programmatically, which we relied on for the Verifier Agent's schema checks. Beyond the technical fit, it's widely used in real banking and enterprise systems, so building against it made our simulation feel closer to a realistic production environment than a lightweight database would have.`,keyPoints:[`Justifies choice via role/permission granularity relevant to read-only design`,`Mentions schema introspection tooling as directly useful for verification`,`Notes real-world/production relevance as a reason for realism`],followUps:[`What specific PostgreSQL features did you use for the read-only role?`,`How does querying schema metadata in PostgreSQL actually work?`],tags:[`fnb`,`postgresql`,`database`]},{id:`proj-021`,category:`Project Questions`,difficulty:`Intermediate`,question:`Why did you use read-only database access?`,answer:`Because the whole point of the system is to answer questions about banking data, not to modify it, and giving an AI-generated query write access would introduce a risk with no corresponding benefit for this use case. Enforcing read-only access at the database connection level means that even in the worst case — a bug in our verification logic, or a cleverly malicious input — the system is structurally incapable of changing or deleting real data. It's a simple, high-leverage safety control that doesn't rely on our application code being perfect.`,keyPoints:[`Explains read-only as matching the actual use case (querying, not modifying)`,`Frames it as a structural safeguard that does not depend on perfect application logic`,`Shows security-mindset: defence that survives your own bugs`],followUps:[`What would change in your design if you needed to support write operations in future?`,`How is the read-only role actually configured in PostgreSQL?`],tags:[`fnb`,`security`,`database`]},{id:`proj-022`,category:`Project Questions`,difficulty:`Intermediate`,question:`How did you handle database security?`,answer:`We layered it: a dedicated database role with read-only permissions used for query execution, application-level verification rejecting anything that isn't a SELECT, and credentials kept out of source code using environment variables rather than being hard-coded. We also scoped the read-only role narrowly to just the tables the system actually needs, rather than granting broad access, following the principle of least privilege. None of these individually would be enough on their own, which is why we treated it as layers rather than one control.`,keyPoints:[`Lists concrete layers: DB role, app-level checks, credential handling`,`Names least privilege explicitly as a guiding principle`,`Frames security as layered defence, not a single control`],followUps:[`How do you manage and rotate database credentials in this kind of simulation?`,`What would you add if this were a real production system rather than a simulation?`],tags:[`fnb`,`security`,`database`]},{id:`proj-023`,category:`Project Questions`,difficulty:`Intermediate`,question:`What was the biggest technical challenge?`,answer:`The biggest challenge was reliably preventing SQL hallucination — cases where the Code Agent generated SQL that looked completely plausible but referenced a column or table that didn't exist, or subtly misunderstood a relationship between tables. It wasn't something we could fix with a single change; it took a combination of giving the Code Agent much more explicit schema context, tightening the Verifier Agent's checks against real schema metadata, and building a proper refinement loop so failures became productive retries instead of dead ends.`,keyPoints:[`Names a specific, credible technical challenge (hallucination)`,`Shows it required a combination of fixes, not one silver bullet`,`Ties directly to concepts covered elsewhere (verification, refinement loop)`],followUps:[`How did you first notice this was happening?`,`How would you quantify how much this challenge improved over time?`],tags:[`fnb`,`challenge`]},{id:`proj-024`,category:`Project Questions`,difficulty:`Intermediate`,question:`What was the biggest mistake you made?`,answer:`Early on I underestimated how much a small prompt change could affect the Code Agent's behaviour — I once adjusted the prompt to improve SQL formatting and it accidentally broke how the agent handled multi-table joins, which we only caught because a teammate noticed odd output during testing. The mistake taught me that in LLM-based systems, changes that look purely cosmetic can have real functional side effects, so now I test any prompt change against a fixed set of sample requirements before merging it.`,keyPoints:[`Names a specific, real mistake (prompt change breaking joins)`,`Is honest about how it was caught (teammate, not by the author)`,`Shows the resulting process change (test set before merging prompt changes)`],followUps:[`What does that test set of sample requirements actually look like?`,`Has a similar mistake happened again since you introduced that process?`],tags:[`fnb`,`mistake`,`lessons-learned`]},{id:`proj-025`,category:`Project Questions`,difficulty:`Beginner`,question:`What did you learn from the project?`,answer:`The biggest lesson was that building a trustworthy AI system is mostly about the guardrails around the model, not the model itself — verification, read-only access, retries with context, all of that mattered more to reliability than which LLM we used. I also learned a lot about working with LangGraph and multi-agent coordination in practice rather than just in theory, and about how much clearer communication needs to be in a team when everyone's work depends on a shared state format.`,keyPoints:[`Draws the central lesson: guardrails matter more than the model choice`,`Names concrete technical learning (LangGraph, multi-agent coordination)`,`Adds a teamwork lesson about shared interfaces`],followUps:[`What would you tell someone just starting a similar project?`,`How has this changed the way you approach new AI projects?`],tags:[`fnb`,`lessons-learned`]},{id:`proj-026`,category:`Project Questions`,difficulty:`Intermediate`,question:`What would you improve?`,answer:`I'd want to add a more thorough automated test suite that runs a broad set of realistic banking requests through the full pipeline and checks both correctness and safety, rather than relying mostly on manual testing during development. I'd also improve observability — logging not just pass/fail but why the Verifier Agent rejected something, in a structured way we could analyse over time to spot patterns in what kinds of requests are hardest for the Code Agent.`,keyPoints:[`Names a concrete, realistic improvement (automated regression test suite)`,`Names a second improvement (structured observability/logging) with a clear reason`,`Shows forward-thinking about maintainability, not just features`],followUps:[`What would a good automated test case for this pipeline look like?`,`What metrics would you track in that observability layer?`],tags:[`fnb`,`improvements`]},{id:`proj-027`,category:`Project Questions`,difficulty:`Intermediate`,question:`How would you make the system faster?`,answer:`I'd look first at reducing unnecessary LLM calls — for example, caching schema information so it isn't re-fetched every run, and checking whether some verification steps can be done with lightweight, non-LLM checks like a SQL parser rather than another model call. I'd also consider running independent parts of the pipeline concurrently where possible, and using a smaller, faster model for simpler requests while reserving a larger model for more complex ones, since not every request needs the same amount of reasoning power.`,keyPoints:[`Suggests caching static context (schema) rather than refetching every run`,`Suggests replacing LLM calls with cheaper deterministic checks where possible`,`Introduc
