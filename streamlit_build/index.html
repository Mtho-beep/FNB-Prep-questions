hosen once genuine role-based access control was needed`,`Move driven by wanting the project to reflect a realistic banking environment`],followUps:[`What specifically had to change in the codebase when you made that move?`,`Did the migration surface any issues you did not expect?`],tags:[`postgresql`,`sqlite`,`fnb`]},{id:`sql-017`,category:`SQL & Databases`,difficulty:`Intermediate`,question:`How would you optimize a slow SQL query?`,answer:`I'd start by looking at the query's execution plan to see where time is actually being spent — often it points to a missing index or an expensive full table scan. From there, I'd consider adding an appropriate index on the columns used in WHERE clauses or JOINs, rewriting the query to avoid unnecessary subqueries or SELECT *, and checking whether the query is pulling more data than it actually needs. For a recurring, expensive query, I might also consider caching results if the underlying data doesn't change often.`,keyPoints:[`Start with the execution plan to find the actual bottleneck`,`Add appropriate indexes; avoid unnecessary subqueries or SELECT *`,`Consider caching for expensive, frequently-run, slow-changing queries`],followUps:[`How do you read a query execution plan in PostgreSQL?`,`What is the difference between SELECT * and selecting only needed columns, performance-wise?`],tags:[`sql`,`performance`]},{id:`sql-018`,category:`SQL & Databases`,difficulty:`Intermediate`,question:`What happens when an SQL query fails?`,answer:`The database returns an error describing what went wrong — like a syntax error, a reference to a table or column that doesn't exist, or a permission error if the query tries something the connection's role isn't allowed to do. In the FNB pipeline specifically, a failure at the verification stage is treated as expected and handled gracefully through the refinement loop, but a failure at actual execution time — after verification passed — would be more concerning and should be logged clearly for investigation, since it suggests our verification missed something.`,keyPoints:[`Database returns a specific error (syntax, missing reference, permission denial)`,`FNB's verification-stage failures are expected and handled via the refinement loop`,`A failure at actual execution time, after verification passed, would be a red flag worth investigating`],followUps:[`How would you distinguish a permission error from a syntax error programmatically?`,`What would you log to help diagnose an unexpected execution-time failure?`],tags:[`sql`,`error-handling`]}],aa=[{id:`bank-001`,category:`AI + Banking`,difficulty:`Beginner`,question:`How can AI be used in banking?`,answer:`AI shows up across a bank in several areas: fraud and anomaly detection on transactions, credit risk scoring, customer service through chatbots and virtual assistants, personalisation of product recommendations, document processing for things like loan applications, and, as in my FNB project, letting staff query data using natural language instead of writing SQL themselves. The common thread is using AI to either catch things humans would miss at scale, or to make interactions faster and more accessible.`,keyPoints:[`Fraud detection, credit risk, customer service, personalisation, document processing`,`Natural-language data querying, as in the FNB project`,`Common goal: catch things at scale humans would miss, or make interactions faster`],followUps:[`Which of these areas do you find most interesting, and why?`,`Which is closest to what you have actually built?`],tags:[`banking`,`ai`]},{id:`bank-002`,category:`AI + Banking`,difficulty:`Intermediate`,question:`How can AI detect fraud?`,answer:`AI fraud detection typically works by learning what normal transaction behaviour looks like for a customer or across the whole customer base, then flagging transactions that deviate significantly from that pattern — unusual amounts, locations, timing, or merchant types. This can be done with supervised models trained on historically labelled fraud cases, or with anomaly detection approaches that don't need labelled fraud examples, instead flagging statistically unusual behaviour directly.`,keyPoints:[`Learns normal transaction behaviour, flags significant deviations`,`Signals: unusual amount, location, timing, merchant type`,`Can use supervised learning (labelled fraud) or anomaly detection (unlabelled)`],followUps:[`What would you do if you had very few labelled fraud examples to train on?`,`How would the model adapt as fraud tactics change over time?`],tags:[`fraud-detection`,`banking`]},{id:`bank-003`,category:`AI + Banking`,difficulty:`Intermediate`,question:`How would you build a fraud detection system?`,answer:`I'd start by clearly defining what counts as fraud and gathering historical labelled examples where available, then engineer features that capture behaviour patterns — like transaction frequency, deviation from a customer's typical spending, and merchant risk profile. I'd train and evaluate a model using metrics suited to imbalanced data, like precision, recall and F1, not just accuracy, and build in a human review step for flagged transactions rather than fully automated blocking, at least initially, to catch false positives before they affect real customers.`,keyPoints:[`Clear fraud definition, historical labelled data, and behaviour-based feature engineering`,`Evaluation with precision/recall/F1 given severe class imbalance`,`Human review step for flagged transactions rather than fully automatic blocking`],followUps:[`What features would you prioritise engineering first?`,`How would you handle a customer disputing a fraud flag?`],tags:[`fraud-detection`,`system-design`]},{id:`bank-004`,category:`AI + Banking`,difficulty:`Intermediate`,question:`What features could be used for fraud detection?`,answer:`Useful features often include transaction amount relative to the customer's typical spending, transaction frequency in a short time window, geographic location compared to recent history, time of day, merchant category, and whether the transaction is a new payee or device. Combining several of these into a behaviour profile per customer tends to work much better than looking at any single feature in isolation, since fraud rarely shows up as one obviously wrong value.`,keyPoints:[`Amount relative to typical spending, transaction frequency, location, time of day`,`Merchant category, new payee/device signals`,`Combining multiple features into a behaviour profile is more effective than any single feature`],followUps:[`How would you build a "typical spending" baseline for each customer?`,`What is the risk of relying too heavily on location as a feature?`],tags:[`fraud-detection`,`feature-engineering`]},{id:`bank-005`,category:`AI + Banking`,difficulty:`Intermediate`,question:`Why might accuracy be misleading for fraud detection?`,answer:`Because fraud is rare compared to legitimate transactions, a model that just predicts 'not fraud' for everything can score extremely high accuracy while catching zero actual fraud — which is exactly backwards from what you'd want. That's why precision, recall and F1 matter more here: they specifically measure how well the model handles the rare, important class, rather than being dominated by the easy majority class.`,keyPoints:[`Fraud is a rare class, so a trivial "always legitimate" model scores high accuracy`,`High accuracy would hide that zero actual fraud is being caught`,`Precision/recall/F1 specifically measure performance on the minority class that matters`],followUps:[`What accuracy would a model achieve by always predicting "not fraud" if 0.5% of transactions are fraud?`,`What metric would you report to a non-technical stakeholder instead of accuracy?`],tags:[`fraud-detection`,`evaluation`]},{id:`bank-006`,category:`AI + Banking`,difficulty:`Intermediate`,question:`How would you handle false positives?`,answer:`False positives in fraud detection mean flagging a genuine transaction as fraudulent, which frustrates customers and can damage trust if it happens too often. I'd tune the model's decision threshold based on the real business cost of a false positive versus a false negative, add a human review step for borderline cases rather than auto-blocking every flag, and give customers a fast, easy way to confirm a flagged transaction was actually theirs, so the inconvenience is minimised even when it happens.`,keyPoints:[`Tune the decision threshold based on real business cost trade-offs`,`Human review for borderline cases rather than fully automatic blocking`,`Fast, easy customer confirmation flow to minimise inconvenience`],followUps:[`How would you decide where to set the decision threshold?`,`What would you do if false positives were concentrated among a specific customer segment?`],tags:[`fraud-detection`,`false-positives`]},{id:`bank-007`,category:`AI + Banking`,difficulty:`Intermediate`,question:`How would you handle false negatives?`,answer:`False negatives mean actual fraud slipped through undetected, which is often more costly than a false positive, so I'd generally accept somewhat more false positives to catch more real fraud, depending on the bank's risk tolerance. I'd also treat every confirmed false negative as valuable data — feeding it back into retraining so the model learns to catch similar patterns in future, and reviewing whether it reveals a whole class of fraud the current features don't capture well.`,keyPoints:[`Often more costly than false positives, so may justify accepting more false positives to reduce them`,`Feed confirmed false negatives back into retraining`,`Review whether they reveal a feature gap or a genuinely new fraud pattern`],followUps:[`How would you weigh the relative cost of a false negative versus a false positive in practice?`,`How often would you retrain the model based on new confirmed fraud cases?`],tags:[`fraud-detection`,`false-negatives`]},{id:`bank-008`,category:`AI + Banking`,difficulty:`Intermediate`,question:`How can AI help with credit risk?`,answer:`AI models can estimate the likelihood a borrower will default by learning from historical data — income patterns, repayment history, and other financial behaviour — often catching more nuanced patterns than a simple, fixed scoring rule would. It's important that these models remain explainable in banking, since customers and regulators are entitled to understand why a credit decision was made, which is part of why simpler, more interpretable models are often preferred over black-box ones for this specific use case.`,keyPoints:[`Estimates default likelihood from historical financial behaviour patterns`,`Can capture more nuance than fixed, rule-based scoring`,`Explainability matters a lot here for regulatory and customer-trust reasons`],followUps:[`Why does explainability matter more for credit risk than for, say, fraud detection?`,`What model type would you choose to balance accuracy and explainability?`],tags:[`credit-risk`,`banking`]},{id:`bank-009`,category:`AI + Banking`,difficulty:`Beginner`,question:`How can AI improve customer service?`,answer:`AI chatbots and virtual assistants can handle routine queries instantly, any time of day, freeing human agents to focus on more complex or sensitive issues. AI can also help route queries to the right department faster, summarise a customer's history for an agent before a call, or suggest relevant responses to a support agent in real time. The key is using AI to support and speed up service, not to fully replace human judgement on sensitive or complex issues.`,keyPoints:[`Chatbots handle routine queries instantly, freeing humans for complex issues`,`Can assist routing, summarisation, and real-time agent suggestions`,`Best used to support human agents, not fully replace judgement on complex cases`],followUps:[`What kind of banking query would you never want a chatbot to handle alone?`,`How would you measure whether an AI customer service feature is actually working well?`],tags:[`customer-service`,`banking`]},{id:`bank-010`,category:`AI + Banking`,difficulty:`Intermediate`,question:`How can AI help detect suspicious transactions?`,answer:`Beyond individual fraud detection, AI can look at patterns across many transactions and accounts to spot suspicious activity that wouldn't be obvious from any single transaction — like a series of small transfers designed to stay under reporting thresholds, or unusual activity linking accounts that don't normally interact. This kind of pattern-level analysis is harder to do manually at scale, which is where AI genuinely adds value beyond simple rule-based alerts.`,keyPoints:[`Looks at patterns across many transactions/accounts, not just one at a time`,`Example: structuring — many small transfers to avoid reporting thresholds`,`Adds value where manual, rule-based review would not scale`],followUps:[`What is "structuring" and why is it hard to detect with simple rules?`,`How would you validate that a detected pattern is genuinely suspicious and not coincidental?`],tags:[`suspicious-activity`,`banking`]},{id:`bank-011`,category:`AI + Banking`,difficulty:`Intermediate`,question:`How can AI help with AML?`,answer:`For Anti-Money Laundering, AI can help by flagging complex, unusual transaction networks and patterns that suggest layering or structuring, prioritising which alerts a human compliance team should review first, and reducing the huge volume of false alerts that traditional rule-based AML systems tend to generate. It's a good fit here because the volume of transactions is far beyond what humans could review individually, but the final decisions on flagged cases still need human compliance expertise and sign-off.`,keyPoints:[`Flags unusual transaction networks/patterns suggesting layering or structuring`,`Prioritises alerts for human compliance review, reducing false-alert volume`,`Final compliance decisions still require human expertise and sign-off`],followUps:[`Why can't AI make the final AML compliance decision on its own?`,`What would "layering" look like in transaction data?`],tags:[`aml`,`banking`]},{id:`bank-012`,category:`AI + Banking`,difficulty:`Intermediate`,question:`How can AI personalize banking services?`,answer:`AI can analyse a customer's transaction and product usage patterns to suggest genuinely relevant products or advice — like flagging that a customer could benefit from a savings product based on their spending patterns, rather than generic marketing. The key is doing this in a way that respects privacy and doesn't feel invasive; personalisation should feel helpful, based on data the customer has knowingly shared, not surveillance-like.`,keyPoints:[`Analyses transaction/usage patterns for genuinely relevant suggestions`,`Example: suggesting a savings product based on actual spending behaviour`,`Must respect privacy and avoid feeling invasive or surveillance-like`],followUps:[`How would you decide what counts as "too invasive" personalisation?`,`How would you measure whether a personalised recommendation was actually useful to the customer?`],tags:[`personalisation`,`banking`]},{id:`bank-013`,category:`AI + Banking`,difficulty:`Intermediate`,question:`How can AI process banking documents?`,answer:`AI, particularly using OCR combined with NLP, can extract structured information from documents like ID documents, payslips, or loan application forms, turning unstructured paperwork into structured data that can feed directly into decision systems, dramatically speeding up processes like loan approvals that would otherwise involve manual data entry. It also reduces manual transcription errors, though it still needs a human review step for edge cases like poor scan quality or unusual document formats.`,keyPoints:[`OCR plus NLP extracts structured data from unstructured documents`,`Speeds up processes like loan approvals versus manual data entry`,`Still needs human review for edge cases like poor scans or unusual formats`],followUps:[`What would you do if the OCR extraction had low confidence on a specific field?`,`How does this connect to concepts like RAG if you wanted to answer questions about a document?`],tags:[`document-processing`,`banking`]},{id:`bank-014`,category:`AI + Banking`,difficulty:`Intermediate`,question:`What risks does AI introduce into banking?`,answer:`AI introduces risks like biased decision-making if trained on unrepresentative or historically biased data, hallucinated or incorrect outputs being trusted as fact, reduced explainability making it harder to justify decisions to regulators or customers, and new security surfaces like prompt injection for LLM-based systems. That's part of why the FNB project treats verification and read-only access as non-negotiable — the risks of an AI system touching sensitive banking data without those guardrails are simply too high.`,keyPoints:[`Bias from unrepresentative training data`,`Hallucinated output being trusted as fact, reduced explainability`,`New security surfaces like prompt injection for LLM-based systems`],followUps:[`Which of these risks did the FNB project specifically design around?`,`How would you communicate these risks to a non-technical stakeholder pushing for faster AI adoption?`],tags:[`ai-risk`,`banking`]},{id:`bank-015`,category:`AI + Banking`,difficulty:`Intermediate`,question:`How would you protect customer data?`,answer:`I'd apply data minimisation — only collecting and exposing what's actually needed for a given task — plus encryption both at rest and in transit, strict access controls so only authorised systems and people can reach sensitive data, and masking sensitive fields in logs and non-production environments. For an AI system specifically, I'd also make sure any data sent to an LLM provider, if external, is handled according to the provider's data-handling guarantees, or kept fully in-house if that's not acceptable for regulated data.`,keyPoints:[`Data minimisation, encryption at rest and in transit`,`Strict access controls and masking sensitive data in logs/non-production environments`,`Careful handling of any data sent to external LLM providers`],followUps:[`What would concern you about sending banking data to a third-party LLM API?`,`How would you handle logging without accidentally exposing sensitive fields?`],tags:[`data-privacy`,`banking`]},{id:`bank-016`,category:`AI + Banking`,difficulty:`Intermediate`,question:`How would you secure an AI system with access to banking data?`,answer:`I'd apply the same layered approach we used on the FNB project: least-privilege access so the AI system only ever sees the data it strictly needs, read-only access where write access isn't required, independent verification of AI-generated actions before they're executed, strong authentication for anything that can trigger the system, and thorough logging so any incident can be investigated after the fact. None of these alone is sufficient, but together they significantly reduce the blast radius of any single failure.`,keyPoints:[`Least-privilege and read-only access where possible`,`Independent verification of AI-generated actions before execution`,`Strong authentication and thorough logging for incident investigation`],followUps:[`Which of these layers do you think matters most, and why?`,`How would this change if the AI system needed write access for a legitimate reason?`],tags:[`security`,`banking`]},{id:`bank-017`,category:`AI + Banking`,difficulty:`Intermediate`,question:`When should humans be involved in banking AI decisions?`,answer:`Humans should stay involved whenever a decision has a significant impact on a customer's finances or access to services — like declining a loan, freezing an account for suspected fraud, or any high-value or unusual transaction. Lower-stakes, easily reversible, routine decisions can reasonably be automated. The general principle I'd apply is: the more impactful and harder to reverse a decision is, the more a human needs to be in the loop before it's finalised.`,keyPoints:[`Human involvement scales with the impact and reversibility of the decision`,`High-stakes examples: loan declines, account freezes, high-value/unusual transactions`,`Lower-stakes, easily reversible decisions can reasonably be automated`],followUps:[`Where would you draw the line for the FNB pipeline specifically?`,`How would you design the human review step to not become a bottleneck?`],tags:[`human-in-the-loop`,`banking`]}],oa=[{id:`eth-001`,category:`AI Ethics & Responsible AI`,difficulty:`Beginner`,question:`What are the risks of AI?`,answer:`AI risks include bias in decision-making, hallucinated or incorrect output being trusted as fact, loss of privacy if systems collect or infer more than they should, reduced explainability making decisions hard to justify, and overreliance on automation in situations that genuinely need human judgement. In a banking context, the stakes are especially high because these risks can directly affect people's money and financial wellbeing.`,keyPoints:[`Bias, hallucination, privacy loss, reduced explainability`,`Overreliance on automation where human judgement is needed`,`Stakes are especially high in banking due to direct financial impact`],followUps:[`Which of these risks worries you most in a banking context specifically?`,`How would you rank these risks for the FNB project specifically?`],tags:[`ai-risk`,`ethics`]},{id:`eth-002`,category:`AI Ethics & Responsible AI`,difficulty:`Beginner`,question:`What is AI bias?`,answer:`AI bias is when a model's outputs systematically favour or disadvantage certain groups, usually because the data it was trained on reflected existing imbalances or historical inequities, rather than the model being deliberately unfair. For example, a credit risk model trained on historical lending data could inherit and perpetuate past discriminatory lending patterns if that history isn't carefully accounted for.`,keyPoints:[`Systematic favouring/disadvantaging of certain groups in model output`,`Usually stems from biased or unrepresentative training data`,`Example: a credit model inheriting historical discriminatory lending patterns`],followUps:[`How would you check whether a model has this kind of bias?`,`Is removing a protected attribute like race from the data enough to remove bias? Why or why not?`],tags:[`bias`,`ethics`]},{id:`eth-003`,category:`AI Ethics & Responsible AI`,difficulty:`Intermediate`,question:`How can AI become biased?`,answer:`Bias usually creeps in through the training data — if certain groups are underrepresented, or if historical outcomes baked into the data reflect past discrimination, the model learns and reproduces those patterns. It can also come from proxy variables that correlate with a protected attribute even if that attribute isn't used directly, like a postal code correlating with race or income level, or from the way a problem is framed in the first place, like choosing a target variable that itself reflects biased historical decisions.`,keyPoints:[`Underrepresentation or historically biased outcomes in training data`,`Proxy variables correlating with protected attributes even when excluded directly`,`Bias can also stem from how the problem/target variable is framed`],followUps:[`Can you give an example of a proxy variable relevant to banking?`,`How would you test for proxy-variable bias in a model?`],tags:[`bias`,`ethics`]},{id:`eth-004`,category:`AI Ethics & Responsible AI`,difficulty:`Intermediate`,question:`How can bias be reduced?`,answer:`I'd start with the data — checking for representativeness across relevant groups and being deliberate about what target variable and features are used, since biased framing at that stage is hard to fix later. I'd test model outputs across different demographic groups for disparities before deployment, not just overall performance, and keep humans in the loop for high-impact decisions rather than fully automating them. Ongoing monitoring after deployment matters too, since bias can emerge or shift over time even in a model that looked fair initially.`,keyPoints:[`Check data representativeness and be deliberate about target/feature framing`,`Test outputs across demographic groups for disparities, not just overall performance`,`Keep humans in the loop for high-impact decisions and monitor ongoing bias after deployment`],followUps:[`What specific metric would you use to measure fairness across groups?`,`What would you do if you found a disparity but could not immediately explain its cause?`],tags:[`bias`,`fairness`]},{id:`eth-005`,category:`AI Ethics & Responsible AI`,difficulty:`Intermediate`,question:`What is explainability?`,answer:`Explainability is the ability to understand and articulate why an AI system produced a particular output or decision, rather than treating it as an opaque black box. In banking, this matters because customers and regulators are entitled to understand why a loan was declined or a transaction was flagged, and it's also just good engineering practice — if you can't explain a model's behaviour, it's much harder to trust or debug it.`,keyPoints:[`Ability to understand and articulate why a model produced a given output`,`Matters for regulatory and customer-trust reasons in banking`,`Also aids debugging and engineering trust in the system generally`],followUps:[`How does explainability trade off against model complexity/accuracy?`,`How would you explain a decision from a complex model to a customer in plain language?`],tags:[`explainability`,`ethics`]},{id:`eth-006`,category:`AI Ethics & Responsible AI`,difficulty:`Beginner`,question:`What is responsible AI?`,answer:`Responsible AI is the practice of designing, building, and deploying AI systems with deliberate attention to fairness, transparency, privacy, safety, and accountability — not just optimising for accuracy or speed. In practice, on the FNB project, that showed up as prioritising verification and read-only access over just making the pipeline fast, because getting it safe mattered more than getting it fast.`,keyPoints:[`Deliberate attention to fairness, transparency, privacy, safety and accountability`,`Goes beyond just optimising for accuracy or speed`,`FNB example: prioritising verification/safety over raw speed`],followUps:[`What would an irresponsible version of the FNB pipeline have looked like?`,`How do you balance responsible AI principles against tight deadlines?`],tags:[`responsible-ai`,`ethics`]},{id:`eth-007`,category:`AI Ethics & Responsible AI`,difficulty:`Beginner`,question:`Why is privacy important?`,answer:`Privacy matters because people have a right to control their own personal information and to trust that it won't be misused, exposed, or used to harm them. In banking specifically, financial data is deeply sensitive — it reveals spending habits, income, and life circumstances — so mishandling it can cause real harm, from identity theft to loss of trust in the institution, well beyond just a compliance checkbox.`,keyPoints:[`People have a right to control their own personal information`,`Financial data is especially sensitive, revealing habits, income, life circumstances`,`Mishandling it causes real harm, not just a compliance/legal issue`],followUps:[`How does this connect to the privacy concerns you raised about StudyTogether's computer vision feature?`,`What is the difference between privacy and security?`],tags:[`privacy`,`ethics`]},{id:`eth-008`,category:`AI Ethics & Responsible AI`,difficulty:`Intermediate`,question:`What is data leakage?`,answer:`In the ethics context, data leakage can also refer to sensitive data being unintentionally exposed — for example, an LLM trained or fine-tuned on private data inadvertently revealing fragments of that data in its output to a different user. It's a genuine concern for any system handling banking data, which is part of why data minimisation and careful control over what an AI system actually has access to matters so much.`,keyPoints:[`Sensitive data unintentionally exposed through a model's behaviour`,`Example: fine-tuning on private data risking exposure in later output to others`,`Reinforces the case for data minimisation and access control`],followUps:[`How is this different from the ML-technical meaning of "data leakage" you covered elsewhere?`,`How would you prevent this specific kind of leakage if fine-tuning on customer data?`],tags:[`data-leakage`,`privacy`]},{id:`eth-009`,category:`AI Ethics & Responsible AI`,difficulty:`Beginner`,question:`What is human-in-the-loop?`,answer:`Human-in-the-loop means designing a system so a human reviews, approves, or can override an AI's output before it takes effect, rather than the AI acting fully autonomously. It's a core safeguard for high-stakes decisions — like a compliance officer reviewing an AI-flagged suspicious transaction before any account action is taken — balancing the efficiency AI provides with human judgement and accountability.`,keyPoints:[`Human reviews, approves, or can override AI output before it takes effect`,`Core safeguard for high-stakes decisions`,`Balances AI efficiency with human judgement and accountability`],followUps:[`How would you decide which decisions need this and which don't?`,`What is the risk of human-in-the-loop becoming just a rubber stamp?`],tags:[`human-in-the-loop`,`ethics`]},{id:`eth-010`,category:`AI Ethics & Responsible AI`,difficulty:`Intermediate`,question:`Should AI make high-impact decisions without humans?`,answer:`I don't think it should, at least not yet, for decisions with serious consequences for someone's finances or access to services — like declining a loan or freezing an account. AI can do the heavy lifting of analysis and flagging, but a human should make or at least confirm the final call, both because AI can be wrong in ways that are hard to detect and because people deserve accountability and recourse from another person, not just an algorithm, when something this significant is on the line.`,keyPoints:[`Generally no for decisions with serious consequences for someone's life/finances`,`AI does the analysis/flagging; a human makes or confirms the final call`,`People deserve accountability and recourse from a person, not just an algorithm`],followUps:[`Are there any high-impact decisions where you would be comfortable with full automation?`,`How would you design the handoff between AI analysis and human decision-making?`],tags:[`human-in-the-loop`,`ethics`]},{id:`eth-011`,category:`AI Ethics & Responsible AI`,difficulty:`Intermediate`,question:`How would you handle an AI system making an incorrect decision?`,answer:`First, there needs to be a clear, accessible way for the affected person to flag and dispute the decision, and a human process to actually review it, not just an automated re-check. Second, the incident should be logged and investigated to understand why it happened — was it a data issue, a model limitation, or a genuinely novel case — and that learning should feed back into improving the system. And the person affected should be treated fairly in the meantime, not left worse off while the investigation happens.`,keyPoints:[`Clear, accessible dispute process leading to genuine human review`,`Log and investigate root cause; feed learnings back into system improvement`,`Treat the affected person fairly during the investigation, not just after`],followUps:[`How would this apply concretely to a false fraud flag on the FNB pipeline?`,`How would you prevent the same mistake from recurring?`],tags:[`error-handling`,`ethics`]},{id:`eth-012`,category:`AI Ethics & Responsible AI`,difficulty:`Intermediate`,question:`How would you design an ethical AI system?`,answer:`I'd start by clearly defining what fairness, safety and privacy mean for the specific use case, not treating them as an afterthought bolted on at the end. Practically, that means representative and carefully considered data, independent verification for anything high-stakes, human review for high-impact decisions, transparency about what the system does and doesn't do, and ongoing monitoring after launch rather than a one-time ethics review before shipping. It's the same instinct that shaped both the FNB verification design and how I approached the privacy questions in StudyTogether — build the safeguards in from the start, not as a patch afterward.`,keyPoints:[`Define fairness/safety/privacy requirements upfront, not as an afterthought`,`Representative data, independent verification, human review for high-impact cases`,`Transparency and ongoing monitoring, not a one-time pre-launch review`],followUps:[`How did this actually show up in the FNB or StudyTogether project design?`,`What would you do if a deadline pressured you to skip one of these safeguards?`],tags:[`responsible-ai`,`design`]}],sa=[{id:`sec-001`,category:`Security`,difficulty:`Intermediate`,question:`How would you secure an AI system?`,answer:`I'd apply the same layered thinking we used on the FNB project: least-privilege access so the system only touches the data it needs, independent verification of anything the AI generates before it's acted on, strong authentication for anything that can trigger the system, encrypted and carefully controlled credentials, and thorough logging so incidents can actually be investigated. No single control is enough on its own, which is why treating it as layered defence matters.`,keyPoints:[`Least-privilege access and independent verification of AI-generated actions`,`Strong authentication and carefully controlled, encrypted credentials`,`Thorough logging to support incident investigation`],followUps:[`Which of these layers was most important on the FNB project specifically?`,`What would you add if the system also needed write access?`],tags:[`security`,`ai`]},{id:`sec-002`,category:`Security`,difficulty:`Beginner`,question:`What is authentication?`,answer:`Authentication is the process of verifying that someone or something is actually who they claim to be — like a username and password, a token, or multi-factor verification. It answers the question 'who are you', as distinct from authorization, which answers 'what are you allowed to do' once you're verified.`,keyPoints:[`Verifies identity — confirming who someone or something is`,`Examples: passwords, tokens, multi-factor verification`,`Distinct from authorization, which governs permissions once identity is confirmed`],followUps:[`What is multi-factor authentication and why does it help?`,`How would authentication apply to a service calling the FNB pipeline's API?`],tags:[`authentication`,`security`]},{id:`sec-003`,category:`Security`,difficulty:`Beginner`,question:`What is authorization?`,answer:`Authorization determines what an already-authenticated user or system is actually allowed to do — which resources they can access and what actions they can perform. In the FNB project, this is exactly what the read-only database role enforces: even a properly authenticated connection is only authorized to run SELECT statements, nothing more.`,keyPoints:[`Determines what an authenticated identity is allowed to do`,`Governs access to resources and permitted actions`,`FNB example: the read-only role authorizes only SELECT statements`],followUps:[`How is role-based access control (RBAC) an example of authorization in practice?`,`What would happen if authentication succeeded but authorization was misconfigured?`],tags:[`authorization`,`security`]},{id:`sec-004`,category:`Security`,difficulty:`Beginner`,question:`Authentication vs authorization.`,answer:`Authentication answers 'who are you' — verifying identity. Authorization answers 'what are you allowed to do' — governing permissions once identity is confirmed. You always need authentication first; you can't meaningfully authorize someone until you know who they are. A simple way to remember it: authentication is showing your ID at the door, authorization is which rooms your ID actually lets you into.`,keyPoints:[`Authentication: verifying identity ("who are you")`,`Authorization: governing permissions ("what can you do")`,`Authentication always comes first, logically`],followUps:[`Can you have authorization without authentication? Why or why not?`,`How would you implement both for the FNB pipeline's API?`],tags:[`authentication`,`authorization`]},{id:`sec-005`,category:`Security`,difficulty:`Intermediate`,question:`What is least privilege?`,answer:`Least privilege is the principle that any user, system, or process should only have the minimum access necessary to do its job, nothing more. It's the reasoning behind why the FNB pipeline's database connection uses a role scoped only to read access on the specific tables it needs, rather than broad access to the whole database — so even if something goes wrong, the damage it could cause is limited.`,keyPoints:[`Grant only the minimum access necessary to do the job`,`FNB example: database role scoped to read-only access on needed tables`,`Limits the potential damage from a bug or compromise`],followUps:[`How would you audit whether a system still follows least privilege over time?`,`What is "privilege creep" and how does it happen?`],tags:[`least-privilege`,`security`]},{id:`sec-006`,category:`Security`,difficulty:`Beginner`,question:`What is encryption?`,answer:`Encryption transforms data into a form that's unreadable without the correct key, protecting it from being understood if intercepted or accessed without authorization. Data can be encrypted at rest (stored on disk) and in transit (moving over a network) — both matter for banking data, since customer information needs protection whether it's sitting in a database or being sent between services.`,keyPoints:[`Transforms data into an unreadable form without the correct key`,`Applies both at rest (stored) and in transit (moving over a network)`,`Both matter for protecting sensitive banking data`],followUps:[`What is the difference between symmetric and asymmetric encryption?`,`How would you handle encryption keys securely?`],tags:[`encryption`,`security`]},{id:`sec-007`,category:`Security`,difficulty:`Intermediate`,question:`What is SQL injection?`,answer:`SQL injection is an attack where untrusted input is crafted to change the meaning of a SQL query, potentially exposing or modifying data the attacker shouldn't have access to. It's a classic web security vulnerability, and it's relevant to the FNB project in a modern form: since our Code Agent generates SQL from user-controlled natural language, we have to guard against the LLM itself being manipulated into producing harmful SQL, not just guard against raw string concatenation.`,keyPoints:[`Untrusted input crafted to change a SQL query's intended meaning`,`Classic web security vulnerability`,`Modern relevance: guarding an LLM-based SQL generator against manipulation, not just raw string concatenation`],followUps:[`How does the Verifier Agent specifically defend against this?`,`What is the difference between classic SQL injection and this LLM-era version of the risk?`],tags:[`sql-injection`,`security`]},{id:`sec-008`,category:`Security`,difficulty:`Intermediate`,question:`What is prompt injection?`,answer:`Prompt injection is when an attacker crafts input specifically designed to manipulate an LLM into ignoring its original instructions or performing an unintended action — for example, embedding hidden instructions in a user's request that try to trick the Code Agent into generating a write statement instead of a read-only query. It's the LLM-era equivalent of injection attacks, and it's a real risk for any system where an LLM processes untrusted user input.`,keyPoints:[`Crafted input designed to make an LLM ignore its instructions or act unintendedly`,`Example: hidden instructions trying to make the Code Agent generate a write statement`,`The LLM-era equivalent of classic injection attacks`],followUps:[`How would you specifically test the FNB pipeline against prompt injection attempts?`,`Can prompt injection alone bypass the Verifier Agent? Why or why not?`],tags:[`prompt-injection`,`security`]},{id:`sec-009`,category:`Security`,difficulty:`Intermediate`,question:`How can prompt injection affect an LLM application?`,answer:`If successful, prompt injection could make an LLM ignore safety instructions, leak information it shouldn't, or produce output designed to cause harm downstream — like trying to get the Code Agent to generate a destructive SQL statement. The real danger is that a well-defended pipeline should treat this as expected and dangerous input, which is exactly why we don't rely on the Code Agent's good behaviour alone — the Verifier Agent's independent, non-LLM checks are what actually stop a successful injection from doing damage.`,keyPoints:[`Can make an LLM ignore instructions, leak information, or produce harmful downstream output`,`Should be treated as expected, dangerous input to defend against, not a rare edge case`,`Independent, non-LLM verification (like the Verifier Agent) is the real defence, not just trusting the LLM`],followUps:[`Why is relying only on "better prompting" not a sufficient defence against this?`,`What would a prompt injection test suite look like for the FNB pipeline?`],tags:[`prompt-injection`,`llm`]},{id:`sec-010`,category:`Security`,difficulty:`Intermediate`,question:`How would you protect an LLM from malicious prompts?`,answer:`I wouldn't rely on the LLM alone to resist malicious input — I'd treat its output as untrusted and verify anything consequential independently, the same way our Verifier Agent checks generated SQL regardless of how it was produced. I'd also constrain what the LLM is capable of doing in the first place, like restricting tool access to only read-only operations, and monitor for unusual patterns in input or output that might indicate an injection attempt.`,keyPoints:[`Treat LLM output as untrusted; verify consequential actions independently`,`Constrain what the LLM can do (e.g. read-only tool access) as a structural limit`,`Monitor for unusual input/output patterns suggesting injection attempts`],followUps:[`What structural limits does the FNB pipeline already have that help here?`,`How would you monitor for injection attempts in practice?`],tags:[`prompt-injection`,`security`]},{id:`sec-011`,category:`Security`,difficulty:`Intermediate`,question:`How would you protect sensitive banking data?`,answer:`Data minimisation first — only ever exposing what's genuinely needed for a task. Then encryption at rest and in transit, strict access control so only authorised systems and people can reach it, masking sensitive fields in logs, and careful handling of any data shared with third-party services, including LLM providers. For AI systems specifically, I'd also think about whether sensitive data really needs to reach the model at all, or whether it can be referenced indirectly.`,keyPoints:[`Data minimisation as the starting principle`,`Encryption, strict access control, and log masking for sensitive fields`,`Careful handling of data sent to third-party services, including LLM providers`],followUps:[`How would you decide what "genuinely needed" means for a given task?`,`What would you do if a required feature seemed to need more data than felt comfortable?`],tags:[`data-privacy`,`security`]},{id:`sec-012`,category:`Security`,difficulty:`Intermediate`,question:`How would you secure database credentials?`,answer:`Credentials should never be hard-coded into source code or committed to version control — I'd store them in environment variables or, for a production system, a dedicated secrets manager, with access to that secrets store itself tightly controlled. I'd also rotate credentials periodically and use different, appropriately scoped credentials for different environments — development, testing, production — rather than reusing the same ones everywhere.`,keyPoints:[`Never hard-code credentials or commit them to version control`,`Use environment variables or a dedicated secrets manager in production`,`Rotate credentials periodically; use different scoped credentials per environment`],followUps:[`How did you handle credentials specifically on the FNB project?`,`What would you do if you discovered a credential had been accidentally committed to git history?`],tags:[`credentials`,`security`]},{id:`sec-013`,category:`Security`,difficulty:`Intermediate`,question:`Why should an AI system not have unrestricted database access?`,answer:`Because an AI system's behaviour, especially one built on an LLM, isn't fully predictable or guaranteed correct — it can hallucinate, be manipulated through prompt injection, or simply make a mistake despite the best prompting and verification. Unrestricted access means any of those failure modes could directly damage or leak real data. Restricting it to read-only, least-privilege access means even a worst-case failure has a bounded, much less severe impact — which is exactly the reasoning behind the FNB project's core design decision.`,keyPoints:[`AI/LLM behaviour is not fully predictable or guaranteed correct`,`Unrestricted access means any failure mode (hallucination, injection, mistake) could cause direct damage`,`Restricting access bounds the worst-case impact — the core FNB design rationale`],followUps:[`What would change about this if the underlying model became much more reliable over time?`,`How would you extend this reasoning to a system that does need some write capability?`],tags:[`least-privilege`,`fnb`,`ai-risk`]}],ca=[{id:`sd-001`,category:`System Design`,difficulty:`Intermediate`,question:`How would you design a scalable AI application?`,answer:`I'd design the application layer to be stateless so it can scale horizontally behind a load balancer, use a queue to smooth out bursts of demand rather than processing everything synchronously, and separate expensive LLM calls from cheaper deterministic logic so I can scale and monitor them independently. I'd also add caching for repeated or static context, like schema information in the FNB pipeline, and build in observability from the start so I can actually see where bottlenecks appear as load grows.`,keyPoints:[`Stateless application layer for horizontal scaling behind a load balancer`,`Queue-based processing to smooth demand bursts`,`Separate and independently scale expensive LLM calls from cheaper deterministic logic; cache static context`],followUps:[`What would be the first component to become a bottleneck as load increases?`,`How would you decide when to introduce a queue versus handling requests synchronously?`],tags:[`system-design`,`scalability`]},{id:`sd-002`,category:`System Design`,difficulty:`Intermediate`,question:`How would you design a chatbot for a bank?`,answer:`I'd start by scoping what the chatbot should and shouldn't handle — routine queries like balance checks or FAQs are good candidates, while anything sensitive or high-stakes should route to a human. Architecturally, I'd use RAG to ground responses in the bank's actual, current policy and product documents rather than relying on the model's general training knowledge, add clear escalation paths to a human agent, and log conversations for quality review, all while being careful about what customer data the chatbot has access to.`,keyPoints:[`Clear scope: routine queries automated, sensitive/high-stakes issues routed to humans`,`RAG grounds responses in the bank's actual current documents, not general knowledge`,`Clear escalation paths to humans, careful data access scoping, and conversation logging for review`],followUps:[`What would you do if the chatbot could not confidently answer a question?`,`How would you evaluate the chatbot's answer quality before launch?`],tags:[`system-design`,`chatbot`]},{id:`sd-003`,category:`System Design`,difficulty:`Intermediate`,question:`How would you design a fraud detection system?`,answer:`I'd design it as a pipeline: real-time feature computation from incoming transactions, a model scoring each transaction for fraud risk, a decision layer applying a threshold with different actions (allow, flag for review, block) depending on risk level, and a feedback loop where confirmed outcomes feed back into retraining. I'd keep the scoring model separate from the decision logic, so business rules around thresholds can be adjusted without retraining the model itself, and add monitoring to catch model drift over time.`,keyPoints:[`Pipeline: real-time features -> model scoring -> risk-based decision layer -> feedback loop`,`Separates scoring model from decision/threshold logic for flexibility`,`Monitors for model drift over time, not just a one-time deployment`],followUps:[`How would you handle the real-time latency requirement for feature computation?`,`How would you validate the system before it goes live with real transactions?`],tags:[`system-design`,`fraud-detection`]},{id:`sd-004`,category:`System Design`,difficulty:`Intermediate`,question:`How would you design a RAG system?`,answer:`I'd start with a document ingestion pipeline that chunks source documents into reasonably sized pieces, generates embeddings for each chunk, and stores them in a vector database. At query time, I'd embed the user's question, retrieve the most relevant chunks by similarity, and pass those chunks along with the question into the LLM's prompt to generate a grounded answer. I'd also track which chunks were actually used, so answers can cite their sources, and periodically refresh the ingestion pipeline as source documents change.`,keyPoints:[`Ingestion: chunk documents, generate embeddings, store in a vector database`,`Query time: embed the question, retrieve relevant chunks, include them in the LLM prompt`,`Track source chunks for citations; refresh ingestion as documents change`],followUps:[`How would you decide on chunk size for the documents?`,`What would you do if retrieval returned irrelevant chunks for a query?`],tags:[`system-design`,`rag`]},{id:`sd-005`,category:`System Design`,difficulty:`Intermediate`,question:`How would you design an AI agent system?`,answer:`I'd design it the way we approached the FNB pipeline: break the overall task into specialised agents with clear, single responsibilities, define a shared state format upfront so agents can communicate reliably, use an orchestration framework like LangGraph to manage the flow and any conditional routing or loops, and add an independent verification step before any consequential action is taken. I'd also build in bounded retries and clear logging so failures are debuggable rather than mysterious.`,keyPoints:[`Break the task into specialised agents with single, clear responsibilities`,`Define a shared state format upfront; use an orchestration framework for flow/routing`,`Independent verification before consequential actions; bounded retries and clear logging`],followUps:[`How would you decide the right number of agents for a new problem?`,`What would you do differently for a system with much higher stakes than FNB's simulation?`],tags:[`system-design`,`agents`]},{id:`sd-006`,category:`System Design`,difficulty:`Intermediate`,question:`How would you handle millions of users?`,answer:`I'd make sure every layer of the system can scale horizontally — stateless services behind load balancers, a database that supports read replicas or sharding for very high read volume, and caching for frequently accessed, slow-changing data. For AI-specific components, I'd consider batching or queuing LLM requests, and using a smaller/cheaper model for routine requests to keep costs and latency manageable at that scale. Load testing well before reaching that scale would be essential to find bottlenecks early rather than discovering them in production.`,keyPoints:[`Horizontal scaling at every layer: stateless services, database read replicas/sharding, caching`,`Batching/queuing LLM requests and model-tiering for cost/latency at scale`,`Proactive load testing to find bottlenecks before they hit production`],followUps:[`Which part of your current projects would struggle first at millions of users?`,`How would you decide between sharding and read replicas for the database layer?`],tags:[`system-design`,`scalability`]},{id:`sd-007`,category:`System Design`,difficulty:`Intermediate`,question:`How would you handle high traffic?`,answer:`I'd use a load balancer to distribute requests across multiple instances of the service, add a queue to absorb sudden spikes so the system degrades gracefully rather than falling over, and use caching aggressively for anything that doesn't need to be recomputed on every request. I'd also make sure the system can auto-scale based on real traffic metrics, and set up alerting so the team knows about a traffic spike before customers start noticing problems.`,keyPoints:[`Load balancing across multiple service instances`,`Queuing to absorb spikes gracefully rather than failing under load`,`Caching, auto-scaling based on real metrics, and proactive alerting`],followUps:[`What would "graceful degradation" actually look like for the FNB pipeline under high traffic?`,`How would you decide what to cache versus always recompute?`],tags:[`system-design`,`performance`]},{id:`sd-008`,category:`System Design`,difficulty:`Intermediate`,question:`How would you reduce latency?`,answer:`I'd look for the biggest contributors first — often LLM calls in an AI pipeline — and reduce them by using smaller models where sufficient, trimming prompt size, and running independent steps in parallel rather than sequentially where possible. Caching repeated computations and using a CDN or edge caching for static content also helps broadly. I'd measure end-to-end latency with proper monitoring so I'm optimising the actual bottleneck, not guessing.`,keyPoints:[`Identify and target the biggest contributors first (often LLM calls)`,`Smaller models where sufficient, trimmed prompts, and parallelising independent steps`,`Caching and monitoring to ensure you optimise the real bottleneck, not a guess`],followUps:[`Which specific step in the FNB pipeline would you profile first for latency?`,`What is the difference between latency and throughput, and why does that distinction matter?`],tags:[`system-design`,`performance`]},{id:`sd-009`,category:`System Design`,difficulty:`Intermediate`,question:`How would you monitor an AI application?`,answer:`I'd track standard system health metrics like latency, error rates and resource usage, alongside AI-specific signals like hallucination or verification-failure rates, retry counts, and any drift in output patterns over time. I'd set up alerting on anomalies in these AI-specific metrics specifically, since a rising failure rate can indicate a real problem — like a schema change or a shift in the kinds of requests coming in — well before it becomes visible through generic system metrics alone.`,keyPoints:[`Standard system metrics: latency, error rates, resource usage`,`AI-specific metrics: hallucination/verification-failure rates, retry counts, output drift`,`Alerting on AI-specific anomalies, which generic system metrics alone would miss`],followUps:[`What would a rising verification-failure rate most likely indicate in the FNB pipeline?`,`How would you set a sensible alert threshold without too many false alarms?`],tags:[`system-design`,`monitoring`]},{id:`sd-010`,category:`System Design`,difficulty:`Intermediate`,question:`How would you handle system failures?`,answer:`I'd design for graceful degradation rather than a hard crash — clear, specific error messages, retries with backoff for transient issues, and fallback behaviour where possible, like failing over to a secondary provider for an LLM outage. I'd make sure failures are logged with enough detail to actually diagnose them afterward, and set up alerting so the team knows about a failure quickly rather than finding out from a frustrated user. Regularly testing failure scenarios deliberately, rather than only reacting when they happen for real, also builds real confidence in how the system behaves under stress.`,keyPoints:[`Graceful degradation: clear errors, retries with backoff, fallback behaviour where possible`,`Detailed logging for diagnosis and prompt alerting for the team`,`Deliberately testing failure scenarios ahead of time, not just reacting when they occur`],followUps:[`What failure scenario would you prioritise testing first for the FNB pipeline?`,`How would you decide when a fallback is worth the added complexity versus just failing clearly?`],tags:[`system-design`,`reliability`]}],la=[{id:`cb-001`,title:`Two Sum`,difficulty:`Beginner`,problem:"Given an array of integers `nums` and an integer `target`, return the indices of the two numbers such that they add up to `target`. You may assume each input has exactly one solution, and you may not use the same element twice. Return the indices in any order.",examples:[{input:`nums = [2, 7, 11, 15], target = 9`,output:`[0, 1]`,explanation:`nums[0] + nums[1] = 2 + 7 = 9`},{input:`nums = [3, 2, 4], target = 6`,output:`[1, 2]`,explanation:`nums[1] + nums[2] = 2 + 4 = 6`},{input:`nums = [3, 3], target = 6`,output:`[0, 1]`}],hints:[`A brute-force approach checking every pair works but is O(n^2) — can you do better?`,`What if, for each number, you already knew whether "target minus this number" had been seen before?`,`A hash map (dictionary) can store numbers you have already seen, mapped to their index, in a single pass.`],approach:`Use a hash map to store each number's value as a key and its index as the value, as you iterate through the array once. For each number, compute the complement (target - current number) and check if it's already in the map. If it is, you've found your pair. If not, add the current number and its index to the map and keep going. This turns an O(n^2) brute-force search into a single O(n) pass.`,solutionPython:`def two_sum(nums, target):
    """Return indices of the two numbers that add up to target."""
    seen = {}  # maps number -> index
    for i, num in enumerate(nums):
        complement = target - num
        if complement in seen:
            return [seen[complement], i]
        seen[num] = i
    return []  # no solution found (shouldn't happen per problem constraints)`,solutionJavaScript:`function twoSum(nums, target) {
  const seen = new Map(); // number -> index
  for (let i = 0; i < nums.length; i++) {
    const complement = target - nums[i];
    if (seen.has(complement)) {
      return [seen.get(complement), i];
    }
    seen.set(nums[i], i);
  }
  return []; // no solution found
}`,explanation:[`seen = {} creates an empty dictionary/map to remember numbers we have already visited and their index.`,`We loop through nums once, tracking both the value (num) and its position (i).`,`For each number, we calculate complement = target - num — the value we would need to have already seen to complete a pair.`,`If complement is already a key in seen, we immediately know both indices that sum to target, so we return them.`,`Otherwise, we store the current number and its index in seen so a later number can find it as a complement.`,`Because both the lookup and insert into a hash map are O(1) on average, the whole pass is O(n).`],timeComplexity:`O(n) — a single pass through the array with O(1) average hash map lookups and inserts.`,spaceComplexity:`O(n) — in the worst case, the hash map stores almost every element before finding a match.`,commonMistakes:[`Using nested loops (O(n^2)) when a single-pass hash map solution is expected for the "expected approach" follow-up.`,`Checking if nums[i] itself equals complement and accidentally reusing the same element twice.`,`Forgetting to add the current number to the map before moving to the next iteration.`,`Returning the values that sum to target instead of their indices.`],followUp:`What would you change if the array could contain multiple valid pairs and you needed to return all of them?`,starterCodePython:`def two_sum(nums, target):

    """Return the first non-repeating character in s, or '_' if none exists."""
    counts = {}
    for ch in s:
        counts[ch] = counts.get(ch, 0) + 1

    for ch in s:

    return "_"`,solutionJavaScript:`function firstNonRepeating(s) {

`,testCases:[{args:`"swiss"`,expected:`"w"`},{args:`"aabbcc"`,expected:`"_"`},{args:`"teeter"`,expected:`"r"`}]},{id:`cb-003`,title:`Reverse a String`,difficulty:`Beginner`,problem:"Write a function that takes a string `s` and returns it reversed, without using any built-in reverse function (like `[::-1]` in Python or `.reverse()` in JavaScript).",examples:[{input:`s = "hello"`,output:`"olleh"`},{input:`s = "AI Interview"`,output:`"weivretnI IA"`},{input:`s = ""`,output:`""`}],hints:[`You can build the reversed string by walking through the original string from the last character to the first.`,`A two-pointer approach — one at the start, one at the end, swapping and moving inward — is a classic technique here.`,`If you convert the string to a list of characters first, swapping becomes straightforward.`],approach:`Use two pointers, one starting at index 0 and one at the last index. Swap the characters at those two positions, then move the left pointer forward and the right pointer backward, repeating until they meet in the middle. Since strings are immutable in both Python and JavaScript, convert to a list/array first, perform the swaps, then join it back into a string.`,solutionPython:`def reverse_string(s):
    """Reverse a string using a two-pointer swap, without built-in reverse."""
    chars = list(s)
    left, right = 0, len(chars) - 1
    while left < right:
        chars[left], chars[right] = chars[right], chars[left]
        left += 1
        right -= 1
    return "".join(chars)`,solutionJavaScript:`function reverseString(s) {
  const chars = s.split("");
  let left = 0;
  let right = chars.length - 1;
  while (left < right) {
    const temp = chars[left];
    chars[left] = chars[right];
    chars[right] = temp;
    left++;
    right--;
  }
  return chars.join("");
}`,explanation:[`chars = list(s) converts the immutable string into a mutable list of individual characters.`,`left and right pointers start at the two ends of the list.`,`While left is still before right, we swap the characters at those two positions.`,`left moves one step forward and right moves one step backward after every swap, closing in on the middle.`,`The loop stops once left meets or passes right, meaning every pair has been swapped.`,`"".join(chars) reassembles the list of characters back into a single reversed string.`],timeComplexity:`O(n) — each character is visited and swapped once, so the work grows linearly with string length.`,spaceComplexity:`O(n) — a new list/array of characters the same size as the input is created (strings are immutable).`,commonMistakes:[`Using the built-in reverse feature directly, which defeats the purpose of a practice exercise on manual reversal.`,`Off-by-one errors when calculating the starting right pointer (forgetting length - 1).`,`Trying to swap characters directly on the original string, forgetting strings are immutable in Python and JS.`,`Not handling an empty string or single-character string as valid edge cases.`],followUp:`How would you reverse only the words in a sentence while keeping each word itself in the original order (e.g. "AI is fun" -> "fun is AI")?`,starterCodePython:`def reverse_string(s):

tags:[`api`]},{id:`rf-013`,question:`What is FastAPI?`,answer:`A modern Python web framework for building APIs quickly with automatic validation and docs.`,tags:[`fastapi`]},{id:`rf-014`,question:`What is overfitting?`,answer:`When a model learns training data too closely and performs poorly on new data.`,tags:[`overfitting`]},{id:`rf-015`,question:`What is precision?`,answer:`Of everything predicted positive, the proportion that was actually correct.`,tags:[`precision`]},{id:`rf-016`,question:`What is recall?`,answer:`Of all actual positives, the proportion the model correctly identified.`,tags:[`recall`]},{id:`rf-017`,question:`What is F1?`,answer:`The harmonic mean of precision and recall, balancing both into one score.`,tags:[`f1`]},{id:`rf-018`,question:`What is classification?`,answer:`Predicting which discrete category an input belongs to.`,tags:[`classification`]},{id:`rf-019`,question:`What is regression?`,answer:`Predicting a continuous numeric value.`,tags:[`regression`]},{id:`rf-020`,question:`What is clustering?`,answer:`Grouping similar data points together without predefined labels.`,tags:[`clustering`]},{id:`rf-021`,question:`What is a neural network?`,answer:`Layers of connected nodes with adjustable weights that learn to map inputs to outputs.`,tags:[`neural-network`]},{id:`rf-022`,question:`What is backpropagation?`,answer:`The algorithm that calculates each weight's contribution to error, working backward through the network.`,tags:[`backpropagation`]},{id:`rf-023`,question:`What is gradient descent?`,answer:`An optimisation algorithm that adjusts weights step by step to minimise loss.`,tags:[`gradient-descent`]},{id:`rf-024`,question:`What is a loss function?`,answer:`A measure of how far off a model's predictions are from the correct answers.`,tags:[`loss-function`]},{id:`rf-025`,question:`What is regularization?`,answer:`Techniques that discourage model complexity to reduce overfitting.`,tags:[`regularization`]},{id:`rf-026`,question:`What is
