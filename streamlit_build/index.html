ubtracting the mean and dividing by the standard deviation. Unlike normalization, it's not bounded to a fixed range, which makes it less sensitive to a single extreme outlier, and it's generally the more common default choice for algorithms like logistic regression, SVMs, and neural networks.`,keyPoints:[`Rescales to mean 0, standard deviation 1`,`Not bounded to a fixed range, less distorted by outliers than min-max normalization`,`Common default for logistic regression, SVMs, neural networks`],followUps:[`What is the formula for standardization?`,`Would you standardize a categorical feature? Why or why not?`],tags:[`standardization`,`preprocessing`]},{id:`ml-020`,category:`Machine Learning`,difficulty:`Intermediate`,question:`What is hyperparameter tuning?`,answer:`Hyperparameters are settings you choose before training that the model doesn't learn on its own — like the learning rate, number of trees in a random forest, or number of layers in a neural network. Hyperparameter tuning is the process of systematically searching for the combination of these settings that gives the best performance on a validation set, rather than guessing or using defaults blindly.`,keyPoints:[`Hyperparameters are set before training, not learned by the model itself`,`Examples: learning rate, number of trees, number of layers`,`Tuning searches for the best combination using validation performance`],followUps:[`Give an example of a hyperparameter versus a learned parameter.`,`How do you avoid overfitting to the validation set during tuning?`],tags:[`hyperparameter-tuning`,`ml`]},{id:`ml-021`,category:`Machine Learning`,difficulty:`Intermediate`,question:`What is grid search?`,answer:`Grid search is a hyperparameter tuning method where you define a fixed set of values for each hyperparameter and exhaustively try every combination, evaluating each on a validation set to find the best one. It's simple and thorough, but it can get very expensive quickly as you add more hyperparameters or more values per hyperparameter, since the number of combinations grows multiplicatively.`,keyPoints:[`Exhaustively tries every combination of predefined hyperparameter values`,`Simple and thorough but computationally expensive as the search space grows`,`Combinations grow multiplicatively with more hyperparameters/values`],followUps:[`How would you make grid search more efficient for a large search space?`,`When would grid search actually be a reasonable choice despite the cost?`],tags:[`grid-search`,`hyperparameter-tuning`]},{id:`ml-022`,category:`Machine Learning`,difficulty:`Intermediate`,question:`What is random search?`,answer:`Random search is a hyperparameter tuning method that samples random combinations from the hyperparameter space instead of trying every possible combination like grid search. Surprisingly, it's often more efficient in practice, because it doesn't waste time exhaustively covering unimportant hyperparameters and instead spreads its budget across the space more broadly, which tends to find good combinations faster for the same computational budget.`,keyPoints:[`Samples random combinations rather than an exhaustive grid`,`Often more efficient than grid search for the same compute budget`,`Spreads search more broadly rather than exhaustively covering less important dimensions`],followUps:[`Why might random search outperform grid search with the same number of trials?`,`What is Bayesian optimisation, and how does it improve on random search?`],tags:[`random-search`,`hyperparameter-tuning`]},{id:`ml-023`,category:`Machine Learning`,difficulty:`Intermediate`,question:`How do you select a model?`,answer:`I'd start with the problem type — classification, regression, clustering — and the nature of the data, like whether it's structured/tabular or more like text or images, since that already narrows the reasonable choices a lot. For structured banking-style data, I'd usually start with a simpler, interpretable model like logistic regression or a tree-based model like random forest or gradient boosting as a strong baseline, before considering something more complex like a neural network, since interpretability and simplicity matter a lot in a regulated industry like banking.`,keyPoints:[`Starts from problem type and data structure to narrow options`,`Prefers a simple, interpretable baseline before complex models`,`Notes interpretability matters especially in regulated industries like banking`],followUps:[`Why does interpretability matter specifically in banking?`,`When would you justify moving to a more complex model like a neural network?`],tags:[`model-selection`,`ml`]},{id:`ml-024`,category:`Machine Learning`,difficulty:`Intermediate`,question:`How do you evaluate a model?`,answer:`I'd choose metrics that actually match the business problem, not just default to accuracy — for fraud detection, that means precision, recall, F1 and ROC-AUC, evaluated on a proper held-out test set that reflects real class proportions. I'd also look beyond a single number: check the confusion matrix to understand what kind of mistakes it makes, and ideally validate on data from a different time period than training to catch potential drift issues before deployment.`,keyPoints:[`Chooses metrics matched to the actual business problem, not just accuracy`,`Uses a proper held-out test set reflecting real-world class proportions`,`Looks at the confusion matrix and considers time-based validation for drift`],followUps:[`What would you do if precision and recall pointed you toward conflicting conclusions?`,`How would time-based validation differ from a random train/test split?`],tags:[`model-evaluation`,`ml`]},{id:`ml-025`,category:`Machine Learning`,difficulty:`Intermediate`,question:`How would you improve a poorly performing model?`,answer:`I'd first diagnose whether the problem is bias or variance by comparing training and validation performance — high error on both suggests underfitting, a big gap suggests overfitting. From there, if it's underfitting, I'd try a more expressive model, better features, or longer training; if it's overfitting, I'd try regularization, more data, or a simpler model. I'd also revisit the data itself — checking for label noise, data leakage, or missing important features — since often the biggest gains come from better data, not a fancier model.`,keyPoints:[`Diagnoses bias vs variance first using training/validation gap`,`Applies the right fix depending on the diagnosis (more capacity vs more regularization)`,`Also checks data quality issues like label noise or leakage, which often matter more than model choice`],followUps:[`What would you check first if you suspected data leakage?`,`How would you know if the ceiling on performance is actually the data quality, not the model?`],tags:[`model-improvement`,`ml`]}],ta=[{id:`llm-001`,category:`LLMs & Generative AI`,difficulty:`Beginner`,question:`What is an LLM?`,answer:`An LLM, or Large Language Model, is a deep learning model trained on huge amounts of text to predict and generate language — given some input text, it predicts what comes next, one piece at a time. That simple mechanism, scaled up with billions of parameters and massive training data, turns out to be powerful enough to do things like answer questions, write code, and hold conversations. In the FNB project, the LLM powering our agents is what lets the Requirement Agent interpret a plain-English banking request.`,keyPoints:[`Deep learning model trained on huge text data to predict/generate language`,`Core mechanism: predicting the next piece of text given context`,`Scale (parameters, data) is what makes it capable of complex tasks`],followUps:[`What does "large" actually refer to in LLM?`,`How is an LLM different from older NLP models?`],tags:[`llm`,`fundamentals`]},{id:`llm-002`,category:`LLMs & Generative AI`,difficulty:`Intermediate`,question:`How does an LLM generate text?`,answer:`It generates text one token at a time, predicting a probability distribution over possible next tokens given everything generated so far, then selecting one (often the most likely, or sampled based on temperature), and repeating that process, feeding its own output back in as new context. It keeps doing this until it produces a stop condition or hits a length limit, which is why longer generations can sometimes drift, since small early choices shape everything that follows.`,keyPoints:[`Predicts one token at a time based on prior context`,`Selects the next token via greedy choice or sampling`,`Feeds its own output back in as context for the next prediction (autoregressive)`],followUps:[`What does "autoregressive" mean in this context?`,`How does temperature affect this token-selection process?`],tags:[`llm`,`text-generation`]},{id:`llm-003`,category:`LLMs & Generative AI`,difficulty:`Beginner`,question:`What are tokens?`,answer:`Tokens are the small chunks of text an LLM actually processes — often pieces of words, whole common words, or punctuation, rather than full words or single characters. For example, 'banking' might be one token, but a rarer word might get split into two or three. Tokens matter practically because pricing, context window limits, and speed are all measured in tokens, not words or characters.`,keyPoints:[`Small text units the model processes — often subword pieces`,`Not always full words or single characters`,`Pricing, context limits and latency are measured in tokens`],followUps:[`Why do models use subword tokens instead of whole words?`,`Roughly how many tokens is a typical English word?`],tags:[`tokens`,`llm`]},{id:`llm-004`,category:`LLMs & Generative AI`,difficulty:`Intermediate`,question:`What are embeddings?`,answer:`Embeddings are numeric vector representations of text (or other data) that capture semantic meaning — texts with similar meaning end up with vectors that are close together in that vector space, even if they don't share the same words. They're the foundation of semantic search and RAG systems, since comparing vectors lets you find relevant content by meaning rather than exact keyword matching.`,keyPoints:[`Numeric vectors that capture semantic meaning of text`,`Similar meaning -> vectors close together in vector space`,`Foundation for semantic search and RAG`],followUps:[`How would you measure how "close" two embeddings are?`,`How are embeddings generated in the first place?`],tags:[`embeddings`,`llm`]},{id:`llm-005`,category:`LLMs & Generative AI`,difficulty:`Intermediate`,question:`What is semantic search?`,answer:`Semantic search finds results based on meaning rather than exact keyword matches — searching for 'lost my card' could still surface a document about 'reporting a stolen card' because the meanings are close, even without shared words. It typically works by converting both the query and the documents into embeddings, then finding the documents whose embeddings are closest to the query's embedding.`,keyPoints:[`Finds results by meaning, not just exact keyword overlap`,`Example: "lost my card" matching "reporting a stolen card"`,`Implemented by comparing query and document embeddings`],followUps:[`How is semantic search different from traditional keyword search like SQL LIKE queries?`,`What could go wrong with pure semantic search?`],tags:[`semantic-search`,`embeddings`]},{id:`llm-006`,category:`LLMs & Generative AI`,difficulty:`Intermediate`,question:`What is vector search?`,answer:`Vector search is the technical mechanism behind semantic search — given a query vector (embedding), it finds the nearest vectors in a large collection, usually using a distance metric like cosine similarity, often accelerated with a specialised vector database or index (like an ANN index) so it stays fast even with millions of vectors. It's the retrieval step in most RAG pipelines.`,keyPoints:[`Finds nearest vectors to a query vector using a distance metric like cosine similarity`,`Vector databases/ANN indexes make this efficient at large scale`,`It is the retrieval mechanism underlying RAG`],followUps:[`What is cosine similarity measuring exactly?`,`Name a vector database you have heard of or would consider using.`],tags:[`vector-search`,`rag`]},{id:`llm-007`,category:`LLMs & Generative AI`,difficulty:`Intermediate`,question:`What is RAG?`,answer:`RAG, or Retrieval-Augmented Generation, is a pattern where you retrieve relevant information from an external source — like a document store or database — and feed it into the LLM's prompt as context before it generates an answer, rather than relying purely on what the model memorised during training. It's how you get an LLM to answer accurately about information it wasn't trained on, or that's changed since training, like current account balances or recent policy documents.`,keyPoints:[`Retrieves relevant external information and feeds it into the prompt as context`,`Reduces reliance on the model's frozen training-time knowledge`,`Useful for current, private, or domain-specific information`],followUps:[`How would RAG apply to the FNB banking system if you were to add it?`,`What is the typical retrieval step built on (hint: think embeddings)?`],tags:[`rag`,`llm`]},{id:`llm-008`,category:`LLMs & Generative AI`,difficulty:`Intermediate`,question:`Why use RAG?`,answer:`RAG lets you ground an LLM's answers in real, current, verifiable information instead of relying on what it memorised during training, which reduces hallucination and lets the system reflect information that's private, proprietary, or simply too recent to have been in training data. For a bank, that might mean grounding answers in internal policy documents or product terms, rather than having the model guess based on general knowledge.`,keyPoints:[`Grounds answers in real, current, verifiable data`,`Reduces hallucination compared to relying purely on memorised training knowledge`,`Enables use of private/proprietary or very recent information`],followUps:[`What is the alternative to RAG if you want the model to "know" new information?`,`What are the limitations of RAG?`],tags:[`rag`,`llm`]},{id:`llm-009`,category:`LLMs & Generative AI`,difficulty:`Beginner`,question:`What is hallucination?`,answer:`Hallucination is when an LLM generates output that sounds confident and plausible but is actually incorrect or made up — like a SQL query referencing a column that doesn't exist in the schema, which is exactly the failure mode we had to design around in the FNB project's Code Agent. The dangerous part isn't that it's wrong, it's that it often looks just as convincing as a correct answer, which is why verification matters so much.`,keyPoints:[`Confident, plausible-sounding but factually incorrect or fabricated output`,`Directly ties to the FNB SQL-hallucination problem the user already knows well`,`Dangerous because it looks as convincing as correct output`],followUps:[`Why is hallucination especially risky in a banking context?`,`What is the difference between hallucination and a model simply being outdated?`],tags:[`hallucination`,`llm`]},{id:`llm-010`,category:`LLMs & Generative AI`,difficulty:`Intermediate`,question:`Why do LLMs hallucinate?`,answer:`LLMs are fundamentally predicting the most statistically likely next token based on patterns learned during training, not looking anything up or reasoning about ground truth — so when they lack real information about something, they can still generate something that fits the pattern of a plausible answer, without any built-in mechanism to know it's wrong. It's made worse when the training data is sparse or ambiguous on a topic, or when a prompt nudges the model toward answering confidently even without solid grounding.`,keyPoints:[`Models predict statistically likely text, not verified facts`,`No built-in mechanism to "know" it doesn't know something`,`Sparse/ambiguous training data and prompts demanding confident answers make it worse`],followUps:[`How does this relate to why RAG helps reduce hallucination?`,`Can hallucination ever be fully eliminated? Why or why not?`],tags:[`hallucination`,`llm`]},{id:`llm-011`,category:`LLMs & Generative AI`,difficulty:`Intermediate`,question:`How can hallucinations be reduced?`,answer:`A combination of techniques works best: grounding responses with RAG so the model has real context to draw from; giving the model explicit, accurate context (like real schema information, as we do for the Code Agent) rather than expecting it to recall details; adding an independent verification step, like our Verifier Agent, that checks output against ground truth before it's trusted or acted on; and prompting the model to say when it's unsure rather than always answering confidently.`,keyPoints:[`RAG for grounding responses in real information`,`Providing explicit, accurate context directly in the prompt`,`Independent verification of output, plus prompting for honest uncertainty`],followUps:[`Which of these did you actually apply on the FNB project?`,`How would you measure whether these techniques are working?`],tags:[`hallucination`,`llm`]},{id:`llm-012`,category:`LLMs & Generative AI`,difficulty:`Beginner`,question:`What is prompt engineering?`,answer:`Prompt engineering is the practice of carefully designing the instructions and context you give an LLM to get more reliable, accurate output, without changing the model itself. It includes things like being explicit about the desired output format, giving relevant examples, and providing necessary context like schema details. On the FNB project, this was one of our main levers for reducing SQL hallucination — a clearer, more specific prompt to the Code Agent measurably changed its output quality.`,keyPoints:[`Designing instructions/context to get better output without changing the model`,`Includes format instructions, examples, and relevant context`,`Was a real, practical lever used on the FNB project to reduce hallucination`],followUps:[`What is one specific prompt change you made on the FNB project and why?`,`What is the difference between prompt engineering and fine-tuning?`],tags:[`prompt-engineering`,`llm`]},{id:`llm-013`,category:`LLMs & Generative AI`,difficulty:`Intermediate`,question:`What makes a good prompt?`,answer:`A good prompt is specific and unambiguous about what's expected — the desired output format, any constraints, and relevant context the model needs but doesn't already have, like our database schema. It often helps to give an example of the expected output, and to break a complex task into clear steps rather than one vague instruction. It should also anticipate edge cases; for the Code Agent, that meant explicitly telling it to only generate SELECT statements, not assuming it would infer that on its own.`,keyPoints:[`Specific, unambiguous about desired output and constraints`,`Includes necessary context and, ideally, examples`,`Explicitly addresses edge cases rather than assuming the model will infer them`],followUps:[`Can you give an example of a vague prompt versus an improved version?`,`How do you iterate on a prompt systematically rather than by guesswork?`],tags:[`prompt-engineering`,`llm`]},{id:`llm-014`,category:`LLMs & Generative AI`,difficulty:`Intermediate`,question:`What is structured output?`,answer:`Structured output is when you constrain an LLM to respond in a specific, predictable format, like JSON matching a defined schema, rather than free-form prose. This matters a lot when another piece of code needs to parse and act on the model's response — in the FNB pipeline, the Requirement Agent's output needs to be structured so the Code Agent can reliably read the entities and filters from it, rather than trying to parse loose natural language.`,keyPoints:[`Constrains model output to a predictable format like JSON`,`Critical when downstream code needs to parse and act on the output reliably`,`Directly relevant to how the Requirement Agent passes its output to the Code Agent`],followUps:[`How do you actually enforce structured output from an LLM in practice?`,`What happens if the model still produces malformed structured output occasionally?`],tags:[`structured-output`,`llm`]},{id:`llm-015`,category:`LLMs & Generative AI`,difficulty:`Beginner`,question:`What is temperature?`,answer:`Temperature is a setting that controls how random or deterministic an LLM's output is. A low temperature (close to 0) makes the model favour the most likely next token, giving more consistent, predictable output — useful for something like SQL generation where you want reliability. A higher temperature introduces more randomness, encouraging more varied or creative output, which is better suited to brainstorming or creative writing tasks than a banking pipeline.`,keyPoints:[`Controls randomness in next-token selection`,`Low temperature: consistent, predictable output — good for SQL generation`,`High temperature: more varied/creative output — good for brainstorming`],followUps:[`What temperature would you use for the Code Agent, and why?`,`What happens at temperature exactly 0?`],tags:[`temperature`,`llm`]},{id:`llm-016`,category:`LLMs & Generative AI`,difficulty:`Intermediate`,question:`What is context window?`,answer:`The context window is the maximum amount of text, measured in tokens, that an LLM can consider at once — including the prompt, any provided context, and the conversation history. If your input plus expected output exceeds that limit, older or excess content gets cut off, which matters a lot when you're feeding in something like a database schema alongside a user's request, since large schemas can eat into that budget quickly.`,keyPoints:[`Maximum tokens the model can consider at once (input + output)`,`Exceeding it means content gets truncated or cut off`,`Relevant when combining schema context with a user request in the same prompt`],followUps:[`How would you handle a schema too large to fit comfortably in the context window?`,`What are the trade-offs of using a model with a much larger context window?`],tags:[`context-window`,`llm`]},{id:`llm-017`,category:`LLMs & Generative AI`,difficulty:`Intermediate`,question:`What is fine-tuning?`,answer:`Fine-tuning is the process of further training a pre-trained LLM on your own, more specific dataset so it adapts its behaviour or style to your particular use case, rather than relying purely on prompting. For example, you might fine-tune a model on examples of correct SQL generation for your specific schema style, so it produces more consistent output with shorter prompts. It's more expensive and slower to iterate on than prompting, so it's usually a later-stage optimisation, not a first step.`,keyPoints:[`Further trains a pre-trained model on your own specific dataset`,`Adapts behaviour/style beyond what prompting alone can achieve`,`More costly and slower to iterate than prompt engineering, usually a later optimisation`],followUps:[`When would you reach for fine-tuning instead of just improving the prompt?`,`What data would you need to fine-tune a model for SQL generation?`],tags:[`fine-tuning`,`llm`]},{id:`llm-018`,category:`LLMs & Generative AI`,difficulty:`Intermediate`,question:`Fine-tuning vs RAG?`,answer:`RAG changes what information the model has access to at query time, by retrieving and injecting relevant context, without changing the model's weights — it's great for keeping answers current and grounded in specific documents. Fine-tuning changes the model itself, adjusting its weights to change its behaviour, tone, or style consistently — better suited for teaching a model a specific format or skill rather than specific facts. In practice they can be combined: fine-tune for consistent behaviour, RAG for current, factual grounding.`,keyPoints:[`RAG: changes available information at query time, no weight changes`,`Fine-tuning: changes the model's weights/behaviour directly`,`RAG suits current/factual grounding; fine-tuning suits consistent style/skill; can combine both`],followUps:[`Which would you reach for first on a tight budget and timeline?`,`Could you use both together on the FNB project? How?`],tags:[`rag`,`fine-tuning`,`llm`]},{id:`llm-019`,category:`LLMs & Generative AI`,difficulty:`Beginner`,question:`What is zero-shot prompting?`,answer:`Zero-shot prompting is asking an LLM to perform a task with no examples given — just a clear instruction and the task itself, relying entirely on what the model already learned during training. It's the simplest approach and often works well for straightforward tasks, but for something more specific or nuanced, like generating SQL in a particular style, it can be less reliable than giving the model an example first.`,keyPoints:[`Asks the model to perform a task with no examples provided`,`Relies entirely on the model's pre-trained general knowledge`,`Simple but can be less reliable for specific/nuanced tasks`],followUps:[`When would zero-shot prompting be enough versus needing few-shot?`,`Could you give an example of a zero-shot prompt for the Requirement Agent?`],tags:[`zero-shot`,`prompt-engineering`]},{id:`llm-020`,category:`LLMs & Generative AI`,difficulty:`Beginner`,question:`What is few-shot prompting?`,answer:`Few-shot prompting means including a small number of example input-output pairs directly in the prompt to show the model exactly the pattern or format you want, before giving it the real task. For the Code Agent, that might mean showing two or three examples of a natural-language spec paired with correctly generated SQL, which tends to make output far more consistent than just describing the format in words.`,keyPoints:[`Includes a few example input-output pairs directly in the prompt`,`Demonstrates the desired pattern/format rather than just describing it`,`Tends to improve consistency over zero-shot for specific formats`],followUps:[`How many examples is usually enough before returns diminish?`,`What is the risk of choosing bad or unrepresentative examples?`],tags:[`few-shot`,`prompt-engineering`]},{id:`llm-021`,category:`LLMs & Generative AI`,difficulty:`Intermediate`,question:`What is function/tool calling?`,answer:`Function or tool calling is a capability where an LLM can decide to invoke an external function or API — like a database query, a calculator, or a search tool — rather than trying to answer everything purely from its own generated text. The model outputs a structured request specifying which tool to call and with what arguments, your code executes that tool, and the result gets fed back to the model. This is central to how AI agents actually do things in the real world, like our Code Agent effectively 'calling' the database via the verification and execution steps.`,keyPoints:[`Lets an LLM request an external function/API call rather than only generating text`,`Model outputs a structured call (which tool, what arguments); your code executes it`,`Central to how agents interact with real systems, not just generate text`],followUps:[`How would you design a tool interface so the model uses it reliably?`,`What happens if the model calls a tool with invalid arguments?`],tags:[`tool-calling`,`agents`]},{id:`llm-022`,category:`LLMs & Generative AI`,difficulty:`Beginner`,question:`What is an AI copilot?`,answer:`An AI copilot is an assistant that works alongside a human, helping them complete a task faster or more effectively rather than fully automating it end to end — like a coding assistant that suggests code as a developer types, or an assistant that drafts a response for a human to review and send. The key idea is the human stays in control and makes the final call, with the AI handling the more repetitive or time-consuming parts.`,keyPoints:[`Assists a human rather than fully replacing their judgement`,`Human stays in control and makes final decisions`,`AI handles repetitive/time-consuming parts to speed up the human`],followUps:[`How would a copilot model apply to reviewing the FNB pipeline's generated SQL?`,`What is the difference between a copilot and a fully autonomous agent?`],tags:[`copilot`,`human-in-the-loop`]},{id:`llm-023`,category:`LLMs & Generative AI`,difficulty:`Intermediate`,question:`What are limitations of LLMs?`,answer:`LLMs can hallucinate confidently incorrect information, their knowledge is frozen at training time unless augmented with RAG, they can be sensitive to how a prompt is phrased, and they don't have built-in real reasoning or fact-checking — they're doing sophisticated pattern completion, not genuine understanding. They're also expensive and can be slow at scale, and they can be manipulated through prompt injection if untrusted input is fed into them without care.`,keyPoints:[`Hallucination, frozen training-time knowledge, prompt sensitivity`,`Sophisticated pattern completion, not genuine reasoning or fact-checking`,`Cost, latency at scale, and vulnerability to prompt injection`],followUps:[`Which of these limitations did you have to actively design around in the FNB project?`,`How would you explain "pattern completion, not understanding" to a non-technical person?`],tags:[`llm`,`limitations`]},{id:`llm-024`,category:`LLMs & Generative AI`,difficulty:`Intermediate`,question:`How would you evaluate an LLM application?`,answer:`I'd build a fixed evaluation set of realistic inputs with known-correct or acceptable outputs, and measure the application against it consistently as I make changes, rather than relying on impressions from a handful of manual tests. For the FNB pipeline specifically, that means a set of natural-language requests with known-correct SQL, checking not just whether the final answer is right but whether verification correctly caught the cases it should have. I'd also track things like hallucination rate and retry counts over time as ongoing quality signals, not just a one-time check before launch.`,keyPoints:[`Builds a fixed evaluation set with known-correct/acceptable outputs`,`Evaluates both final correctness and intermediate behaviour (e.g. verification catching errors)`,`Tracks ongoing quality metrics over time, not just a pre-launch check`],followUps:[`What would you include in that evaluation set for the FNB pipeline specifically?`,`How would you evaluate output quality when there isn't a single "correct" answer?`],tags:[`llm-evaluation`,`fnb`]},{id:`llm-025`,category:`LLMs & Generative AI`,difficulty:`Intermediate`,question:`How would you reduce LLM latency?`,answer:`I'd look at using a smaller, faster model for simpler sub-tasks, reserving a larger model only for the parts that genuinely need more reasoning power. I'd also reduce prompt size where possible, since fewer tokens mean faster processing, and consider streaming output back to the user so it feels responsive even if the full generation takes a moment. Caching repeated or similar requests, and running independent steps in parallel rather than strictly sequentially where the pipeline design allows it, would also help.`,keyPoints:[`Model-tiering: smaller/faster model for simpler steps`,`Reduce prompt size; stream output for perceived responsiveness`,`Caching and parallelising independent steps where possible`],followUps:[`Which steps in the FNB pipeline could realistically run in parallel?`,`What is the trade-off of using a smaller model for some steps?`],tags:[`latency`,`llm`,`performance`]},{id:`llm-026`,category:`LLMs & Generative AI`,difficulty:`Intermediate`,question:`How would you reduce LLM costs?`,answer:`The main levers are using the smallest model that still meets quality requirements for each specific step, minimising prompt length by trimming unnecessary context, caching repeated calls like static schema information instead of resending it every time, and avoiding unnecessary retries by improving the initial prompt quality so fewer refinement loops are needed in the first place. I'd measure cost per request so I could see the actual impact of each of these changes rather than guessing.`,keyPoints:[`Use the smallest sufficient model per step; trim unnecessary prompt content`,`Cache repeated/static context instead of resending it`,`Reduce retries by improving initial prompt quality; measure cost per request`],followUps:[`How would you measure cost per request across a multi-agent pipeline?`,`What is the risk of being too aggressive about cost-cutting on an LLM pipeline?`],tags:[`cost-optimisation`,`llm`]}],na=[{id:`agent-001`,category:`AI Agents`,difficulty:`Beginner`,question:`What is an AI agent?`,answer:`An AI agent is a system built around an LLM that can take actions and make decisions toward a goal, often using tools, maintaining some form of state, and sometimes looping until a task is complete — rather than just responding once to a single prompt. In the FNB project, each of our Requirement, Code and Verifier components acts as an agent: each has a specific role, receives input, and produces output that drives what happens next in the pipeline.`,keyPoints:[`Built around an LLM but can take actions/decisions toward a goal`,`Often uses tools, maintains state, and may loop until done`,`FNB's Requirement/Code/Verifier agents are concrete examples`],followUps:[`What specifically makes something an "agent" versus just an LLM call?`,`Which of the FNB agents has the most autonomy?`],tags:[`agents`,`fundamentals`]},{id:`agent-002`,category:`AI Agents`,difficulty:`Intermediate`,question:`How is an AI agent different from an LLM application?`,answer:`A basic LLM application typically takes an input, makes one call to the model, and returns an output — like a simple chatbot response. An agent goes further: it can decide what to do next based on intermediate results, potentially call tools or other agents, and loop or branch depending on outcomes. Our FNB pipeline isn't just one call — it dynamically routes between agents and can loop back for refinement based on verification results, which is what makes it agentic rather than a single LLM call.`,keyPoints:[`Simple LLM app: one call, one output`,`Agent: makes decisions, can call tools/other agents, can loop or branch`,`FNB pipeline's dynamic routing and refinement loop is what makes it agentic`],followUps:[`At what point would you say a system stops being "just an LLM app" and becomes an agent?`,`Could the FNB pipeline be built as a single LLM call instead? What would be lost?`],tags:[`agents`,`llm`]},{id:`agent-003`,category:`AI Agents`,difficulty:`Beginner`,question:`What is a multi-agent system?`,answer:`A multi-agent system is one where multiple specialised agents collaborate, each responsible for a different part of a larger task, rather than one agent trying to do everything. The FNB pipeline is a clear example: the Requirement Agent, Code Agent and Verifier Agent each own a distinct responsibility and pass information between each other through shared state to complete the overall task together.`,keyPoints:[`Multiple specialised agents collaborating on a larger task`,`Each agent owns a distinct responsibility`,`FNB's three-agent pipeline is a direct real-world example`],followUps:[`What are the coordination challenges specific to multi-agent systems?`,`How do you decide how many agents is the right number?`],tags:[`multi-agent`,`fnb`]},{id:`agent-004`,category:`AI Agents`,difficulty:`Intermediate`,question:`Why use multiple agents?`,answer:`Splitting responsibilities across agents makes each one's job simpler and easier to prompt well, test independently, and improve without affecting the others. It also creates natural checkpoints — like our Verifier Agent sitting between generation and execution — that would be harder to enforce cleanly inside a single monolithic agent trying to do everything at once. The trade-off is more coordination complexity and typically more LLM calls, but for a safety-sensitive use case like banking, that trade-off is worth it.`,keyPoints:[`Specialisation makes each agent simpler to prompt, test and improve independently`,`Creates natural safety checkpoints between stages`,`Trade-off: more coordination complexity and LLM calls, but worth it for safety-sensitive use cases`],followUps:[`What would you lose by merging the Code Agent and Verifier Agent into one?`,`How do you decide where to draw the boundary between agents?`],tags:[`multi-agent`,`design-rationale`]},{id:`agent-005`,category:`AI Agents`,difficulty:`Beginner`,question:`What is tool use?`,answer:`Tool use is when an agent can call external functions or APIs to do things an LLM can't do reliably on its own — like querying a real database, doing precise arithmetic, or searching the web — rather than trying to generate the answer purely from its own text prediction. In the FNB pipeline, executing the verified SQL against PostgreSQL is effectively a tool call: the agent's job is to produce the right SQL, and a separate, reliable execution tool actually runs it.`,keyPoints:[`Agent calls external functions/APIs instead of relying purely on generated text`,`Used for things LLMs are unreliable at doing directly: precise math, real data lookups`,`FNB's database execution step is effectively a tool call`],followUps:[`Why is it risky to let an LLM do arithmetic directly instead of using a tool?`,`What tools, if any, could you add to the Requirement Agent?`],tags:[`tool-use`,`agents`]},{id:`agent-006`,category:`AI Agents`,difficulty:`Intermediate`,question:`What is agent memory?`,answer:`Agent memory refers to information an agent retains and can use beyond a single step — this could be short-term, like the current pipeline's shared state carrying the spec and SQL through each stage, or long-term, like remembering a user's previous requests across sessions. The FNB pipeline currently only has short-term, per-run memory through LangGraph's state; it doesn't retain anything across separate user requests, which would need a separate persistence layer to add.`,keyPoints:[`Information an agent retains and reuses beyond a single step`,`Short-term: within one pipeline run. Long-term: across sessions`,`FNB pipeline currently only has short-term, per-run state, honestly noted as a gap`],followUps:[`How would you add long-term memory to the FNB pipeline?`,`What are the risks of adding long-term memory to a banking AI system?`],tags:[`agent-memory`,`fnb`]},{id:`agent-007`,category:`AI Agents`,difficulty:`Intermediate`,question:`What is agent state?`,answer:`Agent state is the data that represents everything relevant about where a task currently stands as it moves through a pipeline. In the FNB system, state includes the original request, the structured specification from the Requirement Agent, the SQL generated by the Code Agent, the verification result, and the retry count — it's what LangGraph passes between nodes, and each agent reads and updates the parts relevant to it.`,keyPoints:[`Data representing the current status of a task as it moves through the pipeline`,`FNB example: request, spec, SQL, verification result, retry count`,`Passed between nodes in the LangGraph graph, read/updated by each agent`],followUps:[`What would happen if two agents tried to update the same field in state simultaneously?`,`How is state different from long-term memory?`],tags:[`agent-state`,`langgraph`]},{id:`agent-008`,category:`AI Agents`,difficulty:`Beginner`,question:`What is an agent workflow?`,answer:`An agent workflow is the defined sequence, or graph, of steps an agent system follows to complete a task — which agent runs when, what conditions trigger moving forward versus looping back, and where the workflow ends. For the FNB pipeline, the workflow is: Requirement Agent, then Code Agent, then Verifier Agent, with a conditional edge that routes back to the Code Agent on verification failure, or forward to execution on success.`,keyPoints:[`The defined sequence/graph of steps an agent system follows`,`Includes conditions for branching or looping, not just a straight line`,`FNB example: linear flow with a conditional loop-back on verification failure`],followUps:[`How would you visualise or document this workflow for a new teammate?`,`What would you add to the workflow to handle a repeated verification failure?`],tags:[`agent-workflow`,`langgraph`]},{id:`agent-009`,category:`AI Agents`,difficulty:`Beginner`,question:`What is LangGraph?`,answer:`LangGraph is a framework for building applications, especially multi-agent or multi-step LLM systems, as a graph of nodes and edges, where each node represents a step (often an agent or function) and edges define how control and state flow between them, including conditional branches and loops. We used it to orchestrate the FNB pipeline's Requirement, Code and Verifier agents and to implement the refinement loop when verification fails.`,keyPoints:[`Framework for building multi-step/multi-agent LLM applications as a graph`,`Nodes = steps/agents, edges = control and state flow, including conditionals and loops`,`Used directly to orchestrate the FNB pipeline and its refinement loop`],followUps:[`How does LangGraph differ from just chaining function calls yourself?`,`What other orchestration frameworks have you heard of or considered?`],tags:[`langgraph`,`agents`]},{id:`agent-010`,category:`AI Agents`,difficulty:`Intermediate`,question:`Why use LangGraph?`,answer:`We needed conditional routing and looping — specifically, routing back to the Code Agent on verification failure rather than always moving forward — and LangGraph gives that to us cleanly as part of its graph model, rather than us hand-writing that control flow with nested conditionals and manual state passing. It also made the pipeline's structure more explicit and visual, which helped the team reason about and debug the flow together, since everyone could see the graph rather than trace through scattered function calls.`,keyPoints:[`Provides conditional routing/looping cleanly through its graph model`,`Avoids hand-rolled nested conditionals and manual state-passing code`,`Makes pipeline structure explicit, aiding team understanding and debugging`],followUps:[`What would the equivalent hand-rolled code have looked like without LangGraph?`,`What is a limitation of LangGraph you have run into?`],tags:[`langgraph`,`design-rationale`]},{id:`agent-011`,category:`AI Agents`,difficulty:`Intermediate`,question:`What is an agent loop?`,answer:`An agent loop is a repeating cycle where an agent takes an action, observes the result, and decides whether to act again or stop, continuing until some completion condition is met. In the FNB pipeline, the refinement loop is a bounded agent loop: the Code Agent generates SQL, the Verifier Agent checks it, and if it fails, control loops back to the Code Agent with the failure reason, up to a maximum number of attempts before giving up.`,keyPoints:[`A repeating act-observe-decide cycle until a stopping condition is met`,`FNB's refinement loop (generate, verify, retry) is a concrete bounded example`,`Bounding the loop (max attempts) is important to avoid infinite loops`],followUps:[`Why is it important to bound this loop with a maximum attempt count?`,`What would you do once the maximum attempts are exhausted?`],tags:[`agent-loop`,`fnb`]},{id:`agent-012`,category:`AI Agents`,difficulty:`Intermediate`,question:`What is reflection?`,answer:`Reflection is when an agent evaluates its own previous output or reasoning and uses that self-assessment to improve its next attempt, rather than just retrying blindly. In our pipeline, when the Verifier Agent's failure reason is fed back into the Code Agent's next prompt, that's a lightweight form of reflection — the system is using an assessment of what went wrong to inform a better next attempt, rather than the Code Agent just guessing again from scratch.`,keyPoints:[`Agent evaluates its own output/reasoning to improve subsequent attempts`,`Different from blind retrying — it uses specific feedback`,`FNB's failure-reason-to-Code-Agent loop is a lightweight, practical example`],followUps:[`How could you make the reflection step even more sophisticated in this pipeline?`,`What is the risk of an agent reflecting on and trusting its own flawed reasoning?`],tags:[`reflection`,`agents`]},{id:`agent-013`,category:`AI Agents`,difficulty:`Intermediate`,question:`What is self-reflection prompting?`,answer:`Self-reflection prompting is a technique where you explicitly ask the model to critique or check its own output before finalising it — for example, prompting the Code Agent to review its generated SQL against the given schema and flag any concerns before returning it, rather than returning the first thing it produces. It can catch some mistakes, but it isn't a substitute for independent verification, since a model reflecting on its own reasoning can still miss the same blind spots that caused the original mistake.`,keyPoints:[`Explicitly prompts the model to critique/check its own output before finalising`,`Can catch some mistakes proactively`,`Not a substitute for independent verification, since the same blind spots can persist`],followUps:[`Would you add this to the Code Agent in addition to the Verifier Agent, or instead of it?`,`What is a concrete self-reflection prompt you could write for SQL generation?`],tags:[`self-reflection`,`prompt-engineering`]},{id:`agent-014`,category:`AI Agents`,difficulty:`Intermediate`,question:`What are the disadvantages of multi-agent systems?`,answer:`They're more complex to design, debug and reason about than a single agent, since a problem could originate in any of several agents or in how they communicate. They also tend to cost more and be slower, since you're often making multiple LLM calls instead of one. And there's coordination risk — if agents disagree about the format or meaning of shared state, subtle bugs can appear that are harder to trace than a bug in a single, self-contained agent.`,keyPoints:[`More complex to design/debug — failure could be in any agent or their communication`,`Higher cost and latency from multiple LLM calls`,`Coordination risk from disagreements about shared state format`],followUps:[`Have you personally run into a coordination bug on the FNB project?`,`How would you make debugging a multi-agent system easier?`],tags:[`multi-agent`,`trade-offs`]},{id:`agent-015`,category:`AI Agents`,difficulty:`Intermediate`,question:`How do you prevent agents from getting stuck in loops?`,answer:`The most direct way is to bound the loop with a maximum number of attempts, like we did in the FNB refinement loop, so a persistently failing case doesn't retry forever. I'd also make sure each retry is actually informed by the previous failure, so it's not just blindly repeating the same mistake, and add a clear fallback — like returning a clear error to the user after the maximum retries — rather than the pipeline hanging or silently failing.`,keyPoints:[`Bound the loop with a maximum attempt count`,`Make each retry informed by the previous failure, not a blind repeat`,`Define a clear fallback/exit path once the maximum is reached`],followUps:[`What retry limit did you actually choose for the FNB pipeline, and how did you pick it?`,`What would you log when the maximum retries is hit, to help debug it later?`],tags:[`agent-loop`,`reliability`]},{id:`agent-016`,category:`AI Agents`,difficulty:`Intermediate`,question:`How do you evaluate an AI agent?`,answer:`I'd evaluate both the end-to-end outcome and the intermediate decisions the agent makes along the way — for the FNB pipeline, that means checking whether the final SQL and result are correct, but also whether the Verifier Agent correctly caught cases it should have caught, and how many retries typical requests need. I'd build a fixed test set of realistic scenarios, including deliberately tricky or adversarial ones, and track these metrics consistently over time as the system changes, rather than relying on one-off manual checks.`,keyPoints:[`Evaluates both final outcome and intermediate agent decisions`,`Uses a fixed, realistic (and adversarial) test set for consistency`,`Tracks metrics over time, not just one-off manual spot checks`],followUps:[`What would an adversarial test case for the Verifier Agent look like?`,`How would you know if the Requirement Agent specifically was the weak link versus the Code Agent?`],tags:[`agent-evaluation`,`fnb`]},{id:`agent-017`,category:`AI Agents`,difficulty:`Intermediate`,question:`How do you make agents reliable?`,answer:`Reliability comes from a combination of good prompting with explicit context, independent verification of anything risky before it's acted on, bounded retries with informed feedback rather than infinite or blind loops, and solid logging so failures can actually be understood and fixed rather than being mysterious. It also comes from testing against a realistic and adversarial set of scenarios before trusting the system, and continuing to monitor its behaviour once it's live, since reliability isn't a one-time achievement — it needs to be maintained as usage patterns and inputs evolve.`,keyPoints:[`Good prompting with explicit context, plus independent verification`,`Bounded, informed retries and solid logging/observability`,`Ongoing testing and monitoring, not a one-time achievement`],followUps:[`Which of these mattered most in practice on the FNB project?`,`How would you prioritise these if you only had time to implement one or two?`],tags:[`reliability`,`agents`]}],ra=[{id:`py-001`,category:`Python`,difficulty:`Beginner`,question:`Why is Python popular in AI?`,answer:`Python has a huge, mature ecosystem of AI and data libraries — things like NumPy, Pandas, scikit-learn, PyTorch and the LangChain/LangGraph ecosystem I used on the FNB project — so you rarely have to build core functionality from scratch. It's also readable and quick to write, which matters a lot when you're experimenting with models or agent designs and want to iterate fast rather than fight the language itself.`,keyPoints:[`Huge, mature ecosystem of AI/data libraries (NumPy, Pandas, PyTorch, LangGraph)`,`Readable syntax supports fast iteration and experimentation`,`Widely adopted, so community support and examples are abundant`],followUps:[`What are Python's downsides compared to other languages for production AI systems?`,`Which specific libraries have you used most?`],tags:[`python`,`ai`]},{id:`py-002`,category:`Python`,difficulty:`Beginner`,question:`What Python libraries have you used?`,answer:`On the AI side, I've used LangGraph for orchestrating the FNB multi-agent pipeline, plus standard libraries for working with LLM APIs. For the database layer, I've used libraries for connecting to and querying PostgreSQL. For the web/API side I've used FastAPI to build backend endpoints. And for general data work I've used NumPy and Pandas when I needed to manipulate or analyse structured data for machine learning tasks.`,keyPoints:[`LangGraph for multi-agent orchestration on the FNB project`,`PostgreSQL client libraries and FastAPI for backend/API work`,`NumPy and Pandas for general data manipulation`],followUps:[`Which library took the longest for you to become comfortable with?`,`What would you reach for to build a REST API quickly in Python?`],tags:[`python`,`libraries`]},{id:`py-003`,category:`Python`,difficulty:`Beginner`,question:`List vs tuple.`,answer:`Both store ordered collections of items, but a list is mutable — you can add, remove or change elements after creating it — while a tuple is immutable, meaning once it's created you can't change its contents. I tend to use lists for collections I expect to modify, like accumulating results in a loop, and tuples for fixed groupings of values, like a coordinate pair or a fixed return value with multiple parts, where I want to signal it shouldn't change.`,keyPoints:[`List: mutable, ordered collection`,`Tuple: immutable, ordered collection`,`Choose based on whether the collection should be modifiable`],followUps:[`Why might immutability be useful, beyond just preventing accidental changes?`,`Can a tuple contain a mutable object like a list?`],tags:[`python`,`data-structures`]},{id:`py-004`,category:`Python`,difficulty:`Beginner`,question:`Dictionary vs list.`,answer:`A list is an ordered collection you typically access by numeric index (position), while a dictionary stores key-value pairs and you access values by their key rather than position. I'd use a dictionary when I need fast lookups by a meaningful identifier — like storing agent state in the FNB pipeline, where I access fields by name such as 'generated_sql' — and a list when order matters and I'm mostly iterating through items rather than looking one up directly.`,keyPoints:[`List: ordered, accessed by numeric index`,`Dictionary: key-value pairs, accessed by key`,`Dictionaries suit fast lookup by meaningful identifier; lists suit ordered iteration`],followUps:[`What is the time complexity of a dictionary lookup versus searching a list?`,`When would you use a list of dictionaries?`],tags:[`python`,`data-structures`]},{id:`py-005`,category:`Python`,difficulty:`Beginner`,question:`What is a function?`,answer:`A function is a named, reusable block of code that performs a specific task, optionally taking inputs (parameters) and returning an output. Functions let you avoid repeating the same logic in multiple places and make code easier to read and test, since you can name a function to describe what it does and test it in isolation, which is exactly how I structured the smaller pieces of logic within each agent in the FNB pipeline.`,keyPoints:[`Named, reusable block of code performing a specific task`,`Takes optional parameters, can return an output`,`Improves readability and testability by isolating logic`],followUps:[`What is the difference between a parameter and an argument?`,`What does it mean for a function to have side effects?`],tags:[`python`,`functions`]},{id:`py-006`,category:`Python`,difficulty:`Beginner`,question:`What is a class?`,answer:`A class is a blueprint for creating objects that bundle together data (attributes) and behaviour (methods) related to a concept. For example, I might define a class to represent an agent's configuration, with attributes like its model name and system prompt, and methods for how it processes input, so I can create multiple instances with different configurations while reusing the same structure and logic.`,keyPoints:[`A blueprint for creating objects bundling data and behaviour`,`Attributes hold data, methods define behaviour`,`Allows creating multiple instances sharing structure but with different data`],followUps:[`What is the difference between a class and an instance (object)?`,`What is __init__ used for in a Python class?`],tags:[`python`,`oop`]},{id:`py-007`,category:`Python`,difficulty:`Beginner`,question:`What is object-oriented programming?`,answer:`Object-oriented programming is a way of structuring code around objects — instances of classes that bundle data and behaviour together — rather than just a sequence of functions operating on separate data. Key ideas include encapsulation (bundling data with the methods that operate on it), inheritance (building new classes from existing ones), and polymorphism (different classes responding to the same method call in their own way). It helps organise larger codebases, like separating each agent's logic into its own well-defined class.`,keyPoints:[`Structures code around objects bundling data and behaviour`,`Key concepts: encapsulation, inheritance, polymorphism`,`Helps organise larger codebases into well-defined, related units`],followUps:[`Can you give an example of polymorphism in a project you have built?`,`When would you prefer plain functions over an object-oriented approach?`],tags:[`python`,`oop`]},{id:`py-008`,category:`Python`,difficulty:`Beginner`,question:`What is inheritance?`,answer:`Inheritance lets a class (the child or subclass) reuse and extend the attributes and methods of another class (the parent or base class), so you don't have to duplicate shared logic. For example, if I had a base Agent class with common setup logic, I could have RequirementAgent, CodeAgent and VerifierAgent each inherit from it and reuse that shared setup, while overriding only the specific behaviour unique to each.`,keyPoints:[`Child class reuses and extends a parent class's attributes/methods`,`Avoids duplicating shared logic across related classes`,`Example: a shared base Agent class extended by specific agent types`],followUps:[`What is the difference between inheritance and composition?`,`What is method overriding?`],tags:[`python`,`oop`]},{id:`py-009`,category:`Python`,difficulty:`Intermediate`,question:`What is exception handling?`,answer:`Exception handling lets you catch and respond to errors that occur while a program is running, using try/except blocks, instead of letting the whole program crash. In the FNB pipeline, I'd wrap the database execution step in a try/except so that if a connection error occurs, we can catch it, log it clearly, and return a sensible error to the user, rather than the whole service going down unexpectedly.`,keyPoints:[`Catches and responds to runtime errors using try/except`,`Prevents the whole program from crashing on an error`,`Example: catching database connection errors during query execution`],followUps:[`What is the difference between except Exception and catching a specific exception type?`,`What does a finally block do?`],tags:[`python`,`error-handling`]},{id:`py-010`,category:`Python`,difficulty:`Intermediate`,question:`What are decorators?`,answer:`A decorator is a function that wraps another function to add extra behaviour before or after it runs, without modifying the original function's own code. A common example is a logging decorator that records how long a function took to execute, which would be useful for timing how long each agent step takes in the FNB pipeline without cluttering each agent's core logic with timing code.`,keyPoints:[`A function that wraps another function to add extra behaviour`,`Doesn't modify the original function's own code`,`Example use: logging/timing wrapper around a function`],followUps:[`Can you write a simple example of a timing decorator?`,`What is the @ syntax actually doing under the hood?`],tags:[`python`,`decorators`]},{id:`py-011`,category:`Python`,difficulty:`Intermediate`,question:`What are list comprehensions?`,answer:`A list comprehension is a compact way to create a new list by applying an expression to each item in an existing iterable, optionally filtering items, all in a single readable line instead of a multi-line for loop. For example, extracting just the table names from a list of schema objects could be written as a single comprehension rather than a separate loop with an append call each time.`,keyPoints:[`Compact syntax for building a list from an iterable in one line`,`Can include a filtering condition`,`More concise than an equivalent multi-line for loop with append`],followUps:[`Can you write a list comprehension that filters as well as transforms?`,`When would a plain for loop be more readable than a comprehension?`],tags:[`python`,`list-comprehension`]},{id:`py-012`,category:`Python`,difficulty:`Beginner`,question:`What is a virtual environment?`,answer:`A virtual environment is an isolated Python setup with its own installed packages, separate from your system-wide Python installation. It means different projects can use different, even conflicting, versions of the same library without interfering with each other. I use one for every project, including the FNB pipeline, so its exact dependencies are reproducible and don't clash with what's installed for StudyTogether or anything else on my machine.`,keyPoints:[`Isolated Python setup with its own package installations`,`Prevents dependency conflicts between different projects`,`Keeps each project's dependencies reproducible and separate`],followUps:[`What tools have you used to create virtual environments?`,`How would you share your exact dependencies with a teammate?`],tags:[`python`,`virtual-environment`]},{id:`py-013`,category:`Python`,difficulty:`Beginner`,question:`What is pip?`,answer:`Pip is Python's standard package manager — it's how you install, upgrade and remove third-party libraries, like installing LangGraph or FastAPI for a project. It reads a requirements file, if you have one, to install a specific, reproducible set of dependencies, which is how I make sure the FNB project's dependencies are consistent across different team members' machines.`,keyPoints:[`Python's standard package manager`,`Installs, upgrades and removes third-party libraries`,`requirements.txt allows reproducible dependency installation across machines`],followUps:[`What is the difference between pip install and pip freeze?`,`What is requirements.txt used for exactly?`],tags:[`python`,`pip`]},{id:`py-014`,category:`Python`,difficulty:`Beginner`,question:`What is an API?`,answer:`An API, or Application Programming Interface, is a defined way for one piece of software to communicate with another — a set of endpoints, inputs and outputs that lets you request data or trigger actions without needing to know how the other system works internally. In the FNB project, our pipeline could be exposed as an API so another application could send a natural-language request and receive back a structured, verified result.`,keyPoints:[`A defined way for software systems to communicate`,`Exposes endpoints with defined inputs/outputs, hiding internal implementation`,`Would be how the FNB pipeline gets exposed to other applications`],followUps:[`What is the difference between a REST API and other API styles you have heard of?`,`What would a request to your FNB pipeline's API look like?`],tags:[`python`,`api`]},{id:`py-015`,category:`Python`,difficulty:`Beginner`,question:`What is JSON?`,answer:`JSON, or JavaScript Object Notation, is a lightweight, text-based data format for representing structured data using key-value pairs, lists, and nested objects — it's language-independent despite the name, and it's the most common format for exchanging data between APIs. In the FNB pipeline, the structured specification passed between the Requirement Agent and Code Agent could naturally be represented as JSON, since it maps cleanly to nested keys like entities and filters.`,keyPoints:[`Lightweight, text-based format for structured data (key-value pairs, lists, nesting)`,`Language-independent, widely used for API data exchange`,`A natural fit for representing the structured spec passed between FNB agents`],followUps:[`How would you validate that a JSON structure matches an expected schema?`,`What is the difference between JSON and a Python dictionary?`],tags:[`python`,`json`]},{id:`py-016`,category:`Python`,difficulty:`Intermediate`,question:`What is FastAPI?`,answer:`FastAPI is a modern Python web framework for building APIs quickly, with built-in support for data validation using type hints, automatic interactive documentation, and good performance thanks to being built on asynchronous foundations. I'd use it to expose the FNB pipeline as an HTTP service — defining an endpoint that accepts a natural-language request and returns the verified query result, with FastAPI automatically validating the incoming request shape.`,keyPoints:[`Modern Python framework for building APIs quickly`,`Uses type hints for automatic data validation`,`Provides automatic interactive documentation and good async performance`],followUps:[`How does FastAPI's use of type hints actually enable validation?`,`What does "asynchronous" mean in this context, and why does it help performance?`],tags:[`python`,`fastapi`]},{id:`py-017`,category:`Python`,difficulty:`Beginner`,question:`Why use FastAPI?`,answer:`It's fast to develop with, has excellent built-in support for validating request and response data automatically using Python type hints, and generates interactive API documentation for free, which is genuinely useful for teammates integrating with your API. It's also built for asynchronous operations, which suits an AI pipeline well since LLM calls can be slow and you don't want the whole service blocked waiting on one request.`,keyPoints:[`Fast development with automatic request/response validation via type hints`,`Free interactive API documentation, useful for team collaboration`,`Async support suits latency-sensitive AI pipelines well`],followUps:[`What alternative Python web frameworks have you heard of, and how do they compare?`,`How would async support specifically help the FNB pipeline?`],tags:[`python`,`fastapi`]},{id:`py-018`,category:`Python`,difficulty:`Intermediate`,question:`How would you debug Python code?`,answer:`I start by reproducing the issue reliably with the smallest possible example, then read the traceback carefully since it usually points directly at the failing line. I use print statements or logging for quick checks, and a proper debugger with breakpoints when I need to inspect variables at a specific point in execution, which I found especially useful when tracing why an agent's state didn't have a field I expected in the FNB pipeline. I also isolate the failing component and test it on its own rather than debugging within the full pipeline, which makes the problem much easier to pin down.`,keyPoints:[`Reproduce reliably with the smallest example first`,`Read the traceback carefully; use print/logging or a proper debugger with breakpoints`,`Isolate the failing component rather than debugging within the full system`],followUps:[`Can you walk through a specific bug you debugged this way on the FNB project?`,`What tools do you use for debugging beyond print statements?`],tags:[`python`,`debugging`]}],ia=[{id:`sql-001`,category:`SQL & Databases`,difficulty:`Beginner`,question:`What is SQL?`,answer:`SQL, Structured Query Language, is the standard language for interacting with relational databases — defining, querying, and modifying structured data organised in tables. In the FNB project, SQL is exactly what our Code Agent generates and what ultimately gets executed, read-only, against our PostgreSQL database to answer a user's banking request.`,keyPoints:[`Standard language for interacting with relational databases`,`Used to define, query and modify structured, table-based data`,`Directly what the FNB Code Agent generates`],followUps:[`What are the main categories of SQL statements (DDL, DML, etc.)?`,`What makes a database "relational"?`],tags:[`sql`,`fundamentals`]},{id:`sql-002`,category:`SQL & Databases`,difficulty:`Beginner`,question:`What is a relational database?`,answer:`A relational database stores data in structured tables made up of rows and columns, where relationships between tables are defined through keys — like a customer table linked to a transactions table via a customer ID. This structure enforces consistency and lets you combine related data across tables efficiently, which is exactly the kind of structure our banking schema relies on for the Verifier Agent to check queries against.`,keyPoints:[`Stores data in structured tables of rows and columns`,`Relationships between tables defined via keys`,`Enforces consistency and allows efficient combination of related data`],followUps:[`What is the alternative to a relational database, and when would you use one?`,`How does a foreign key enforce a relationship?`],tags:[`sql`,`relational-database`]},{id:`sql-003`,category:`SQL & Databases`,difficulty:`Beginner`,question:`What is PostgreSQL?`,answer:`PostgreSQL is an open-source, production-grade relational database management system known for strong standards compliance, reliability, and rich support for roles, permissions, and schema introspection. It's the database we used for the FNB project, specifically because its granular permission system let us enforce genuine read-only access at the database level, not just in application code.`,keyPoints:[`Open-source, production-grade relational database system`,`Known for standards compliance, reliability, and rich permission features`,`Chosen for the FNB project specifically for its granular role-based permissions`],followUps:[`What other databases have you used or considered, and how do they compare?`,`How exactly did you configure the read-only role in PostgreSQL?`],tags:[`postgresql`,`fnb`]},{id:`sql-004`,category:`SQL & Databases`,difficulty:`Beginner`,question:`What is a primary key?`,answer:`A primary key is a column, or combination of columns, that uniquely identifies each row in a table — no two rows can share the same primary key value, and it can't be null. For example, an account_id column in an accounts table would typically be the primary key, guaranteeing each account record is uniquely identifiable.`,keyPoints:[`Uniquely identifies each row in a table`,`Must be unique and non-null`,`Example: account_id in an accounts table`],followUps:[`Can a primary key span multiple columns? Give an example.`,`What happens if you try to insert a duplicate primary key value?`],tags:[`sql`,`primary-key`]},{id:`sql-005`,category:`SQL & Databases`,difficulty:`Beginner`,question:`What is a foreign key?`,answer:`A foreign key is a column in one table that references the primary key of another table, establishing a relationship between them and enforcing that the referenced value actually exists. For example, a transactions table might have an account_id foreign key referencing the accounts table, ensuring you can't record a transaction for an account that doesn't exist.`,keyPoints:[`A column referencing another table's primary key`,`Establishes and enforces a relationship between tables`,`Example: transactions.account_id referencing accounts.account_id`],followUps:[`What happens if you try to delete a row that other rows reference via a foreign key?`,`What does ON DELETE CASCADE do?`],tags:[`sql`,`foreign-key`]},{id:`sql-006`,category:`SQL & Databases`,difficulty:`Beginner`,question:`What is a JOIN?`,answer:`A JOIN combines rows from two or more tables based on a related column between them, usually a foreign key relationship, so you can query data that spans multiple tables in a single result. For example, joining accounts and transactions on account_id lets you list each transaction alongside the account holder's details, rather than looking them up separately.`,keyPoints:[`Combines rows from multiple tables based on a related column`,`Usually joins on a foreign key relationship`,`Lets you query data spanning multiple tables in one result`],followUps:[`What are the main types of JOIN you know?`,`What happens if the join column has duplicate values on one side?`],tags:[`sql`,`join`]},{id:`sql-007`,category:`SQL & Databases`,difficulty:`Intermediate`,question:`INNER JOIN vs LEFT JOIN.`,answer:`An INNER JOIN only returns rows where there's a match in both tables — if an account has no transactions, it wouldn't appear at all in an INNER JOIN between accounts and transactions. A LEFT JOIN returns all rows from the left table regardless of whether there's a match in the right table, filling in NULLs for the right table's columns when there's no match — so every account would appear, even ones with zero transactions, with NULLs where transaction data would be.`,keyPoints:[`INNER JOIN: only matching rows from both tables`,`LEFT JOIN: all rows from the left table, NULLs where no match exists on the right`,`Choice depends on whether you need unmatched left-side rows included`],followUps:[`When would a LEFT JOIN be the wrong choice for a banking query?`,`What is a RIGHT JOIN, and why is it used less often than LEFT JOIN?`],tags:[`sql`,`join`]},{id:`sql-008`,category:`SQL & Databases`,difficulty:`Intermediate`,question:`What is normalization?`,answer:`Normalization is the process of organising a database schema to reduce data redundancy and improve consistency, typically by splitting data into related tables rather than repeating the same information across many rows. For example, instead of storing a customer's full name and address in every transaction row, you'd store customer details once in a customers table and reference it by ID from the transactions table.`,keyPoints:[`Organises schema to reduce redundancy and improve consistency`,`Splits data into related tables rather than repeating it`,`Example: customer details stored once, referenced by ID elsewhere`],followUps:[`What are normal forms, and can you describe one briefly?`,`When might you deliberately denormalize a schema?`],tags:[`sql`,`normalization`]},{id:`sql-009`,category:`SQL & Databases`,difficulty:`Intermediate`,question:`What is an index?`,answer:`An index is a data structure that speeds up lookups on a table, similar to an index at the back of a book — instead of scanning every row to find what you need, the database can jump straight to relevant rows. Indexes are usually created on columns that are frequently searched or joined on, like account_id, but they come with a trade-off: they speed up reads but slow down writes slightly and take up extra storage.`,keyPoints:[`Speeds up row lookups, similar to a book's index`,`Typically created on frequently searched or joined columns`,`Trade-off: faster reads, slower writes, extra storage`],followUps:[`Why would you not just index every column?`,`What is the difference between a clustered and non-clustered index, if you know?`],tags:[`sql`,`index`]},{id:`sql-010`,category:`SQL & Databases`,difficulty:`Beginner`,question:`Why are indexes useful?`,answer:`They make queries on large tables dramatically faster by letting the database avoid scanning every single row. In a banking context with potentially millions of transaction rows, an index on account_id or transaction date could be the difference between a query returning instantly versus taking a long time, which matters a lot for a system meant to answer requests interactively.`,keyPoints:[`Dramatically speed up queries by avoiding full table scans`,`Especially valuable on large tables like banking transactions`,`Directly impacts interactive query responsiveness`],followUps:[`How would you decide which columns to index in the FNB schema?`,`What is the risk of over-indexing a table?`],tags:[`sql`,`index`,`performance`]},{id:`sql-011`,category:`SQL & Databases`,difficulty:`Intermediate`,question:`What is a transaction?`,answer:`In database terms, a transaction is a group of one or more operations that are executed as a single unit — either all of them succeed and are committed, or if something fails, all of them are rolled back, leaving the database as if none of them happened. This matters enormously in banking: if you're debiting one account and crediting another, you need both to succeed together, or neither, to avoid money disappearing or duplicating.`,keyPoints:[`A group of operations executed as a single all-or-nothing unit`,`Either fully committed or fully rolled back on failure`,`Critical for banking operations like transferring funds between accounts`],followUps:[`What would happen without transactions in a funds-transfer scenario?`,`How does this relate to why our FNB pipeline is read-only, avoiding this risk entirely?`],tags:[`sql`,`transactions`]},{id:`sql-012`,category:`SQL & Databases`,difficulty:`Intermediate`,question:`What is ACID?`,answer:`ACID describes the properties that guarantee reliable database transactions: Atomicity (all operations in a transaction succeed or none do), Consistency (a transaction brings the database from one valid state to another, respecting all rules), Isolation (concurrent transactions don't interfere with each other), and Durability (once committed, changes survive even a crash). Banking systems rely heavily on these guarantees since financial data absolutely cannot be left in an inconsistent state.`,keyPoints:[`Atomicity, Consistency, Isolation, Durability`,`Guarantees reliable behaviour of database transactions`,`Especially critical in banking, where inconsistent financial data is unacceptable`],followUps:[`Can you give a concrete banking example that illustrates Isolation specifically?`,`What could go wrong without Durability?`],tags:[`sql`,`acid`]},{id:`sql-013`,category:`SQL & Databases`,difficulty:`Intermediate`,question:`What is SQL injection?`,answer:`SQL injection is an attack where untrusted input is inserted directly into a SQL query in a way that lets an attacker change the query's meaning — for example, injecting input that closes a string early and appends malicious SQL, potentially exposing or modifying data the attacker shouldn't access. It's especially relevant to our FNB project because the Code Agent generates SQL from user-controlled natural language, so we have to think about SQL injection-style risks even though the mechanism is an LLM rather than raw string concatenation.`,keyPoints:[`Untrusted input inserted into a query changes its intended meaning`,`Can expose or modify unauthorised data`,`Relevant to the FNB project since user input flows into generated SQL, even via an LLM`],followUps:[`How is the risk different when an LLM generates SQL versus classic string concatenation?`,`What is a parameterised query, and how does it prevent this?`],tags:[`sql`,`security`,`sql-injection`]},{id:`sql-014`,category:`SQL & Databases`,difficulty:`Intermediate`,question:`How do you prevent SQL injection?`,answer:`The standard defence in traditional applications is using parameterised queries or prepared statements, which keep user input separate from the SQL command structure so it can never be interpreted as code. For an AI-generated SQL system like the FNB pipeline, we add extra layers: the Verifier Agent checks that generated SQL only references real schema elements and is a read-only SELECT, and the database connection itself uses a read-only role as a final backstop, so even a successful injection-style attempt couldn't modify data.`,keyPoints:[`Parameterised queries/prepared statements separate input from SQL structure`,`For AI-generated SQL, add independent verification against schema and statement-type rules`,`Read-only database role as a final defence-in-depth backstop`],followUps:[`Why isn't a parameterised query alone sufficient for an LLM-based SQL generation pipeline?`,`What would happen if the Verifier Agent had a bug and let something malicious through?`],tags:[`sql`,`security`]},{id:`sql-015`,category:`SQL & Databases`,difficulty:`Intermediate`,question:`PostgreSQL vs SQLite.`,answer:`SQLite is a lightweight, file-based database that's great for small projects, prototypes, or local development because it needs no separate server. PostgreSQL is a full client-server database designed for production use, with much stronger support for concurrent users, fine-grained roles and permissions, and larger datasets. For the FNB project, PostgreSQL was the right choice because we needed genuine role-based read-only access and a setup that reflects how a real banking system would actually be deployed.`,keyPoints:[`SQLite: lightweight, file-based, good for prototypes/local development`,`PostgreSQL: full client-server database for production, concurrency, and fine-grained permissions`,`FNB chose PostgreSQL specifically for realistic role-based access control`],followUps:[`What would break if you tried to use SQLite for the FNB project instead?`,`When would SQLite actually be the better choice?`],tags:[`postgresql`,`sqlite`]},{id:`sql-016`,category:`SQL & Databases`,difficulty:`Intermediate`,question:`Why did you move your project from SQLite to PostgreSQL?`,answer:`For early prototyping, SQLite is fast and convenient since there's no setup involved, which is useful when you're just proving out an idea. But once we needed genuine role-based access control — a real read-only database role rather than just an application-level convention — and wanted the project to reflect a realistic banking environment, PostgreSQL was the natural move, since SQLite doesn't really support that kind of fine-grained permission model in the same way.`,keyPoints:[`SQLite convenient for early, fast prototyping without setup`,`PostgreSQL c
